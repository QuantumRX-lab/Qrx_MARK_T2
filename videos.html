<div class="qrx-wrap">

  <div class="qrx-header">
    <div class="qrx-brand">
      <div class="qrx-brand-name">Quantum<span>Rx</span></div>
      <span class="qrx-sep">/</span>

    </div>

      <div class="qrx-live-dot"></div>
      <span id="live-label">Loading...</span>
    </div>
  </div>

    <button class="qrx-vtab active" data-vertical="all">All</button>
    <button class="qrx-vtab" data-vertical="ai">AI</button>
    <button class="qrx-vtab" data-vertical="robotics">Robotics</button>
    <button class="qrx-vtab" data-vertical="semis">Semis</button>
    <button class="qrx-vtab" data-vertical="quantum">Quantum</button>
    <button class="qrx-vtab" data-vertical="space">Space</button>
  </div>

  <div class="qrx-content">

    <div class="qrx-title-row">
      <div>
        <div class="qrx-page-title" id="page-title">Loading videos...</div>
        <div class="qrx-page-meta" id="page-meta"></div>
      </div>
      <div class="qrx-badge-live">● Live</div>
    </div>

    <div id="vid-list">
      <div class="qrx-loading">Loading videos...</div>
    </div>

  </div>
</div>

<script>
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function safeUrl(url) {
  if (!url) return '';
  try { var u = new URL(url); return (u.protocol === 'https:' || u.protocol === 'http:') ? url : ''; }
  catch (e) { return ''; }
}

var VERTICAL_LABEL = { ai: 'AI', robotics: 'Robotics', semis: 'Semis', quantum: 'Quantum', space: 'Space' };
var allItems = [];
var currentVertical = 'all';

function timeAgo(ts) {
  if (!ts) return '';
  var diff = Math.floor((Date.now() - ts) / 60000);
  if (diff < 60) return diff + 'm ago';
  if (diff < 1440) return Math.floor(diff / 60) + 'h ago';
  return Math.floor(diff / 1440) + 'd ago';
}

function buildRow(item) {
  var url = safeUrl(item.link || item.url);
  var img = safeUrl(item.image);
  return '<a class="qrx-vid-row" href="' + esc(url) + '" target="_blank" rel="noopener">'
    + '<div class="qrx-vid-thumb">'
    + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" onerror="this.remove()">' : '')
    + '<div class="qrx-vid-play">▶</div>'
    + '</div>'
    + '<div class="qrx-vid-body">'
    + '<div class="qrx-vid-vertical">' + esc(VERTICAL_LABEL[item.vertical] || item.vertical || '') + '</div>'
    + '<div class="qrx-vid-title">' + esc(item.title || '') + '</div>'
    + (item.summary ? '<div class="qrx-vid-summary">' + esc(item.summary) + '</div>' : '')
    + '<div class="qrx-vid-footer">' + esc(item.source || '') + (item.published ? ' &middot; ' + timeAgo(item.published) : '') + '</div>'
    + '</div></a>';
}

function render() {
  var list = document.getElementById('vid-list');
  var items = currentVertical === 'all'
    ? allItems
    : allItems.filter(function (it) { return it.vertical === currentVertical; });

  if (!items.length) {
    list.innerHTML = '<div class="qrx-loading">No videos in this category right now.</div>';
    return;
  }
  list.innerHTML = '<div class="qrx-vid-list">' + items.map(buildRow).join('') + '</div>';
}

document.querySelectorAll('.qrx-vtab').forEach(function (tab) {
  tab.addEventListener('click', function () {
    document.querySelectorAll('.qrx-vtab').forEach(function (t) { t.classList.remove('active'); });
    tab.classList.add('active');
    currentVertical = tab.dataset.vertical;
    render();
  });
});

async function loadVideos() {
  try {
    const res = await fetch('https://forge.quantumrx.eu/api/news-feed?category=video');
    const data = await res.json();

    if (!data.items || data.items.length === 0) {
      document.getElementById('page-title').textContent = 'No videos yet';
      document.getElementById('page-meta').textContent = 'Check back after the next daily refresh';
      document.getElementById('live-label').textContent = 'Waiting for refresh';
      document.getElementById('vid-list').innerHTML =
        '<div class="qrx-loading">No videos available. Check back shortly.</div>';
      return;
    }

    allItems = data.items;
    const updated = data.updated ? new Date(data.updated) : null;
    const dateStr = updated
      ? updated.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
      : '';

    document.getElementById('page-title').textContent = 'Watch';
    document.getElementById('page-meta').textContent =
      `${allItems.length} videos across AI, robotics, semis, quantum, and space · Updated ${dateStr}`;
    document.getElementById('live-label').textContent = `Updated ${dateStr}`;

    render();
  } catch (err) {
    console.error('Failed to load videos:', err);
    document.getElementById('page-title').textContent = 'Failed to load';
    document.getElementById('vid-list').innerHTML =
      '<div class="qrx-loading">Could not load videos. Please refresh.</div>';
  }
}

loadVideos();
</script>

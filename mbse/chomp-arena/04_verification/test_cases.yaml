# Chomp Arena — Test Cases
# Schema per mbse/infrastructure/04_verification/test_cases.yaml.
# This file is the source of truth for the requirement<->test trace: each
# requirement's `verified_by` list is generated from the `verifies` lists
# below, so the trace cannot drift or become one-directional.
# Nothing is built yet — every status is NOT_STARTED.

test_cases:

  - id: CHOMP-TC-001
    title: A new player understands the game in 60 seconds
    verifies: [CHOMP-STK-001]
    type: ACCEPTANCE
    method: DEMONSTRATION
    preconditions: ["A player who has never seen the game", "No verbal explanation given"]
    test_data: {observer: "silent, timing only"}
    procedure:
      - "Spawn the player into a live round and say nothing"
      - "Time until they eat a pellet, until they bank, and until they attack another player"
      - "Afterwards ask them: what happens if someone hits your back?"
    expected_result: Eating within 15 s, banking within 60 s, and a correct answer on directional combat.
    pass_criteria:
      - "all three actions performed without instruction inside 60 s"
      - "player can state the mouth/flank rule unprompted"
    automation: MANUAL
    status: NOT_STARTED
    phase: v1

  - id: CHOMP-TC-002
    title: A 7-year-old and an adult share a lobby
    verifies: [CHOMP-STK-002, CHOMP-SYS-031]
    type: ACCEPTANCE
    method: DEMONSTRATION
    preconditions: ["One child player, one experienced adult player, one full match"]
    test_data: {match: "5 rounds, free-for-all"}
    procedure:
      - "Play a full match with both players"
      - "Record the child's banked total per round and how often they were hit by the adult"
      - "Ask the child at each gate whether they can go in, without letting them read the number aloud"
    expected_result: The child banks in every round, is not repeatedly farmed, and answers gate readiness from colour alone.
    pass_criteria:
      - "child's banked total rises every round"
      - "no round in which the child is hit by the adult more than twice"
      - "gate readiness answered correctly from colour without reading digits"
    automation: MANUAL
    status: NOT_STARTED
    phase: v1

  - id: CHOMP-TC-003
    title: Being chomped costs carry, never the round
    verifies: [CHOMP-STK-003, CHOMP-SYS-015]
    type: SYSTEM
    method: TEST
    preconditions: ["Player at empty bar carrying a known point total"]
    test_data: {carried: 400, bar: 0}
    procedure:
      - "Take a side hit at empty bar"
      - "Time from burst to controllable respawn"
      - "Compare scattered pellet value and retained upgrades"
    expected_result: 200 points scatter, respawn at own garage inside 4 s, chassis and upgrades unchanged.
    pass_criteria: ["respawn <= 4 s", "50% +/- 1 point scattered", "no upgrade lost", "no elimination state exists"]
    automation: AUTOMATED
    status: NOT_STARTED
    phase: v1

  - id: CHOMP-TC-004
    title: Rounds, intermission and a declared winner
    verifies: [CHOMP-STK-004, CHOMP-SYS-027]
    type: SYSTEM
    method: TEST
    preconditions: ["A full match played to completion"]
    test_data: {rounds: 5, round_seconds: 360, intermission_seconds: 30}
    procedure:
      - "Play a match end to end"
      - "Check each round ends on time, each intermission allows spending, standings are visible throughout"
      - "Check the declared winner matches the highest total banked"
    expected_result: Five timed rounds, four intermissions, a correct winner.
    pass_criteria: ["round lengths within 1 s of config", "winner equals max banked total", "standings visible in every round"]
    automation: AUTOMATED
    status: NOT_STARTED
    phase: v1

  - id: CHOMP-TC-005
    title: Safety inspection before any wider publish
    verifies: [CHOMP-STK-005, CHOMP-SYS-034, CHOMP-SYS-035, CHOMP-SYS-036]
    type: SYSTEM
    method: INSPECTION
    preconditions: ["Place open in Studio", "Experience settings page open"]
    test_data: {scope: "whole DataModel"}
    procedure:
      - "Search the whole DataModel for Script, LocalScript and ModuleScript instances outside the engine folders"
      - "Confirm every remaining script is one the owner wrote or has read"
      - "Confirm experience access is Private (or Friends, post-v3) and set by the owner's account"
      - "Search for TextBox instances and for any label whose text is assigned from player input"
    expected_result: No unread third-party script, no runtime player-authored text surface, access no wider than intended.
    pass_criteria: ["zero unread scripts", "zero TextBox instances", "zero player-sourced label assignments", "access setting correct"]
    automation: HYBRID
    status: NOT_STARTED
    phase: v1

  - id: CHOMP-TC-006
    title: Client-authority threat model walk-through
    verifies: [CHOMP-STK-006]
    type: SYSTEM
    method: ANALYSIS
    preconditions: ["Engine source complete for the phase under test"]
    test_data: {scope: "every RemoteEvent and RemoteFunction in ReplicatedStorage"}
    procedure:
      - "List every remote the client can fire"
      - "For each, write down what an attacker sending arbitrary arguments at 1000/s could achieve"
      - "Confirm each handler re-derives every value it trusts from server state, and rate-limits"
      - "Confirm no remote accepts a points, dollars, Power, bar or hit value as an argument"
    expected_result: No remote through which a client can manufacture economy, power or combat outcomes.
    pass_criteria:
      - "every remote handler validates sender identity and re-derives values server-side"
      - "no remote signature carries an economic or combat quantity"
      - "every remote is rate-limited"
    automation: MANUAL
    status: NOT_STARTED
    phase: v1


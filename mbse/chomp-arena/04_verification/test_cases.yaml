      - "Join the same round from a phone and play a full lap of the outer ring"
      - "Confirm pellet instances are reused rather than created and destroyed"
    expected_result: 30+ FPS on the laptop throughout, under 4000 parts, playable touch controls, HUD fully on screen.
    pass_criteria: ["FPS >= 30 at all times on the laptop", "live parts < 4000", "no GUI element off screen on the phone", "pellet instance count stable across the round"]
    automation: HYBRID
    status: NOT_STARTED
    phase: v1


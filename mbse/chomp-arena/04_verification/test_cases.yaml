    procedure:
      - "Set WalkSpeed far above the server value from the client"
      - "Observe the server-side position delta and the correction"
    expected_result: The server-held value is reasserted and the player does not travel at the forged speed.
    pass_criteria: ["correction applied within 1 s", "no pellet is credited from the forged movement"]
    automation: AUTOMATED
    status: NOT_STARTED

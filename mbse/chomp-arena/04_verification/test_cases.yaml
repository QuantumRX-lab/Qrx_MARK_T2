    verifies: [CHOMP-SYS-010, CHOMP-SYS-011]
    type: INTEGRATION
    method: TEST
    preconditions: ["Two players with controlled bar values"]
    test_data: {cases: ["100 v 40", "100 v 95", "approach angles 0, 30, 44, 46, 90 degrees"]}
    procedure:
      - "Collide mouth to mouth at each approach angle and record the classification"
      - "Run the 100 v 40 case and check both bars and the loser's carry"
      - "Run the 100 v 95 case and check for a clang"
    expected_result: Angles within 45 degrees classify head-on; both lose 40% bar; the lower bar loses the difference from carry; near-equal bars clang without point loss.
    pass_criteria:
      - "classification boundary correct at 44 and 46 degrees"
      - "both bars reduced 40%"
      - "overflow equals the bar difference and comes from carry"
      - "clang inside 10% costs no points and bounces both"

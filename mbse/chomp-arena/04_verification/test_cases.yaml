    expected_result: Forged claims credit nothing; legitimate eating adds value x combo to both bar and carry; pellets respawn on schedule.
    pass_criteria: ["zero points from forged claims", "bar and carry both credited correctly", "bar capped at chassis capacity", "carry uncapped"]

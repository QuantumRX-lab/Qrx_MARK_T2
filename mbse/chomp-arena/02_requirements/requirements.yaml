# Chomp Arena — Requirements
#
# Schema mirrors mbse/infrastructure/02_requirements/requirements.yaml (Medha
# MBSE _framework/schemas/requirement.schema.yaml), with one deliberate
# difference: `satisfied_by` (repo file paths) is replaced by `allocated_to`,
# a Roblox DataModel path, because the artefact is a .rbxl place file rather
# than files in this repo. validate.py checks it resolves to a real service.
#
# Phases follow the owner's decision (D-CHOMP-001) to build a good game first
# and the children's authoring kit second:
#
#   v1  The game. Playable, fun, complete as an experience. One map, two
#       ghosts, one gated ring. Hard-coding is acceptable here.
#   v2  Content and modes. The remaining maps, ghosts, rings, team and solo
#       modes, cosmetics.
#   v3  The authoring kit. Tags, attributes, mirror tool, Check My Maze,
#       ChompConfig — the children build their own content.
#
# `verified_by` lists are generated from 04_verification/test_cases.yaml
# rather than hand-maintained, so the trace cannot be one-directional.
# Nothing is built yet: every verification_status is NOT_STARTED and that is
# honest, not an oversight.

requirements:

  # ── L1 stakeholder ──────────────────────────────────────────────────────

  - id: CHOMP-STK-001
    title: Understandable without being explained
    shall_statement: >
      A player who has never seen the game SHALL understand eating, banking and
      directional combat within 60 seconds of their first spawn, without a
      tutorial, a wall of text, or another player explaining it.
    level: L1_stakeholder
    status: APPROVED
    priority: CRITICAL
    verified_by: [CHOMP-TC-001]
    verification_status: NOT_STARTED
    verification_method: DEMONSTRATION
    rationale: >
      The mechanics are borrowed from a game everyone already knows, which is
      most of the work — but only if the game reads at a glance: mouth-forward
      vehicles, a visible bar, a visible carry, and a garage that looks like
      home.
    allocated_to: StarterGui/ChompHud
    chain: CHAIN-UI
    automation_exempt_reason: >
      Whether a child understands the game without being told is only
      observable by watching a child who has not been told. No harness can
      stand in for that. CHOMP-TC-001 stays manual by nature; the readability
      mechanisms it depends on are covered automatically by CHOMP-TC-040.
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-STK-002
    title: A child and an adult can share a lobby
    shall_statement: >
      A 7-year-old and an experienced adult SHALL be able to play the same
      match without the child being farmed, unable to progress, or unable to
      score.
    level: L1_stakeholder
    status: APPROVED
    priority: CRITICAL
    verified_by: [CHOMP-TC-002, CHOMP-TC-043]
    verification_status: NOT_STARTED
    verification_method: DEMONSTRATION
    rationale: >
      This is the requirement most likely to be silently violated, because it
      cannot be checked by reading code — only by watching a real child play
      against a real adult. Three mechanisms defend it: ring gating separates
      by strength, the small-fry rule removes the reward for bullying down,
      and per-match reset stops veterans starting ahead.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-MATCH
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-STK-003
    title: Nobody ever sits out
    shall_statement: >
      No game state SHALL remove a player from play for longer than 5 seconds,
      and no player SHALL be eliminated from a round.
    level: L1_stakeholder
    status: APPROVED
    priority: CRITICAL
    verified_by: [CHOMP-TC-003]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      A child who is out of the game is a child who has left the room. This is
      why being chomped is a respawn rather than a death.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-STK-004
    title: A match has a shape and an ending
    shall_statement: >
      Play SHALL be structured into timed rounds within a match, with visible
      standings, a spending intermission, and a declared winner at the end.
    level: L1_stakeholder
    status: APPROVED
    priority: HIGH
    verified_by: [CHOMP-TC-004]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      An endless arena has no payoff and no natural moment to stop, which
      matters when the players have bedtimes. Rounds also give the upgrade
      curve somewhere to land.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-MATCH
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-STK-005
    title: Safe for children
    shall_statement: >
      The experience SHALL be published from the owner's account, private
      during development and no wider than Friends afterwards, SHALL render no
      player-authored text at runtime, and SHALL contain no third-party script
      the owner has not read.
    level: L1_stakeholder
    status: APPROVED
    priority: CRITICAL
    verified_by: [CHOMP-TC-005]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      Toolbox free models are a known malware vector, and any surface that
      renders another player's words is a moderation surface. The cheapest
      correct answer at this scale is to have no such surface at all.
    allocated_to: Players
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-STK-006
    title: A client cannot manufacture anything
    shall_statement: >
      No client SHALL be able to create points, dollars, Power, bar charge,
      gate passage, or a combat hit that the server did not itself compute.
    level: L1_stakeholder
    status: APPROVED
    priority: CRITICAL
    verified_by: [CHOMP-TC-006, CHOMP-TC-042]
    verification_status: NOT_STARTED
    verification_method: ANALYSIS
    rationale: >
      Exploiters run arbitrary Luau in their own client. The moment the place
      is Friends-visible this stops being theoretical, and a competitive game
      whose scores can be forged is not a game.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-STK-007
    title: The iPad is the reference platform
    shall_statement: >
      The experience SHALL be fully playable on an iPad with touch controls —
      driving, turning, banking and fighting — at no less than 30 FPS in a full
      lobby, and SHALL also run on the family laptop.
    level: L1_stakeholder
    status: APPROVED
    priority: CRITICAL
    verified_by: [CHOMP-TC-007]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Revised 2026-08-25: the iPad is where the game is actually played, not a
      secondary target. That makes it the performance ceiling and the control
      reference — a design that is comfortable with a keyboard and merely
      possible with thumbs is the wrong way round here. It also raises the
      priority of instance pooling (CHOMP-SYS-033), since a tablet has less
      headroom than the laptop, and it constrains HUD layout, since a thumb
      covers part of the screen the mouse never did.
    allocated_to: StarterPlayer
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-STK-008
    title: Content can be added later without rewriting the engine
    shall_statement: >
      Maps, ghosts, vehicles and tuning values SHALL be addable or changeable
      without modifying engine logic.
    level: L1_stakeholder
    status: APPROVED
    priority: HIGH
    verified_by: [CHOMP-TC-008]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      v3 hands content authoring to the children (03_architecture/
      authoring_kit.md). That is a later phase, but the separation between
      engine and content has to be respected from the first line of v1 or the
      kit becomes a rewrite rather than an exposure of what already exists.
    allocated_to: ReplicatedStorage/ChompConfig
    chain: CHAIN-KIT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  # ── L2 system — vehicle and control ─────────────────────────────────────

  - id: CHOMP-SYS-001
    title: The vehicle is a character controller, not a physics vehicle
    shall_statement: >
      The player vehicle SHALL be the standard Roblox character with a custom
      model, driven by tuned movement values, and SHALL NOT use VehicleSeat,
      wheels, or unanchored physics for locomotion.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-006]
    verified_by: [CHOMP-TC-009]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      The entire combat system reads the facing angle. Physics vehicles flip,
      jitter as network ownership passes between clients, and shove each other
      through walls — which makes that angle non-deterministic and different on
      every screen.
    allocated_to: StarterPlayer/ChompVehicle
    chain: CHAIN-VEHICLE
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-002
    title: Movement stats are server-held
    shall_statement: >
      Top speed and turn rate SHALL be stored server-side per player and
      applied by the server, and a client-modified movement value SHALL be
      corrected within 1 second.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-006, CHOMP-SYS-001]
    verified_by: [CHOMP-TC-010]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      WalkSpeed is the single most commonly exploited property in Roblox. An
      unchecked client sets it to 200 and eats the map.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-VEHICLE
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-003
    title: Walls hold at full speed
    shall_statement: >
      A vehicle at maximum speed with maximum upgrades SHALL NOT pass through
      a maze wall, in a head-on impact or a glancing one.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-001]
    verified_by: [CHOMP-TC-011]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Speed upgrades raise the chance of tunnelling through thin geometry, and
      a maze whose walls can be skipped has no gates and no chases.
    allocated_to: Workspace/Maps
    chain: CHAIN-VEHICLE
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  # ── L2 system — eating and economy ──────────────────────────────────────

  - id: CHOMP-SYS-004
    title: Pellets are server-owned and validated by distance
    shall_statement: >
      Pellet existence, consumption and respawn SHALL be decided by the server,
      which SHALL confirm the eater is within the mouth arc and pickup radius
      at the moment of consumption; the client SHALL NOT report eating.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-006]
    verified_by: [CHOMP-TC-012]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      "I ate that pellet" from a client is a request to add points, which an
      exploiter will send several thousand times a second.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-ECONOMY
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-005
    title: Eating charges the bar and fills the carry
    shall_statement: >
      Eating a pellet SHALL add its value, multiplied by the current combo, to
      both the player's battle bar (capped at chassis capacity) and their
      carried total (uncapped).
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-001]
    verified_by: [CHOMP-TC-012]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      One action feeding both the combat resource and the score is what ties
      the two halves of the game together — you arm yourself by playing
      Pac-Man.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-ECONOMY
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-006
    title: Combo multiplier
    shall_statement: >
      Consecutive pellets eaten within 1.5 seconds of each other SHALL raise a
      multiplier from x1 to a maximum of x5, resetting to x1 on a wall impact,
      on taking any hit, or when the window lapses.
    level: L2_system
    status: APPROVED
    priority: MEDIUM
    derives_from: [CHOMP-SYS-005]
    verified_by: [CHOMP-TC-013]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Without it the eating half of the game is mindless. With it a clean
      racing line is worth five times a sloppy one, and forcing an opponent
      into a wall costs them something before it costs them points.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-ECONOMY
    phase: v2
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-007
    title: Banking at any garage pad
    shall_statement: >
      Driving onto ANY garage pad SHALL convert all carried points to banked
      dollars at 1:1 and leave the battle bar untouched. Banking SHALL require no
      button, prompt or confirmation.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-001]
    verified_by: [CHOMP-TC-014]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Amended 2026-08-27 (D-CHOMP-068). The original refused banking at any other
      player's garage, which assumed per-player garages that were never built: the
      four pads on Level 1 are shared, and the geography does the work instead - a
      pad is far from where the points are, so the drive back is the risk.
      Ownership would add a rule a child cannot see, to solve a problem distance
      already solves.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-ECONOMY
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-27
    author: Claude (requirements session)

  - id: CHOMP-SYS-008
    title: The garage is safe but not a hiding place
    shall_statement: >
      No combat SHALL resolve inside a garage volume, no pellets SHALL spawn
      inside one, and a player SHALL be unable to re-enter their garage for 5
      seconds after leaving it.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-007]
    verified_by: [CHOMP-TC-014]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Without the re-entry cooldown the optimal strategy is to sit on the
      garage threshold and bounce in and out, which is both unbeatable and
      extremely boring to watch.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-ECONOMY
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-009
    title: Upgrades are bought from banked dollars only
    shall_statement: >
      Chassis and upgrade purchases SHALL be validated and applied by the
      server against banked dollars only, and SHALL recompute the player's
      Power immediately.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-SYS-007, CHOMP-STK-006]
    verified_by: [CHOMP-TC-015]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Power rising only when banked dollars are spent is what makes the ring
      gates an outcome of the banking loop rather than of hoarding — you get
      deeper by making it home alive, not by eating more.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-ECONOMY
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  # ── L2 system — combat ──────────────────────────────────────────────────

  - id: CHOMP-SYS-010
    title: Impact angle decides everything
    shall_statement: >
      On player-to-player contact the server SHALL classify the impact from the
      two facing vectors as head-on (within ±45°) or side/rear, and SHALL
      resolve it accordingly; no client input SHALL influence the
      classification.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-006, CHOMP-SYS-001]
    verified_by: [CHOMP-TC-016]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      This is the signature mechanic. Mouth is weapon, flank and back are weak
      spots, and everything else in combat derives from getting this one
      classification right and identical on every screen.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-011
    title: Head-on is a contest both players pay for
    shall_statement: >
      A head-on impact SHALL cost both players 40% of their own bar; the lower
      bar SHALL additionally lose carried points equal to the difference
      between the two bars; bars within 10% of each other SHALL clang, costing
      the bar only and bouncing both players backwards.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-SYS-010]
    verified_by: [CHOMP-TC-016]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Charging blindly is punished, a well-fed player wins the duel, and
      winning still costs — so head-ons cannot be farmed.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-012
    title: Biting costs the biter
    shall_statement: >
      A side or rear hit SHALL cost the attacker 30% of their bar, and SHALL
      remove that amount from the victim's bar first and their carried points
      second.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-SYS-010]
    verified_by: [CHOMP-TC-017]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Attacking has to be a decision, not a reflex. Without this, one fast
      player chain-rear-ends the entire lobby indefinitely and nothing else in
      the game matters.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-013
    title: Lost points scatter, they never transfer
    shall_statement: >
      Points lost in combat SHALL be spawned as collectable pellets at the
      impact point, available to any player including the victim, and SHALL
      persist for at least 20 seconds.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-011, CHOMP-SYS-012]
    verified_by: [CHOMP-TC-017]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Direct transfer snowballs whoever is already ahead. Scatter makes every
      fight a contested pile that pulls other players in, and lets a third
      party rob the winner.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-014
    title: One collision is one hit
    shall_statement: >
      A player SHALL be invulnerable to all damage for 1.5 seconds after taking
      any hit, from a player, a ghost, or a gate guardian, with a visible
      indication.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-SYS-010]
    verified_by: [CHOMP-TC-018]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      A single physical collision registers across many frames. Undebounced,
      one bump empties a player completely and reads as the game being broken.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-015
    title: Chomped, not eliminated
    shall_statement: >
      A player hit while their bar is empty SHALL scatter 50% of their carried
      points, and SHALL respawn at their own garage within 4 seconds with an
      empty bar and their upgrades intact.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-003]
    verified_by: [CHOMP-TC-003]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Losing upgrades on death would make a bad run unrecoverable and put a
      child permanently behind. Losing carry hurts enough.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-016
    title: No pickings from small fry
    shall_statement: >
      A hit on a player more than 300 Power below the attacker SHALL scatter no
      points and SHALL award the attacker nothing.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-002]
    verified_by: [CHOMP-TC-019]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Removes the economic reason for a maxed-out player to camp a beginner's
      garage. Nobody has to be told the rule — the reward simply is not there.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-COMBAT
    phase: v2
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  # ── L2 system — ghosts ──────────────────────────────────────────────────

  - id: CHOMP-SYS-017
    title: Ghosts pursue, and walls stop them
    shall_statement: >
      Ghosts SHALL pursue the nearest active player within their sense radius and
      drift on their ring when no one is in range. They SHALL NOT pass through maze
      walls, and SHALL slide along a wall toward an opening rather than stopping
      dead against it. Players inside a garage sanctuary SHALL NOT be pursued.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-001]
    verified_by: [CHOMP-TC-020]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Amended 2026-08-27 (D-CHOMP-068). Grid pathing was never built and is not
      wanted: relentless straight pursuit is what makes ghosts frightening to a
      seven-year-old, and D-CHOMP-049 chose it deliberately over cleverness.
      What IS wanted, and is not yet true, is the wall clause. Ghosts currently fly
      straight over 7-stud walls while the kart must corner through gaps, so route
      planning - the whole skill the maze teaches - does nothing against the only
      threat in the game. This requirement states the intent; the build does not
      meet it, and that gap is a defect tracked in CHAIN-GHOSTS and RISK-CHOMP-008
      rather than a requirement quietly rewritten to match the code.
    allocated_to: ServerScriptService/ChompEngine/Behaviours
    chain: CHAIN-GHOSTS
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-27
    author: Claude (requirements session)

  - id: CHOMP-SYS-018
    title: Ghosts rob, they do not kill
    shall_statement: >
      Ghost contact SHALL take a configured fraction of the player's carried points
      and apply contact damage, both gated by a single per-player cooldown so that a
      pack cannot apply one penalty per ghost in one instant. An active shield SHALL
      absorb the entire contact - theft and damage - and throw the ghost clear.
      Banked dollars SHALL never be touchable.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-003]
    verified_by: [CHOMP-TC-020]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Amended 2026-08-27 (D-CHOMP-068). The original said ghosts may not reduce the
      battle bar or destroy the vehicle; D-CHOMP-051 introduced contact damage and
      death, so the requirement described a game two design generations old.
      The per-player cooldown is the part that matters and is easy to lose: with a
      per-ghost cooldown, four ghosts brushing you once cost 68% of the carry and
      over half your health in a single frame, which reads to a child as random
      deletion rather than as pressure. Worn down, not deleted.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-GHOSTS
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-27
    author: Claude (requirements session)

  - id: CHOMP-SYS-019
    title: Ghost personalities are pluggable modules
    shall_statement: >
      Each ghost behaviour SHALL be a separate ModuleScript returning a single
      direction-choosing function, and adding a new personality SHALL require
      no change to engine code. v1 SHALL ship at least The Chaser and The
      Greedy One.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-008, CHOMP-SYS-017]
    verified_by: [CHOMP-TC-021]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      Distinct, learnable behaviours are what make the maze feel alive. The
      module boundary is also the v3 on-ramp: a ten-line function is the first
      real code an older child will write.
    allocated_to: ServerScriptService/ChompEngine/Behaviours
    chain: CHAIN-GHOSTS
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-020
    title: The Greedy One hunts the fattest carry
    shall_statement: >
      One ghost SHALL target the player with the highest unbanked carried total
      at all times, re-evaluating at each junction.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-002, CHOMP-SYS-019]
    verified_by: [CHOMP-TC-022]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      One targeting rule earns its place three times: it punishes hoarding, it
      hunts whoever is winning without any artificial handicap, and it means
      the game still works when one player is online alone.
    allocated_to: ServerScriptService/ChompEngine/Behaviours
    chain: CHAIN-GHOSTS
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-021
    title: Power pellets reverse the game
    shall_statement: >
      Eating a power pellet SHALL grant 8 seconds of Full Jaw, during which all
      sides of the vehicle count as mouth, ghosts flee and are edible for 200
      points, and the player is visibly and audibly marked to everyone.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-001]
    verified_by: [CHOMP-TC-023]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      The oldest working idea in the genre, and the underdog's tool. Being
      visible to everyone is what turns it from a buff into an event.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-GHOSTS
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  # ── L2 system — arena and guardian progression ──────────────────────────

  - id: CHOMP-SYS-022
    title: Level 1 is a readable bowl arena
    shall_statement: >
      Level 1 SHALL place garages in four outer spawn quadrants, an easy maze
      around the rim of a broad circular slope, and an open high-reward combat
      bowl at the centre, with reward value and danger increasing inward.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-002]
    verified_by: [CHOMP-TC-024]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      The arena teaches itself spatially: the outer rim is safe enough to learn,
      the centre is visibly risky and rewarding, and a child can retreat uphill
      toward home without reading a map.
    allocated_to: Workspace/Maps
    chain: CHAIN-GATES
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-023
    title: The guardian waits in an adjacent chamber
    shall_statement: >
      The route from Level 1 to Level 2 SHALL pass through a guardian chamber
      adjacent to the maze; its guardian SHALL display its Threat, remain in
      that chamber, and be visible before the player crosses the commitment
      boundary.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-SYS-022]
    verified_by: [CHOMP-TC-025]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      The guardian is a deliberate challenge rather than an accidental maze
      collision. Seeing the creature and its Threat before entry makes the risk
      understandable without pausing play for an explanation.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-GATES
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-024
    title: Entering under-powered is a deliberate instant loss
    shall_statement: >
      A player crossing the guardian chamber's marked commitment boundary while
      their Power is below its Threat SHALL receive an unmistakable warning,
      SHALL be immediately chomped by the guardian, SHALL scatter 50% of carried
      points, and SHALL respawn at their own garage within 4 seconds.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-023]
    verified_by: [CHOMP-TC-025]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      The warning and commitment line make the loss a knowingly accepted risk;
      the standard short respawn keeps it memorable rather than punitive.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-GATES
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-025
    title: Qualified players fight the guardian to progress
    shall_statement: >
      Crossing the commitment boundary at or above the guardian's Threat SHALL
      start a chamber fight in which frontal attacks clang and the guardian is
      damaged through readable side or rear openings; defeating it SHALL award
      a major point burst and unlock the Level 2 passage for that player.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-023]
    verified_by: [CHOMP-TC-025]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Power earns the right to attempt progression; it does not replace playing
      well. Reusing mouth/front/flank language makes the guardian a mastery
      check for the combat system learned in Level 1.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-GATES
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-026
    title: Full Jaw is a skeleton key
    shall_statement: >
      A player under Full Jaw SHALL pass any one gate regardless of Power,
      without consuming the guardian.
    level: L2_system
    status: APPROVED
    priority: MEDIUM
    derives_from: [CHOMP-SYS-021, CHOMP-SYS-023]
    verified_by: [CHOMP-TC-023]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Hands the underdog the richest ground in the map for exactly as long as
      it takes to get out again — the best gamble in the game.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-GATES
    phase: v2
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  # ── L2 system — match structure ─────────────────────────────────────────

  - id: CHOMP-SYS-027
    title: Rounds, intermission, winner
    shall_statement: >
      A match SHALL consist of 5 rounds of 6 minutes separated by 30-second
      garage intermissions, and SHALL declare a winner by total banked dollars
      across the match.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-004]
    verified_by: [CHOMP-TC-004]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Round length is the main tuning dial for how far up the ring ladder a
      match gets. All five numbers live in ChompConfig for exactly that reason.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-MATCH
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-028
    title: Progress persists across rounds, resets between matches
    shall_statement: >
      Upgrades, chassis and Power SHALL carry across the rounds of a match and
      SHALL reset to the starting chassis at match end; nothing that affects
      power SHALL persist between sessions.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-002]
    verified_by: [CHOMP-TC-026]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Permanent progression means a veteran drives an Apex against a
      first-timer's Standard and the first-timer never touches a pellet. This
      requirement is the mechanical form of "keep it fair"; anything permanent
      belongs in cosmetics.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-MATCH
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-029
    title: Joining late is not a punishment
    shall_statement: >
      A player joining mid-round SHALL start with the starting chassis and a
      catch-up dollar grant scaled to elapsed match time, and SHALL be spawned
      at an unoccupied garage.
    level: L2_system
    status: APPROVED
    priority: MEDIUM
    derives_from: [CHOMP-STK-002]
    verified_by: [CHOMP-TC-027]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Roblox servers fill continuously; someone joining in round four against
      Tier 3 opponents with no grant has no game to play and will leave inside
      a minute.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-MATCH
    phase: v2
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  # ── L2 system — interface ───────────────────────────────────────────────

  - id: CHOMP-SYS-030
    title: The HUD only displays
    shall_statement: >
      The HUD SHALL render bar, carried, banked, Power, round timer and
      standings from server-replicated values only, and SHALL hold no
      authoritative state of its own.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-006]
    verified_by: [CHOMP-TC-028]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      If the number on screen is the number the game believes, the game's
      economy lives on the client and is already forged.
    allocated_to: StarterGui/ChompHud
    chain: CHAIN-UI
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-031
    title: Readable by a seven-year-old at speed
    shall_statement: >
      Gate readiness SHALL be shown as a colour comparison between the player's
      Power and the nearest gate's Threat, and carried-versus-banked SHALL be
      visually distinct without reading numbers.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-001, CHOMP-STK-002]
    verified_by: [CHOMP-TC-002]
    verification_status: NOT_STARTED
    verification_method: DEMONSTRATION
    rationale: >
      A child reads colour before text, and reads nothing at all while driving.
      Red-to-green on the gate marker answers "can I go in yet" with no reading.
    allocated_to: StarterGui/ChompHud
    chain: CHAIN-UI
    automation_exempt_reason: >
      Colour legibility at speed to a seven-year-old is a human judgement.
      Automated coverage is limited to asserting the HUD renders the correct
      values (CHOMP-TC-028); whether she can read them is CHOMP-TC-002.
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-032
    title: Touch controls are the primary control scheme
    shall_statement: >
      Driving and turning SHALL be operable by touch alone. Action buttons SHALL sit
      in the lower corners within thumb reach, and nothing the player must READ
      SHALL sit under a thumb. The experience SHALL lock to landscape, and all GUI
      SHALL remain fully on screen at any landscape aspect ratio an iPad reports.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-007]
    verified_by: [CHOMP-TC-007]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Amended 2026-08-27 (D-CHOMP-071). Two changes.
      The original required both orientations. The right-hand column does not fit a
      portrait iPad once the action buttons are on it, so the experience locks to
      landscape - which is correct for a driving game in a wide arena, and is an
      honest amendment rather than a clause quietly broken. A portrait fallback
      still hides the cycle button, because the jump is an escape and has no other
      route.
      The original also said controls must not occlude the HUD. That was written for
      a scheme with no buttons at all. Inverted here: the lower corners are FOR
      controls, and it is the values that must move out of them - which is the
      conflict CHOMP-SYS-055 and D-CHOMP-053 left open and this finally settles.
      Still knowingly unmet: the GUI is laid out largely in pixel offsets rather
      than scale, with no size constraints. That is a defect against this
      requirement, tracked in CHAIN-UI, and it is why the layout has never been
      checked at a second aspect ratio.
    allocated_to: StarterGui/ChompHud
    chain: CHAIN-UI
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-27
    author: Claude (requirements session)

  - id: CHOMP-SYS-055
    title: The play HUD answers what matters now
    shall_statement: >
      During play the HUD SHALL place battle charge and risky carried points at
      top-left, one contextual next objective at top-centre, and safe dollars,
      timer and standings at top-right, while keeping the bottom edge and both
      lower 30% corner zones clear for touch input.
    level: L2_system
    status: DRAFT
    priority: HIGH
    derives_from: [CHOMP-STK-001, CHOMP-SYS-030, CHOMP-SYS-032]
    verified_by: [CHOMP-TC-045]
    verification_status: NOT_STARTED
    verification_method: DEMONSTRATION
    rationale: >
      A child driving at speed cannot scan a dashboard. Stable zones build
      recognition, and one contextual objective can answer bank, upgrade or
      guardian readiness without presenting a task list.
    allocated_to: StarterGui/ChompHud
    chain: CHAIN-UI
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Codex (HUD/gameplay requirements)

  - id: CHOMP-SYS-056
    title: Gains and losses explain themselves
    shall_statement: >
      Pellet collection, banking, purchases, combat hits and guardian outcomes
      SHALL produce distinct on-screen and world-space feedback showing the
      signed amount and destination as carried points, safe dollars, battle
      charge or Power, and SHALL NOT identify all four values by colour alone.
    level: L2_system
    status: DRAFT
    priority: HIGH
    derives_from: [CHOMP-STK-001, CHOMP-SYS-031]
    verified_by: [CHOMP-TC-045]
    verification_status: NOT_STARTED
    verification_method: DEMONSTRATION
    rationale: >
      The economy only works if a child can see where value went. A pickup
      should arc toward CARRY, banking should count into SAFE dollars, and a hit
      should point back to the pellets that scattered into the world.
    allocated_to: StarterGui/ChompHud
    chain: CHAIN-UI
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Codex (HUD/gameplay requirements)

  - id: CHOMP-SYS-057
    title: The garage makes the next unlock obvious
    shall_statement: >
      The garage SHALL show a rotatable vehicle preview, five relative bars for
      Speed, Turning, Toughness, Bite Power and Chomp Reach, the next eligible
      chassis or upgrade price, current safe dollars, and the remaining dollar
      amount when unaffordable, with any upgrade trade-off shown before purchase.
    level: L2_system
    status: DRAFT
    priority: HIGH
    derives_from: [CHOMP-STK-001, CHOMP-SYS-009, CHOMP-SYS-030]
    verified_by: [CHOMP-TC-046]
    verification_status: NOT_STARTED
    verification_method: DEMONSTRATION
    rationale: >
      Exact tuning belongs to the server, but the purchase decision belongs to
      the player. Relative bars and a clear "$150 TO GO" communicate progress
      without asking a young player to compare engineering units.
    allocated_to: StarterGui/ChompHud
    chain: CHAIN-UI
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Codex (HUD/gameplay requirements)

    # ── L2 system — platform, safety, performance ───────────────────────────

  - id: CHOMP-SYS-033
    title: Pellets are pooled, not created and destroyed
    shall_statement: >
      Pellet instances SHALL be pooled and reused rather than created and
      destroyed on each consumption, and total live parts SHALL stay under
      4000 in a full lobby.
    level: L2_system
    status: APPROVED
    priority: MEDIUM
    derives_from: [CHOMP-STK-007]
    verified_by: [CHOMP-TC-007]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      A maze holds hundreds of pellets being eaten continuously by a full
      lobby. Instance churn at that rate is the most likely source of frame
      drops — and with the iPad as the reference platform (CHOMP-STK-007) the
      headroom is smaller than a laptop's, so this stays in v1 rather than
      waiting for a measured problem.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-034
    title: No script enters the place unread
    shall_statement: >
      Any model inserted from the Toolbox or Creator Store SHALL have every
      Script, LocalScript and ModuleScript inside it deleted or read and
      approved by the owner before use.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-005]
    verified_by: [CHOMP-TC-005]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      Free models are a known malware vector: scripts inside them can insert
      further scripts, reach external services via HttpService, or hand
      control of the place to a third party.
    allocated_to: Workspace/Maps
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-035
    title: Private while building, Friends when done
    shall_statement: >
      The place SHALL be published from the owner's account with private access
      during development, and SHALL only be widened to Friends by an explicit
      owner action.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-005]
    verified_by: [CHOMP-TC-005]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      Keeps experience settings, publishing and any moderation correspondence
      with the adult.
    allocated_to: Players
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-036
    title: No user-authored text is ever rendered
    shall_statement: >
      The experience SHALL contain no surface whose content comes from a player
      at runtime, and SHALL leave Roblox's default chat and text filtering
      untouched.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-005]
    verified_by: [CHOMP-TC-005]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      Any surface rendering another player's words is a moderation surface, and
      rendering unfiltered text is a platform policy violation. Having no such
      surface is the cheapest correct answer at this scale.
    allocated_to: TextChatService
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-037
    title: Every tunable number lives in one table
    shall_statement: >
      All balance values SHALL be defined exactly once in a ChompConfig
      ModuleScript, and no balance value SHALL appear as a literal in engine
      logic.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-008]
    verified_by: [CHOMP-TC-008]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      Balancing this game means changing numbers hundreds of times. It is also
      the first thing handed to the children in v3, and the smallest possible
      down payment on the authoring kit.
    allocated_to: ReplicatedStorage/ChompConfig
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-038
    title: The engine finds content, it does not name it
    shall_statement: >
      The engine SHALL locate maps, pellets, gates, garages, ghost spawns and
      vehicles by tag or folder convention rather than by hardcoded instance
      references, so that adding content requires no engine change.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-008]
    verified_by: [CHOMP-TC-008]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      This is the one v3 decision that must be honoured in v1. Discovery by tag
      costs nothing now; retrofitting it later means rewriting every system
      that touches the map.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-046
    title: Twelve players, three garages per quadrant
    shall_statement: >
      MaxPlayers SHALL be 12. Each map SHALL provide at least one garage per four
      players, with the count and placement derived from ChompConfig rather than
      fixed in code, and pellet count SHALL be scaled so that a full lobby does not
      strip a ring bare between respawns.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-022, CHOMP-STK-007]
    verified_by: [CHOMP-TC-029]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Amended 2026-08-27 (D-CHOMP-068). The original fixed 12 garages at 3 per
      quadrant, written for the multi-deck map. Level 1 has four, one of them home,
      and four is right for it: each garage is a sanctuary ghosts may not enter
      (CHOMP-SYS-065), so garages are safe ground and not only convenience, and
      twelve on an 800-stud disc would make most of the outer ring safe.
      Deriving the count from config is what lets the next map differ without
      amending this again.
    allocated_to: Workspace/Maps
    chain: CHAIN-MAZE
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-27
    author: Claude (requirements session)

  - id: CHOMP-SYS-047
    title: Each v1 map is one sealed level
    shall_statement: >
      Each v1 map SHALL be a single fully enclosed level with no vertical drops and
      no way to leave the play surface, with concentric ring corridors, offset gaps
      between rings, and an open high-value centre.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-022]
    verified_by: [CHOMP-TC-037]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      Amended 2026-08-27 (D-CHOMP-068). This required two or more stacked decks,
      which D-CHOMP-046 deleted: a drop between decks is a way to fall out of the
      map, and the camera could not follow between them without a jump cut. The
      multi-deck ambition is not abandoned but re-phased - see CHOMP-SYS-062, which
      carries it at v2.
      It is amended rather than moved because six live requirements derive from it,
      including the camera ones; re-phasing it to v2 would have made every one of
      them derive from something shipping later.
    allocated_to: Workspace/Maps
    chain: CHAIN-MAZE
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-27
    author: Claude (requirements session)

  - id: CHOMP-SYS-048
    title: Ghosts path a multi-deck graph
    shall_statement: >
      Ghost pathing SHALL treat each deck as a grid and ramps, bridges and
      shafts as explicit links between decks, and a ghost SHALL be able to
      pursue a target onto any deck.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-017, CHOMP-SYS-047]
    verified_by: [CHOMP-TC-038]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Verticality only stays cheap if the vertical connections are explicit
      data rather than something the pathing has to infer from geometry —
      which is exactly what building from a prefab set provides.
    allocated_to: ServerScriptService/ChompEngine/Behaviours
    chain: CHAIN-GHOSTS
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-049
    title: Falling costs, it never kills
    shall_statement: >
      A player leaving a deck edge SHALL land on the deck below, lose their
      combo, and scatter 10% of their carried points on landing; no map SHALL
      contain a void, a death plane, or a fall that removes a player from play.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-003, CHOMP-SYS-047]
    verified_by: [CHOMP-TC-039]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Knocking someone off a bridge should be a real and satisfying attack, but
      a fall that wipes a good run is the difference between a seven-year-old
      laughing and a seven-year-old leaving the room.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-050
    title: An attack from above is always a flank
    shall_statement: >
      Contact initiated from a higher deck SHALL classify as a side/rear hit
      and SHALL cost the attacker bar on the same terms as any other bite.
    level: L2_system
    status: APPROVED
    priority: MEDIUM
    derives_from: [CHOMP-SYS-010, CHOMP-SYS-047]
    verified_by: [CHOMP-TC-039]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      A mouth faces forward horizontally, so nobody's mouth ever points at the
      ceiling — the drop attack falls out of the existing rule rather than
      being a new one. It rewards knowing the building and costs the attacker
      their height advantage to use.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-051
    title: The camera survives the building
    shall_statement: >
      The camera SHALL follow the player at a locked angle, rise with their
      deck, and fade any geometry between itself and the player to transparent;
      the player's vehicle SHALL never be fully occluded for more than 0.2
      seconds.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-SYS-047, CHOMP-STK-001]
    verified_by: [CHOMP-TC-040]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      A flat maze can use one fixed overhead view and never think about it
      again. A building puts towers and bridges between the camera and the
      player constantly, and this is the one part of the multi-level design
      that can quietly ruin the whole game. It must be solved on a test map
      before any real map is built.
    allocated_to: StarterPlayer/ChompCamera
    chain: CHAIN-VEHICLE
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-052
    title: You can see who is above and below you
    shall_statement: >
      Players on other decks within a defined radius SHALL be shown as coloured
      markers carrying a height indication, and gate markers SHALL show the
      Threat of the gate on the deck above.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-047, CHOMP-SYS-031]
    verified_by: [CHOMP-TC-040]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Without off-deck awareness, verticality turns every encounter into an
      ambush and no player can plan anything — which throws away the scouting
      and anticipation that were the reason for building upward.
    allocated_to: StarterGui/ChompHud
    chain: CHAIN-UI
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-053
    title: Wave size follows the active lobby
    shall_statement: >
      The size of a ghost wave SHALL be derived from the number of ACTIVE players -
      those deployed into the arena, not those in the launch bay - from a mapping
      defined in ChompConfig, and SHALL grow with the wave number up to a configured
      maximum. Ghost speed SHALL be capped so that the slowest chassis can always
      outrun a ghost.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-001, CHOMP-SYS-019]
    verified_by: [CHOMP-TC-041]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Amended 2026-08-27 (D-CHOMP-068). The original mapped ghost count INVERSELY to
      player count - more ghosts as the lobby emptied - to keep a thin server
      populated. Waves replaced that model entirely: pressure now comes from the
      wave schedule, and a solo player meeting the full nine was a siege rather than
      an opening.
      The speed cap is the child-safety clause and belongs in a SHALL rather than a
      config comment: without it, growth crossed the Standard chassis at wave 9 and
      'you can always drive away' silently stopped being true.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-GHOSTS
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-27
    author: Claude (requirements session)

  - id: CHOMP-SYS-054
    title: Vehicle models are accepted by contract, not by eye
    shall_statement: >
      Every chassis model SHALL satisfy the vehicle contract — tag, attributes,
      named PrimaryPart, mouth aligned to the PrimaryPart LookVector, part and
      triangle budgets, physics properties, and no scripts — and SHALL be
      rejected automatically if it does not.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-001, CHOMP-STK-007]
    chain: CHAIN-VEHICLE
    verified_by: [CHOMP-TC-044]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      Vehicles are being designed by a separate agent working from a written
      contract (03_architecture/vehicle_contract.md). A model that faces the
      wrong way does not look wrong — it inverts the combat system, because
      every classification reads the LookVector. That failure has to be caught
      by a scan at acceptance, not by a person noticing something odd during a
      playtest.
    allocated_to: ReplicatedStorage/Vehicles
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  # ── v2: content and modes ───────────────────────────────────────────────

  - id: CHOMP-SYS-039
    title: Six maps in rotation
    shall_statement: >
      The map pool SHALL contain the six archetypes defined in the concept, and
      the map SHALL change between rounds.
    level: L2_system
    status: APPROVED
    priority: MEDIUM
    derives_from: [CHOMP-SYS-022]
    verified_by: [CHOMP-TC-030]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      Topology decides which attacks are possible, so map variety is combat
      variety. Rotation also stops map memory deciding matches.
    allocated_to: Workspace/Maps
    chain: CHAIN-MAZE
    phase: v2
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-040
    title: Four ghost personalities and four rings
    shall_statement: >
      The full ghost set (Chaser, Ambusher, Flanker, Greedy One) and the full
      ring ladder (Rings 1-4, Threats 250/500/800) SHALL be in play.
    level: L2_system
    status: APPROVED
    priority: MEDIUM
    derives_from: [CHOMP-SYS-019, CHOMP-SYS-022]
    verified_by: [CHOMP-TC-031]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      v1 proves the mechanics with two ghosts and one gate; v2 is where the
      maze becomes genuinely dangerous and the ladder gets its full arc.
    allocated_to: ServerScriptService/ChompEngine/Behaviours
    chain: CHAIN-GHOSTS
    phase: v2
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-041
    title: Team mode, and a way to opt out of fighting
    shall_statement: >
      The experience SHALL offer 2v2/3v3 teams with a shared bank, shared gate
      access and no friendly fire, and SHALL offer a no-PvP option in which a
      player can neither attack nor be attacked by other players.
    level: L2_system
    status: APPROVED
    priority: MEDIUM
    derives_from: [CHOMP-STK-002, CHOMP-STK-003]
    verified_by: [CHOMP-TC-032]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Teams are how an adult and a young child genuinely partner up. The no-PvP
      option is for a beginner who wants to learn the maze without being hunted
      — not for the empty-server case, which CHOMP-SYS-053 handles in v1 by
      scaling the ghosts instead.
    allocated_to: ServerScriptService/ChompEngine
    chain: CHAIN-MATCH
    phase: v2
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-042
    title: Persistence is cosmetic only
    shall_statement: >
      Cross-session persistence SHALL store cosmetics and lifetime statistics
      only, SHALL never restore power, and a failed profile read SHALL never be
      written back as an empty profile.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-028]
    verified_by: [CHOMP-TC-033]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      A DataStore read failure and a genuinely new player are indistinguishable
      unless pcall's success flag is checked separately from its returned
      value. Conflating them overwrites a real profile with zeroes.
    allocated_to: ServerScriptService/DataService
    chain: CHAIN-PLATFORM
    phase: v2
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  # ── v3: the authoring kit ───────────────────────────────────────────────

  - id: CHOMP-SYS-043
    title: Content is geometry plus tags, never scripts
    shall_statement: >
      All authorable content SHALL be expressible as tagged parts and models
      carrying attributes, and content folders SHALL contain no scripts of any
      kind.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-008, CHOMP-SYS-038]
    verified_by: [CHOMP-TC-034]
    verification_status: NOT_STARTED
    verification_method: INSPECTION
    rationale: >
      Makes the no-unread-scripts safety rule structural rather than
      remembered, and means a child cannot break the game by building badly.
      Full vocabulary in 03_architecture/authoring_kit.md.
    allocated_to: Workspace/Maps
    chain: CHAIN-KIT
    phase: v3
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-044
    title: The mirror tool
    shall_statement: >
      A one-action tool SHALL copy a map's authored quadrant to the other three
      rotations, so that four-fold symmetry is a property of the build method.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-043]
    verified_by: [CHOMP-TC-035]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Guarantees spawn fairness without an adult checking it, quarters the
      building work, and is visibly magic to a child — which is the actual
      lesson underneath the project.
    allocated_to: ServerStorage/ChompTools
    chain: CHAIN-KIT
    phase: v3
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-045
    title: Check My Maze
    shall_statement: >
      A validator SHALL check an authored map for missing gates, missing
      garages, pellets inside walls, off-grid walls, unknown ghost behaviours
      and embedded scripts, and SHALL report each failure in plain language a
      child can act on.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-043]
    verified_by: [CHOMP-TC-036]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      The same principle as this repo's own validate.py — never trust that a
      hand-built thing is internally consistent — pointed at a child's maze.
      It is what lets her iterate without an adult beside her, which is the
      difference between helping and owning.
    allocated_to: ServerStorage/ChompTools
    chain: CHAIN-KIT
    phase: v3
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (requirements session)

  - id: CHOMP-SYS-058
    title: A driver carries a short belt of items, spent in order
    shall_statement: >
      A player SHALL carry at most ChompConfig.Items.SlotCount items, spent in
      the order collected, with the active slot selectable. Collecting SHALL be
      refused with the pad left in place once the belt is full, and SHALL never
      prompt or ask for confirmation.
    level: L2_system
    status: DRAFT
    priority: HIGH
    derives_from: [CHOMP-STK-001, CHOMP-SYS-032]
    verified_by: [CHOMP-TC-047]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      A short belt, not a bag. The original single slot made every pickup a
      judgement, which was right while there was nothing to survive; waves
      changed the question from "is this better than what I hold" to "have I
      enough to last". Five is small enough to read at a glance and to spend
      without managing.
      What has NOT changed is the prohibition on prompts. A seven-year-old
      driving at speed cannot open a bag, and a confirmation dialog at 26 studs
      per second is a crash. Collecting stays automatic, spending stays in
      order, and selecting is one tap on a slot that is already on screen.
      A full belt REFUSES a pickup and leaves the pad standing, rather than
      silently eating it. An item you could not carry should still be there when
      you come back.
    allocated_to: ServerScriptService/ChompEngine/ItemService
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (local session)

  - id: CHOMP-SYS-059
    title: Items are used by intent alone
    shall_statement: >
      The client SHALL request item use with no arguments, and the server SHALL
      determine the item, the remaining charges, the direction of any projectile
      and every outcome, rejecting requests that exceed the rate limit or that
      arrive with no item carried.
    level: L2_system
    status: DRAFT
    priority: CRITICAL
    derives_from: [CHOMP-STK-006, CHOMP-SYS-034]
    verified_by: [CHOMP-TC-042, CHOMP-TC-047]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      A fourth remote is a fourth thing worth forging. Carrying no arguments
      means there is nothing in the message to lie about: not the item, not the
      charge count, not the aim, not the hit. The direction a shot travels is
      read from the character transform the server itself wrote.
    allocated_to: ReplicatedStorage/RemoteEvents/UseItem
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (local session)

  - id: CHOMP-SYS-060
    title: Each item is a different decision
    shall_statement: >
      The item set SHALL provide a single vertical hop, a multi-shot straight
      projectile, a single placed explosive armed and detonated by separate
      inputs, and a shield that absorbs one hit or expires, with charge counts
      defined in ChompConfig.Items, charges spent per use, and the slot emptying
      at zero.
    level: L2_system
    status: DRAFT
    priority: HIGH
    derives_from: [CHOMP-STK-001]
    verified_by: [CHOMP-TC-047]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Four items that differ in kind rather than degree: mobility, volume,
      accuracy, defence. Counts are deliberately NOT fixed here. The first
      version of this requirement said "three-shot", which made a tuning number
      into a shall statement, so raising the cannon to ten put the tree in
      breach of a change nobody would call a design decision. Where a number is
      expected to move, the requirement names the place it lives.
    allocated_to: ServerScriptService/ChompEngine/ItemService
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (local session)

  - id: CHOMP-SYS-061
    title: Item pads restock themselves
    shall_statement: >
      Collected item pads SHALL become uncollectable and return after a fixed
      interval at the same position, and pad positions SHALL place higher-value
      items closer to the centre of the map.
    level: L2_system
    status: DRAFT
    priority: MEDIUM
    derives_from: [CHOMP-SYS-047]
    verified_by: [CHOMP-TC-047]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      A map that empties stops being worth exploring, and one that never empties
      removes the reason to remember where anything was. Placing the better
      items further in makes the bowl worth the risk it already represents.
    allocated_to: ServerScriptService/ChompEngine/ItemService
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-25
    last_modified: 2026-08-25
    author: Claude (local session)

  - id: CHOMP-SYS-062
    title: Stacked decks, deferred to v2
    shall_statement: >
      A v2 map SHALL support two or more vertically stacked decks connected by
      ramps, with the camera following between decks without a jump cut and
      players on other decks locatable at a glance.
    level: L2_system
    status: APPROVED
    priority: MEDIUM
    derives_from: [CHOMP-STK-001]
    verified_by: [CHOMP-TC-048]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Carries the multi-deck ambition CHOMP-SYS-047 held until D-CHOMP-046 built a
      single sealed disc instead. It is not abandoned - a game whose arena grows
      vertically is a better game - but it is blocked on the camera, and the camera
      acceptance run (CHOMP-TC-040) has still never been done even on one level.
      Phased v2 so the ambition is recorded without pretending v1 owes it.
    allocated_to: ServerScriptService/ChompEngine/Level1Map
    chain: CHAIN-MAZE
    phase: v2
    created_date: 2026-08-27
    last_modified: 2026-08-27
    author: Claude (local session)

  - id: CHOMP-SYS-063
    title: Ghost waves
    shall_statement: >
      Ghosts SHALL arrive in numbered waves that begin only when at least one
      player is active, spawn in a ring around a player at a configured minimum
      distance, grow in count and speed with the wave number within configured
      caps, and be followed by a break long enough to reach a garage and bank.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-001]
    verified_by: [CHOMP-TC-049]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Waves are the spine of the session and had no requirement at all: they were
      specified only in D-CHOMP-059 and -062 prose, so CHAIN-GHOSTS logged wave
      work against CHOMP-SYS-017, a pathing requirement, which passed validation
      while corrupting the trace.
      The minimum spawn distance and the break are the clauses that protect a
      child: arriving ON someone is a cheap hit rather than a threat, and a break
      too short to reach a bank makes banking a thing you never do.
    allocated_to: ServerScriptService/ChompEngine/GhostService
    chain: CHAIN-GHOSTS
    phase: v1
    created_date: 2026-08-27
    last_modified: 2026-08-27
    author: Claude (local session)

  - id: CHOMP-SYS-064
    title: The charge meter and the escape jump
    shall_statement: >
      Eating pellets SHALL fill a charge meter. At or above a configured cost the
      player MAY spend that cost - not the whole meter - on a single jump that
      carries them up and forward. The client SHALL send only the intent to jump;
      the server SHALL decide whether there is charge to spend.
    level: L2_system
    status: APPROVED
    priority: MEDIUM
    derives_from: [CHOMP-STK-001]
    verified_by: [CHOMP-TC-050]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      The one move that rewards collecting for its own sake, and the only escape a
      frightened player controls. Two details are load-bearing and were both got
      wrong in code before being written down here: spending the COST rather than
      zeroing the meter, so topping up past the threshold is not silently taxed;
      and intent-only on the wire, because a client that could declare a jump could
      declare a free one.
    allocated_to: ServerScriptService/ChompEngine/ChargeService
    chain: CHAIN-ECONOMY
    phase: v1
    created_date: 2026-08-27
    last_modified: 2026-08-27
    author: Claude (local session)

  - id: CHOMP-SYS-065
    title: Garages are sanctuaries
    shall_statement: >
      Ghosts SHALL NOT enter, spawn inside, steal from or damage anyone within a
      garage sanctuary. The sanctuary boundary SHALL be visible in the world, and
      a blocked ghost SHALL circle it rather than stopping against it.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-008]
    verified_by: [CHOMP-TC-051]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      The garage asks the player to stand still - to shop, to bank, to decide - and
      a wave anchored on a player who has not moved yet arrived on top of them.
      A safe zone rather than a spawn timer, because a timer protects a moment and
      this has to protect an activity.
      Visible is not decoration: an invisible rule is a surprise, not a mechanic.
      Circling rather than halting is what makes leaving a decision instead of
      making the ghost look broken.
    allocated_to: ServerScriptService/ChompEngine/GhostService
    chain: CHAIN-GHOSTS
    phase: v1
    created_date: 2026-08-27
    last_modified: 2026-08-27
    author: Claude (local session)

  - id: CHOMP-SYS-066
    title: Friendly fire is off, and off means unharmed
    shall_statement: >
      Friendly fire SHALL default to off. While it is off, no weapon owned by a
      player SHALL damage another player by any means - shot, blast or trap - and
      not merely be prevented from targeting them. The switch SHALL be legible on
      screen and SHALL state when it has no effect because nobody else is present.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-006]
    verified_by: [CHOMP-TC-052]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Written after the switch was found to gate only target ACQUISITION: with it
      off you could not aim at a friend, but a stray burst went through them for
      full damage. In a game two children play together that is the worst possible
      failure, because it punishes exactly the shot you did not mean to take.
      'Not merely be prevented from targeting them' is in the SHALL on purpose -
      it is the sentence that would have prevented the bug.
    allocated_to: ServerScriptService/ChompEngine/ItemService
    chain: CHAIN-COMBAT
    phase: v1
    created_date: 2026-08-27
    last_modified: 2026-08-27
    author: Claude (local session)

  - id: CHOMP-SYS-067
    title: The plinth shop
    shall_statement: >
      Everything buyable SHALL stand on a lit plinth showing what it is and its
      price. Purchase SHALL be by dwelling beside it, with no menu, button or
      confirmation dialog, and SHALL show its progress. THE SERVER SHALL OWN THE
      PRICE. Anything that can be refused SHALL be granted before it is charged
      for, and a refusal SHALL cost nothing and say why. Real-currency prices SHALL
      NOT be displayed unless a real purchase is wired.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-SYS-007]
    verified_by: [CHOMP-TC-053]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      The shop is where a child spends what they risked their run to earn, so every
      clause here is about not betraying that.
      Grant-before-charge is the rule that stops a full belt taking someone's money
      for an item it then refuses. The Robux clause is separate and blunt: the
      store has always been dollars-only, and plinths were advertising real
      currency for a purchase that did not exist, in a game built for a
      seven-year-old.
    allocated_to: ServerScriptService/ChompEngine/GarageService
    chain: CHAIN-ECONOMY
    phase: v1
    created_date: 2026-08-27
    last_modified: 2026-08-27
    author: Claude (local session)

  - id: CHOMP-SYS-068
    title: The launch bay and the deployment gate
    shall_statement: >
      A joining player SHALL arrive in a launch bay where they are not a valid
      target, take no damage, and do not count toward wave size. Leaving the bay
      SHALL be the commitment to deploy, SHALL be announced with a countdown, and
      SHALL grant brief spawn protection on arrival. No player SHALL be held in the
      bay indefinitely by the failure of any single service.
    level: L2_system
    status: APPROVED
    priority: HIGH
    derives_from: [CHOMP-STK-001]
    verified_by: [CHOMP-TC-054]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      The bay is the first thing anyone sees and the place a returning player fits
      their loadout, so it has to be safe and it has to end.
      The last clause is written from a real failure: the bay waited on one
      attribute with one writer and no timeout, so a single absent script parked
      every player on a loading message for the whole session, with no message and
      no way out.
    allocated_to: ServerScriptService/ChompEngine/PlayerSessionService
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-27
    last_modified: 2026-08-27
    author: Claude (local session)

  - id: CHOMP-SYS-069
    title: Profiles persist, and fail safely
    shall_statement: >
      Permanent progression - banked dollars, owned and equipped chassis, and
      upgrade levels - SHALL persist across sessions in versioned storage, be
      sanitised and clamped on read, and be saved on leave, on shutdown and
      periodically. A failed read SHALL NOT overwrite the stored profile, SHALL
      leave the player able to play the session, and SHALL prevent any purchase
      while saving is blocked.
    level: L2_system
    status: APPROVED
    priority: CRITICAL
    derives_from: [CHOMP-STK-006]
    verified_by: [CHOMP-TC-055]
    verification_status: NOT_STARTED
    verification_method: TEST
    rationale: >
      Persistence is the difference between a toy and a game you come back to, and
      the failure modes are all worse than not having it.
      Never-overwrite-on-failed-read is the clause that protects a child's saved
      progress from a transient DataStore outage. Blocking purchases while saving
      is blocked is the other half: a session that cannot save must not sell
      someone a chassis that will be gone when they rejoin.
    allocated_to: ServerScriptService/ChompEngine/ProfileService
    chain: CHAIN-PLATFORM
    phase: v1
    created_date: 2026-08-27
    last_modified: 2026-08-27
    author: Claude (local session)

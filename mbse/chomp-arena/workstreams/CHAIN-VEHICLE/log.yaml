    ReplicatedStorage.Remotes after the 10 s timeout, while both
    default.project.json and the built place contain all three events — most
    likely a Studio session holding a DataModel older than the place on disk,
    not a code fault. Recorded rather than fixed, because it has not been
    reproduced against a freshly opened place.
  status: OPEN
  handoff: >
    The fix is written but NOT yet played. Someone must open a freshly built
    place, press Play, and confirm two things: the vehicle drives forward with
    no key held, and A/D turns it. Output should carry
    "[VehicleController] default controls disabled". If the RequestPurchase
    error recurs against a fresh place, it is a real bug and not a stale
    session — reopen it as such.

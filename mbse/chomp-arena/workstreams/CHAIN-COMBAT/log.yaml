  agent: Claude (local session)
  action: NOTE
  requirements: [CHOMP-SYS-058]
  summary: >
    REGRESSION, self-inflicted, THIRD of its kind tonight and now guarded.
    Pickups stopped working: give() called mount(), which no longer existed. The
    belt change replaced the span from `local function publish` to
    `local function give`, and mount/unmount had been inserted into exactly that

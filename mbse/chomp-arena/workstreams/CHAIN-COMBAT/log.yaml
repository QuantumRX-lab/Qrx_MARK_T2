- date: '2026-08-25'
  agent: Claude (requirements session)
  action: ESTABLISHED
  requirements: *id001
  summary: Chain established with 10 requirements across v1, v2. Nothing built.
    See 02_requirements/requirements.yaml for the shall statements and 04_verification/test_cases.yaml
    for how each is verified.
  status: OPEN
- date: '2026-08-25'
  agent: Claude (tree owner)
  action: NOTE
  requirements: [CHOMP-SYS-010, CHOMP-SYS-011, CHOMP-SYS-012]
  summary: >
    Decomposed the combat maths into pure functions with specified boundary
    cases: src/ReplicatedStorage/ChompLogic/Impact.lua holds classify,
    resolveHeadOn, resolveFlank, resolveChomp and resolveFall as typed stubs.
    They take facings and numbers and return deltas — no player objects, no
    DataModel — so CHOMP-TC-016 and CHOMP-TC-017 can be written as unit specs
    before any of it is implemented.
  status: OPEN
  handoff: >
    CombatService must not write bar or carried; it computes an ImpactResult
    and hands the deltas to EconomyService (D-CHOMP-014). The boundary cases
    named in each doc comment are the spec: 44 versus 46 degrees, identical
    facings, clang symmetry, bar difference exceeding the loser's carry, an
    empty attacker bar, and the small-fry gap being inclusive at exactly 300.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-058, CHOMP-SYS-059, CHOMP-SYS-060, CHOMP-SYS-061]
  summary: >
    Item system built (D-CHOMP-045). Pads around Level 1, one slot per driver,
    four items differing in kind rather than degree: JetPack hop, three-shot
    Cannon, single slower HomingBomb, one-hit Shield. A fourth remote, UseItem,
    carries no arguments at all - the server owns item, charges, aim, hit and
    outcome, and reads the firing direction from the character transform it
    wrote itself. CHOMP-TC-042 extended with five item attacks in the same
    commit, as service_contracts.md requires of any fourth remote.
  status: OPEN
  handoff: >
    NOT yet played. The cannon and the bomb currently have nothing to shoot:
    there are no ghosts and usually one player in a session. They fire, travel,
    steer, expire and hit-test correctly against other players - that is honest
    rather than finished, and the first real test of them needs two clients.
    Damage is a placeholder 20 to the Humanoid. Real combat is directional
    (CHOMP-SYS-010 onward) - mouth versus flank - and projectiles have no
    directional rule yet. Deciding whether a cannon hit respects facing, or
    deliberately ignores it as the ranged exception, is a CHAIN-COMBAT design
    call that has not been made.
    The shield absorbs one hit by zeroing its own timer. That means a shield
    spent on a hit does not run its remaining duration, which is intended, but
    it also means two simultaneous hits both land. If that matters, it needs a
    per-hit flag rather than a timestamp.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-060]
  summary: >
    Cannon ammunition raised from 3 to 10 by owner decision. CHOMP-SYS-060 was
    amended in the same change: it hard-coded "three-shot", which turned a
    tuning number into a shall statement and would have put the tree in breach
    of a change nobody would call a design decision. It also still described the
    bomb as a steering projectile, which D-CHOMP-054 replaced with a placed
    mine. Both now describe roles and name ChompConfig.Items as where the
    numbers live.
  status: OPEN
  handoff: >
    Ten shots against one-hit ghosts is a large swing in favour of the player
    and has not been played. If clearing a ring becomes trivial, the lever is
    Ghosts.RespawnSeconds rather than the ammunition - fewer shots would just
    make the cannon feel mean, while a faster respawn keeps the pressure on.
    Worth a general check across the tree: any other requirement that hard-codes
    a number which lives in ChompConfig has the same latent problem.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-060]
  summary: >
    Cannon reworked into a held-trigger machine gun (D-CHOMP-056): 9 shots a
    second, 0.9-stud pellets drawn as streaks at speed 360, fired from the
    turret muzzle and inheriting 75% of the kart's velocity so the stream curves
    when firing sideways at speed. Mounted items enlarged, turret raised, and
    the bomb moved to a new RearMount so a carried bomb is visible behind you.
    Garage pads gained a pillar of light with a turning chest and a BANK HERE
    label.
  status: OPEN
  handoff: >
    Unplayed. Two things to watch. The lock reticle only appears when a ghost is
    inside a 70-degree cone within 240 studs - if it seems never to show, the
    likely cause is that ghosts are simply not near, not that the reticle is
    broken; drive at one to confirm before changing anything.
    Ten charges at nine shots a second is barely over a second of fire. If that
    feels miserly the honest fix is to make a charge mean a BURST rather than a
    pellet, not to raise the number until it stops meaning anything.

- date: '2026-08-26'
  agent: Claude (local session)
  action: DECIDED
  requirements: [CHOMP-SYS-058, CHOMP-SYS-059]
  summary: >
    Cannon range 300 -> 170 studs, swept raycast so shots stop at walls with a
    spark, out-of-range shots fizzle where they stop, lock range 240 -> 160 so
    it can never exceed the range. Friendly fire now gates player DAMAGE from
    pellets and bomb blasts, not just target acquisition (D-CHOMP-064).
  status: OPEN
  handoff: >
    The FF bug is the one to remember: the switch gated only the LOCK, so with
    it off you could not aim at a friend but a stray burst still hit them for
    full damage. Any future weapon must gate its damage on friendlyFire[player]
    at the point of the HIT - gating acquisition is not gating harm.
    Keep lockRangeStuds <= rangeStuds. A green reticle is a promise the shot
    connects; the two numbers drifted apart once already.
    Not done: ghosts still pass through walls, so a shot that now stops at a
    wall can still be chased through one. That asymmetry is currently in the
    ghosts' favour and should be looked at with pathing.
- date: '2026-08-27'
  agent: Claude (local session)
  action: NOTE
  requirements: [CHOMP-SYS-010]
  summary: >
    CORRECTION to the ESTABLISHED entry above, per this log's own protocol.
    That entry read "Chain established with 10 requirements" while its
    requirements field was a YAML ALIAS of the header list - so when
    CHOMP-SYS-058 to -061 were appended to the header, the alias silently
    rewrote the oldest entry to claim 14. The entry now carries the literal
    ten it was established with, recovered from the commit that first added
    this file.
  status: OPEN
  handoff: >
    The header today holds 14 and that is correct and current. Only the
    historical entry was wrong.
    Anchors are gone from all ten chain logs and validate.py now rejects them:
    an entry that aliases the header is an entry that changes when the header
    changes, which is precisely what "append-only, never rewrite an existing
    entry" forbids. The rule was never broken by hand - it was broken by a
    convenience in the serialiser, which is the only way a rule like that ever
    breaks.

- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-047]
  summary: >
    Grid widened from 8 studs to 16 (D-CHOMP-034). Corners felt sharp because
    they had to be: turning radius is 5.7 studs and an 8-stud cell left 0.6
    studs either side of the vehicle, so there was no room to arc. At 16 the
    sweep fits. RampCells 2 and GarageCells 2 keep those features at their old
    real sizes; ArenaCells 16 keeps the map near 256 studs. map_geometry.md
    updated throughout, including the six prefab sizes and the Studio snap.
  status: OPEN
  handoff: >
    Wall height is still 7, which is a camera constraint (camera_spec.md) and
    was NOT re-derived for the wider grid. Walls will read lower relative to a
    16-stud corridor, and whether that hurts occlusion or helps it is a
    CHOMP-TC-040 question, not a guess. Check it on the same device run.
    The chassis is 4.8 studs in a 14-stud clear corridor and will now look
    small. That is a vehicle-scale decision for CHAIN-VEHICLE rather than a map
    one, so it has been left alone.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-047]
  summary: >
    Level 1 built as a bowl (D-CHOMP-044), implementing Codex's D-CHOMP-041:
    raised rim with a three-ring maze, four broad slopes into an open central
    bowl, guardian chamber off the rim behind a non-collidable commitment
    boundary, four garages. Curved throughout, because continuous steering has
    nothing to hold a line around in a rectilinear maze. Every wall is tagged
    Chomp_Wall this time (D-CHOMP-043).
  status: OPEN
  handoff: >
    NOT yet driven. Two things to check first. Part count: three rings at
    SegmentStuds 8 are about 470 parts before the rim floor, lip and outer wall,
    so the whole map is likely 1200 to 1500. That is fine on a desktop and is
    exactly the kind of thing CHOMP-SYS-036 exists to catch on an iPad - raising
    SegmentStuds to 12 is the cheap lever and costs roundness.
    Second, the rim maze is generated from ring gaps and spokes and has NOT been
    checked for reachability the way ArenaMap flood-fills its grid. A ring maze
    is much harder to seal by accident, but "harder" is not "checked".
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-047]
  summary: >
    Level 1 rebuilt as ONE sealed level, 800 studs across (D-CHOMP-046),
    replacing the two-level bowl. Seven neon/brick rings with offset gaps and
    spokes, open centre arena, garages on the outer band, guardian chamber
    carved into the band rather than outside the boundary. BowlMap deleted.
  status: OPEN
  handoff: >
    NOT yet driven. The two-deck requirement CHOMP-SYS-047 says the maze IS
    multi-level, and Level 1 is now deliberately not - that is a real conflict

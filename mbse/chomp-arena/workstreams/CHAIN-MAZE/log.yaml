- date: '2026-08-25'
  agent: Claude (tree owner)
  action: NOTE
  requirements: [CHOMP-SYS-047, CHOMP-SYS-046]
  summary: >
    Map geometry fixed (D-CHOMP-017): 8-stud cells, 7-stud walls, 16-stud
    decks, 4-cell ramps, 1-cell bridges, 3x3 garages, six prefab pieces. The v1
    map is one two-deck map — 32x32 ground ring with twelve garages three per
    quadrant, a raised 16x16 Ring 2, four ramps each with a Threat 250
    guardian. Full spec in 03_architecture/map_geometry.md.
  status: OPEN
  handoff: >
    Build one 16x16 quadrant and rotate it three times; symmetry and therefore
    fair spawns then hold by construction. Snap increment 8, always — a map
    built off-grid produces ghosts that stick at ramp mouths, and that failure
    only appears once ghosts exist, potentially after a lot of building. Wall
    height 7 is derived from the camera and is not available as an art choice.
    This chain is the daughter's: the six pieces exist so she can build with
    them by hand today, long before the v3 kit formalises it.
- date: '2026-08-25'
  agent: Claude (engine)
  action: DELIVERED
  requirements: [CHOMP-SYS-047]
  summary: >
    TestMap.server.lua builds the throwaway two-deck test map procedurally from
    ChompConfig.Map — a 24x24 ground deck with a corridor, a tower core, a
    4-cell ramp, a raised deck and a bridge crossing the corridor below. Every
    dimension derives from the config, so changing the grid or the wall height
    changes the map rather than invalidating it.
  status: OPEN
  handoff: >
    This is not the v1 map and should not grow into it. It exists so the camera
    can be judged before anyone spends a weekend on real geometry. The bridge
    over the corridor is the occlusion case that matters, and the tower core is
    the fade case. Build the real v1 map only after CHOMP-TC-040 passes on the
    iPad.
- date: '2026-08-25'
  agent: Claude (engine)
  action: NOTE
  requirements: [CHOMP-SYS-047]
  summary: >
    Wall thickness raised from 1 stud to 2 in ChompConfig.Map. A character at
    high WalkSpeed can tunnel through a 1-stud wall, which is the precise
    failure CHOMP-SYS-003 exists to prevent, and speed upgrades make it more
    likely rather than less.
  status: OPEN
  handoff: >
    The grid is unaffected — walls sit on cell boundaries and 2 studs still
    leaves a clear 6-stud corridor inside an 8-stud cell. Nothing in the map
    geometry spec changes except the thickness figure.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-047]
  summary: >
    ArenaMap (D-CHOMP-030): a generated two-deck arena to drive — 32x32 braided
    ground maze, raised 16x16 ring 2, four ramps, four bridges ending in air,
    twelve garages, all from ChompConfig.Map and built by rotating one 16x16
    quadrant four times. Explicitly NOT the v1 map of map_geometry.md, which is
    hand-built by the child and stays gated on CHOMP-TC-040.
  status: OPEN
  handoff: >
    NOT yet run. Nobody has seen this map exist, let alone driven it. The
    geometry most likely to be wrong is the ramps: tilt direction is derived
    per rotation from the sign of the run, and a wrong sign gives a ramp that
    descends into the floor. If a ramp looks wrong, the two CFrame.Angles signs
    are the whole fix. Reachability is flood-filled at build time and warns in
    the output, so read the [ArenaMap] line before concluding the maze is fine:
    it reports how many of the 1024 ground cells are reachable from spawn.
    Change ChompConfig.Map.ArenaSeed for a different maze under the same rules.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-047]
  summary: >
    Arena stripped back after the first real drive (D-CHOMP-032): one deck,
    ArenaCells 20 instead of 32, braid raised to 0.45 for a looser maze with
    fewer dead ends. Ring 2, the four ramps and the four bridges are gated on

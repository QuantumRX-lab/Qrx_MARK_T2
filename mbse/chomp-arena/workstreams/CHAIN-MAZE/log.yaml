- date: '2026-08-25'
  agent: Claude (tree owner)
  action: NOTE
  requirements: [CHOMP-SYS-047, CHOMP-SYS-046]
  summary: >
    Map geometry fixed (D-CHOMP-017): 8-stud cells, 7-stud walls, 16-stud
    decks, 4-cell ramps, 1-cell bridges, 3x3 garages, six prefab pieces. The v1
    map is one two-deck map — 32x32 ground ring with twelve garages three per
    quadrant, a raised 16x16 Ring 2, four ramps each with a Threat 250
    guardian. Full spec in 03_architecture/map_geometry.md.
  status: OPEN
  handoff: >
    Build one 16x16 quadrant and rotate it three times; symmetry and therefore
    fair spawns then hold by construction. Snap increment 8, always — a map
    built off-grid produces ghosts that stick at ramp mouths, and that failure
    only appears once ghosts exist, potentially after a lot of building. Wall
    height 7 is derived from the camera and is not available as an art choice.
    This chain is the daughter's: the six pieces exist so she can build with
    them by hand today, long before the v3 kit formalises it.
- date: '2026-08-25'
  agent: Claude (engine)
  action: DELIVERED
  requirements: [CHOMP-SYS-047]
  summary: >
    TestMap.server.lua builds the throwaway two-deck test map procedurally from
    ChompConfig.Map — a 24x24 ground deck with a corridor, a tower core, a
    4-cell ramp, a raised deck and a bridge crossing the corridor below. Every
    dimension derives from the config, so changing the grid or the wall height
    changes the map rather than invalidating it.
  status: OPEN
  handoff: >
    This is not the v1 map and should not grow into it. It exists so the camera
    can be judged before anyone spends a weekend on real geometry. The bridge
    over the corridor is the occlusion case that matters, and the tower core is
    the fade case. Build the real v1 map only after CHOMP-TC-040 passes on the
    iPad.

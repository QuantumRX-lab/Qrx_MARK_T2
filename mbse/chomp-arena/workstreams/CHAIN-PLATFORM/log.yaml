- date: '2026-08-25'
  agent: Claude (engine)
  action: DECIDED
  requirements: [CHOMP-SYS-038]
  summary: >
    Remotes are now declared in default.project.json instead of created at
    require time (D-CHOMP-021). The old approach created them on whichever side
    required the module first; rewriting MovementService removed the last
    server-side require, so nothing created them and a client requiring the
    module yielded forever — which disabled steering entirely, because
    InputController required it at the top of the file.
  status: OPEN
  handoff: >
    Two rules from this. Instances that must exist belong in the project file,
    not in creation code that races. And nothing on the critical path may block
    on the network: input now acquires the module off-thread and drives locally
    regardless. The failure presented as an infinite-yield warning rather than
    as broken controls, which is why it survived a playtest.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-038]
  summary: >
    The client reported RequestPurchase missing from the remotes folder on two
    consecutive playtests, ten seconds after join each time. Cause was a name
    collision, not a missing instance: D-CHOMP-021 declared the events in a
    folder called Remotes, and src/ReplicatedStorage/Remotes.lua already syncs
    as a ModuleScript called Remotes, so ReplicatedStorage had two children
    with one name and WaitForChild returned the module rather than the folder.
    The folder is now RemoteEvents (D-CHOMP-024). Confirmed against the built
    place XML that ReplicatedStorage has no duplicate child names.
  status: OPEN
  handoff: >
    Never give a declared instance the same name as a module that syncs into
    the same parent — Rojo will create both and WaitForChild picks arbitrarily.
    This is worth a check in the static load-order guard that HANDOVER.md task 3
    calls for: duplicate child names under one parent in the built place should
    fail the build, because the symptom appears at runtime on one side only and
    reads as a missing instance.
- date: '2026-08-27'
  agent: Claude (local session)
  action: DECIDED
  requirements: [CHOMP-SYS-035]
  summary: >
    Launch-blocker pass (D-CHOMP-066). ProfileService.server.lua was UNTRACKED -
    committed unchanged first, at 56fc177, before anything was edited. It is the
    only writer of ChompProfileReady, which PlayerSessionService awaited in an
    unbounded loop, so a clean checkout built a place where every player sat on
    LOADING GARAGE forever. The wait is now bounded at 10s with a degraded
    read-only bay, load() is pcall-wrapped, players already present are loaded,
    and Robux prices are hidden behind Store.ShowRobuxPrices = false.
  status: OPEN
  handoff: >
    The rule this cost us: an attribute with exactly ONE writer is a
    single-point-of-failure for everything that awaits it. Any future
    await-an-attribute needs a timeout and a degraded path, not just a retry
    inside the writer.
    Check untracked files before treating a working tree as the build. `git
    status` was the whole diagnosis here; validate.py and guard.py both passed
    the entire time, because both read the working tree, which is exactly the
    thing that was lying.
    Still open against LAUNCH-READINESS P0: no GuardianService (chamber
    geometry and tuning only), no end condition after the guardian, no
    analytics, no exploit pass, and CHOMP-TC-040 has still never run.

- date: '2026-08-25'
  agent: Claude (platform)
  action: DELIVERED
  requirements: [CHOMP-SYS-037]
  summary: >
    Added src/ReplicatedStorage/ChompConfig.lua — the authoritative single
    definition of every tunable number, including the chassis table
    (BarCapacity, Power, BaseSpeed, BaseTurn, MouthArcDegrees, Cost) that
    CHAIN-VEHICLE was blocked on. Chassis are deliberately shaped as trades
    rather than straight upgrades: bigger tiers are faster but turn worse.
    Also added src/ServerStorage/ChompTools/VehicleConformance.lua, the
    executable form of CHOMP-TC-044.
  status: OPEN
  handoff: >
    Engine services must read every balance value from ChompConfig; a numeric
    literal in service logic is a CHOMP-SYS-037 violation. Two limits are
    documented in the scanner rather than hidden: triangle count is declared by
    the model, not measured, and the silhouette check is a bounding-box
    approximation that does not replace looking at the vehicle on an iPad.
- date: '2026-08-25'
  agent: Claude (platform)
  action: DELIVERED
  requirements: [CHOMP-SYS-038]
  summary: >
    Added the shared vocabulary every chain builds against:
    src/ReplicatedStorage/Types.lua (PlayerState, OwnView, PublicView,
    ImpactResult, Junction, WorldView, GhostBehaviour),
    03_architecture/player_state.md (the single-writer ownership table and the
    invariants), and 03_architecture/service_contracts.md (what each service
    owns, exposes and must not touch, plus the complete three-remote client
    surface with rate limits).
  status: OPEN
  handoff: >
    Two rules bind every chain from here. One: a field has exactly one writing
    service, and you ask rather than write. Two: no remote carries a quantity —
    intent only, the server supplies every number, and adding a fourth remote
    means extending the exploit suite in the same commit.
- date: '2026-08-25'
  agent: Claude (engine)
  action: DELIVERED
  requirements: [CHOMP-SYS-038, CHOMP-SYS-037]
  summary: >
    default.project.json (Rojo sync of src/ into the DataModel) and
    src/ReplicatedStorage/Remotes.lua — the three remotes created once and
    found by name, with a per-player rate limiter matching the limits in
    service_contracts.md. BUILDING.md documents how to sync, run, and execute
    the CHOMP-TC-040 camera acceptance run on the iPad.
  status: OPEN
  handoff: >
    One contract correction: SetInputDirection was specified as rejecting a
    vector that is not unit-length, which is wrong for a steering scalar. The
    contract now matches what the server actually validates — Vector2, no NaN,
    X within [-1, 1]. Adding a fourth remote still means extending the exploit
    suite in the same commit.
- date: '2026-08-25'
  agent: Claude (engine)
  action: DECIDED
  requirements: [CHOMP-SYS-038]
  summary: >
    Remotes are now declared in default.project.json instead of created at
    require time (D-CHOMP-021). The old approach created them on whichever side
    required the module first; rewriting MovementService removed the last
    server-side require, so nothing created them and a client requiring the
    module yielded forever — which disabled steering entirely, because
    InputController required it at the top of the file.
  status: OPEN
  handoff: >
    Two rules from this. Instances that must exist belong in the project file,
    not in creation code that races. And nothing on the critical path may block
    on the network: input now acquires the module off-thread and drives locally
    regardless. The failure presented as an infinite-yield warning rather than
    as broken controls, which is why it survived a playtest.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-038]
  summary: >
    The client reported RequestPurchase missing from the remotes folder on two
    consecutive playtests, ten seconds after join each time. Cause was a name
    collision, not a missing instance: D-CHOMP-021 declared the events in a
    folder called Remotes, and src/ReplicatedStorage/Remotes.lua already syncs
    as a ModuleScript called Remotes, so ReplicatedStorage had two children
    with one name and WaitForChild returned the module rather than the folder.
    The folder is now RemoteEvents (D-CHOMP-024). Confirmed against the built
    place XML that ReplicatedStorage has no duplicate child names.
  status: OPEN
  handoff: >
    Never give a declared instance the same name as a module that syncs into
    the same parent — Rojo will create both and WaitForChild picks arbitrarily.
    This is worth a check in the static load-order guard that HANDOVER.md task 3
    calls for: duplicate child names under one parent in the built place should
    fail the build, because the symptom appears at runtime on one side only and
    reads as a missing instance.
- date: '2026-08-25'
  agent: Claude (local session)
  action: NOTE
  requirements: [CHOMP-SYS-051]
  summary: >
    FIRST REAL CAMERA EVIDENCE. Driving the generated arena in Studio, the
    on-screen readout reported worst occlusion 0.92s against the 0.20s ceiling,
    one breach — CHOMP-SYS-051 failing by 4.6x. This is RISK-CHOMP-012 landing
    exactly where the tree said it would.
    Caveats stated so nobody over-reads it: this is Studio, not the iPad, so it
    is not CHOMP-TC-040 and the requirement stays NOT_STARTED. It is also the
    generated arena rather than authored geometry, and the 16-stud grid of
    D-CHOMP-034 changed the corridor width the camera was tuned against without
    WallHeight being re-derived — that is recorded as an open item in
    CHAIN-MAZE and may be the whole cause.
  status: OPEN
  handoff: >
    Do not tune the camera by guessing. The readout already reports duration, so
    the next step is to make it report WHERE: log the position and the obscuring
    part name at the moment of a breach. A 0.92s occlusion is long enough that
    it is one specific piece of geometry, not general tightness, and knowing
    which wall it was decides whether this is a camera problem, a wall-height
    problem, or a map-generation problem.
    Wall height is still 7, derived at 38 degrees pitch against 8-stud
    corridors. Corridors are now 16. Re-deriving that is the first candidate.

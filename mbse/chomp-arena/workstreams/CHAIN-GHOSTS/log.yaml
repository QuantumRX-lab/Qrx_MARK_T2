- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-017]
  summary: >
    Ghosts built (D-CHOMP-049): hooded translucent figures with tracking eyes
    and a rippling hem, hunting the nearest kart within 260 studs and taking 25%
    of CARRIED points on contact. Never touch banked dollars. Slower than a
    Standard chassis on purpose. Bobbing stops as one closes in, because
    stillness reads as intent.
  status: OPEN
  handoff: >
    Behaviour is one Chaser, not the four personalities of CHOMP-SYS-040, and
    there is no pathing: a ghost steers straight at its target and will sit
    against a wall if one is between them. On a ring maze that mostly works and
    occasionally looks stupid. Real multi-deck pathing is CHOMP-SYS-048 and is
    not started.
    Ghosts are anchored puppets posed per frame rather than physical bodies.
    That is cheap and correct while they cannot be hit; the moment Full Jaw lets
    a player EAT one (CHOMP-SYS-019) they will need a real hit test.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-017]
  summary: >
    Ghosts are now dangerous and killable (D-CHOMP-051). Contact deals 14 damage
    on a 1.6s cooldown as well as stealing; two cannon hits or one bomb kills
    one; they vanish and return after 12s. An active shield absorbs the contact
    and throws the ghost clear. Running out of health is an ordinary death and
    respawn.
  status: OPEN
  handoff: >
    NOT yet played, and the balance is entirely unmeasured: 14 damage against
    100 health is seven touches, and nobody knows whether that is generous or
    brutal at this map size. ContactDamage, ContactCooldownSeconds and
    Ghosts.Health are the three numbers to move.
    Ghosts still have no pathing and will press against a wall between them and
    you. Now that they can be shot, that also means they can be farmed from
    behind a wall - a player safe on one side of a ring can kill a ghost stuck
    on the other. That is a real exploit of the movement model rather than a
    cosmetic flaw, and it wants either pathing or a line-of-sight test on the
    projectile.
- date: '2026-08-25'
  agent: Claude (local session)
  action: NOTE
  requirements: [CHOMP-SYS-017]
  summary: >
    OPEN QUESTION CLOSED (D-CHOMP-061). Ghosts stay planar and cannot reach an
    airborne kart, by decision rather than by omission: the jump is an escape
    move with a shooting window - jump, fire down, land, flee. It costs a full
    charge bar, about twenty-five pellets, so it is a resource spent rather than
    a state held. Turret down-pitch raised 60 -> 80 so the firing half is
    actually possible against a close pursuer.
  status: OPEN
  handoff: >
    TWO NUMBERS NOW LOAD-BEARING that do not look it. Pellets sit at y=4 with a
    9-stud pickup radius and the jump apexes near 53, so an airborne player
    cannot collect and cannot refill the meter that put them up there. That
    self-limit was not designed - it fell out - and raising the pickup radius or
    lowering the jump would turn a costed escape into a hover-farm with nothing
    to warn you. If either moves, re-check this.
    Ghost movement remains deliberately planar. Do not "fix" it by giving ghosts
    height without revisiting D-CHOMP-061 first.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-017]
  summary: >
    Wave one raised from 4 ghosts to 9, growth from 2 to 3 per wave, and every
    wave now spawns in a ring AROUND a random player at 55 to 150 studs rather
    than parking ghosts on distant rings (D-CHOMP-062). Spawns are clamped
    inside the boundary wall.
  status: OPEN
  handoff: >
    Unplayed, and this is the change most likely to be too much rather than too
    little: nine ghosts converging from 55 studs on a player who has just
    spawned with an empty belt could be a slaughter. If it is, the first lever
    is SpawnMinDistanceStuds rather than the count - arriving further away buys
    reaction time without making the wave feel thin.
    With more than one player the anchor is a RANDOM player, so a second player
    across the arena sees nothing arrive. That is fine for now and wrong later.
- date: '2026-08-26'
  agent: Claude (local session)
  action: DECIDED
  requirements: [CHOMP-SYS-019, CHOMP-SYS-021]
  summary: >
    Garages are sanctuaries (D-CHOMP-065). Ghosts cannot spawn inside, walk in,
    steal from or damage anyone within one. Home 150 studs, the other three 60.
    Blocked ghosts keep tangential motion and circle the line. Wave spawns
    anchored on a player already inside start from outside the radius.
  status: OPEN
  handoff: >
    sanctuaries is read ONCE at startup from Chomp_Garage tagged pads, which
    Level1Map builds first. A map that creates pads late must call
    readSanctuaries() again - there is no listener.
    Both spawn halves are needed. pushClear alone puts the whole wave on the
    sanctuary line, which is a wall of ghosts at the exit; the spread rule is
    what actually distributes them, and pushClear is only the backstop.
    Still open: ghosts have no pathing and walk through maze walls, so the
    sanctuary is currently the only geometry they respect.

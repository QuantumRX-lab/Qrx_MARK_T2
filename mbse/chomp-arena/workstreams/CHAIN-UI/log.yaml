- date: '2026-08-25'
  agent: Claude (local session)
  action: NOTE
  requirements: [CHOMP-SYS-055, CHOMP-SYS-032]
  summary: >
    TWO REQUIREMENT CONFLICTS, opened deliberately rather than ignored.
    The HUD values moved to a bottom-right stack (D-CHOMP-053) because Roblox's
    own chrome - menu, chat, close - sits on top of the top corners and made

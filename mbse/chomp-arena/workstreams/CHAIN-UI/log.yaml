    The new position also enters the lower-right zone CHOMP-SYS-032 reserves for
    thumbs. On desktop that is free; on an iPad it will not be.
  status: OPEN
  handoff: >
    Someone has to decide which is wrong: the requirement or the layout. The
    honest options are to amend CHOMP-SYS-055 to specify "clear of platform

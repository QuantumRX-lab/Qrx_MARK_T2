- date: '2026-08-25'
  agent: Claude (tree owner)
  action: NOTE
  requirements: [CHOMP-SYS-009]
  summary: >
    Decomposed progression into pure functions:
    src/ReplicatedStorage/ChompLogic/Progression.lua holds computePower,
    effectiveStats, costOf, carryBand and catchUpGrant as typed stubs.
    effectiveStats is where the upgrade trade-offs actually live — Speed levels
    reduce turn, Agility levels reduce speed — with a floor at half the chassis
    base so no build can be immobilised.
  status: OPEN
  handoff: >
    computePower is the only place power is calculated; PlayerState.power is a
    cache asserted equal to it in debug builds. EconomyService is the sole
    writer of bar, carried and banked, and every delta function returns what
    was actually applied after clamping — a caller assuming its request landed
    will drift from the truth the first time a clamp bites.
- date: '2026-08-25'
  agent: Claude (local session)
  action: DELIVERED
  requirements: [CHOMP-SYS-005]
  summary: >
    Pellets and banking built (D-CHOMP-048). Pellets on every ring lane, worth
    more toward the middle, power pellets in the open centre. Eating fills
    ChompCarried; driving onto a garage pad converts the lot to ChompDollars
    with no button or prompt. Carried dies with you, dollars persist.
  status: OPEN
  handoff: >
    NOT yet played. Values come straight from Economy.PelletValueByRing and have
    never been balanced against how long a lap takes - the first real question
    is whether a full circuit is worth more or less than a trip to the middle,
    and nobody has measured either.
    The combo window, ComboWindowSeconds and ComboMax, is in config and unused.
- date: '2026-08-26'
  agent: Claude (local session)
  action: DECIDED
  requirements: [CHOMP-SYS-007, CHOMP-SYS-008]
  summary: >
    The garage sells the four weapons alongside chassis and upgrades, priced
    under one good bank run, on plinths showing the same models the maze pads
    use (new shared ItemModels module). Charge jump cost 100 -> 60. Plinth
    spacing 4.2 -> 2.9 degrees to fit ten offers (D-CHOMP-064).
  status: OPEN
  handoff: >
    A weapon purchase goes through ServerStorage.ChompTools.GrantItem, a
    BindableFunction ItemService publishes. The order is GRANT THEN CHARGE: a
    full belt refuses, and the refusal must cost nothing. Any future sellable
    that can be refused must follow the same order.
    Robux prices remain display-only for every offer including weapons. Wiring
    a real purchase is a parent's decision, not a build's.
- date: '2026-08-27'
  agent: Claude (local session)
  action: DECIDED
  requirements: [CHOMP-SYS-007, CHOMP-SYS-064, CHOMP-SYS-067]
  summary: >
    Requirement triage (D-CHOMP-068). CHOMP-SYS-007 amended: banking works at ANY
    garage pad, since per-player garages were never built and the four pads on
    Level 1 are shared. The charge meter and escape jump (CHOMP-SYS-064) and the
    plinth shop (CHOMP-SYS-067) now have requirements and test cases.
  status: OPEN
  handoff: >
    CHOMP-SYS-067 puts three rules in a SHALL that were only ever conventions:
    the server owns the price, anything refusable is granted BEFORE it is
    charged for, and no real-currency price is displayed while no real purchase
    is wired. All three were violated at some point by working code.
    CHOMP-SYS-064 requires spending the COST, not the whole meter - the code
    zeroed it for two days after D-CHOMP-064 decided otherwise.
- date: '2026-08-28'
  agent: Codex
  action: DELIVERED
  requirements: [CHOMP-SYS-064]
  summary: >
    Release 0.3.9-alpha adds visible passive jump-charge recovery at 5 per second,
    rising to 12 per second in the guardian chamber. Pellet charge remains an
    immediate bonus, while the escape control can no longer remain visually dead.
  status: OPEN
  handoff: >
    Confirm a zero meter reaches jump cost in about 12 seconds in Level 1 and

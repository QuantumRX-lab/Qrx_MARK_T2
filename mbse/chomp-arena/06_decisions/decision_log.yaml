# Chomp Arena — Decision Log

decisions:

  - id: D-CHOMP-001
    date: 2026-08-25
    title: Build a good game first, the children's authoring kit second
    decision: >
      v1 and v2 build and prove the game as a hard-coded experience. The
      authoring kit — tags, attributes, mirror tool, Check My Maze — lands in
      v3.
    rationale: >
      Owner decision. A kit is only worth building once it is abstracting
      something that is actually fun; abstracting an unproven design means
      designing the authoring surface for mechanics that may not survive
      playtesting, and then rebuilding it.
    outcome: >
      Two v1 requirements act as the down payment so v3 is an exposure of what
      exists rather than a rewrite: CHOMP-SYS-037 (every tunable number in one
      config table) and CHOMP-SYS-038 (engine finds content by tag, never by
      hardcoded path). Both cost almost nothing now and are expensive to
      retrofit. See RISK-CHOMP-006 for what this ordering costs the children.

  - id: D-CHOMP-002
    date: 2026-08-25
    title: The vehicle is the character controller, not a physics vehicle
    decision: >
      Use the standard Roblox character with a custom Pac-Man model and tuned
      movement values. No VehicleSeat, no wheels, no unanchored physics.
    rationale: >
      The whole combat system reads the facing angle. Physics vehicles flip,
      jitter as network ownership passes between clients, and push each other
      through walls, which makes that angle non-deterministic and different on
      every screen. It also turns the speed and agility upgrades into two
      server-side numbers instead of a suspension-tuning problem.
    outcome: CHOMP-SYS-001, CHOMP-SYS-002.

  - id: D-CHOMP-003
    date: 2026-08-25
    title: Points must be banked at a garage before they count
    decision: >
      Split the score into carried points (at risk) and banked dollars (safe,
      and the only thing that buys upgrades).
    rationale: >
      Without it, points are a counter and there is never a reason to stop
      eating or to take a risk. With it, every minute is a greed decision, the
      map gains geography, and Power — which only rises when banked dollars are
      spent — becomes an outcome of surviving the trip home rather than of
      hoarding.
    outcome: CHOMP-SYS-007, CHOMP-SYS-008, CHOMP-SYS-009.

  - id: D-CHOMP-004
    date: 2026-08-25
    title: Combat losses scatter on the floor rather than transferring
    decision: >
      Points lost to a hit spawn as collectable pellets at the impact point,
      available to anyone including the victim.
    rationale: >
      Direct transfer compounds whoever is already ahead. Scatter makes every
      fight a contested pile that pulls in third parties, lets someone rob the
      winner, and keeps the reward for attacking real but not automatic.
    outcome: CHOMP-SYS-013.

  - id: D-CHOMP-005
    date: 2026-08-25
    title: Attacking costs the attacker battle bar
    decision: >
      A side or rear bite costs the attacker 30% of their bar; a head-on costs
      both players 40%.
    rationale: >
      Without a cost, the fastest player rear-ends the lobby indefinitely and
      no other system matters. Spending bar sends the attacker back to the
      pellets to re-arm and makes each attack a decision.
    outcome: CHOMP-SYS-011, CHOMP-SYS-012. Residual risk RISK-CHOMP-003.

  - id: D-CHOMP-006
    date: 2026-08-25
    title: Levels are gated rings inside one maze, not separate places
    decision: >
      Super ghosts guard gates between concentric rings of a single maze, and
      cracking a gate opens it for the whole lobby for 60 seconds.
    rationale: >
      The obvious reading — each player unlocks their own next level — would
      separate players into different mazes, and a combat game requires them in
      the same one. Rings keep the lobby together and additionally sort it by
      strength: a beginner farms the outer ring while stronger players fight
      over the centre, which is age-fair matchmaking falling out of the map
      layout with no matchmaking code.
    outcome: CHOMP-SYS-022 through CHOMP-SYS-026. Residual risk RISK-CHOMP-004.

  - id: D-CHOMP-007
    date: 2026-08-25
    title: Twelve players per server
    decision: MaxPlayers 12, with 12 garages arranged 3 per quadrant.
    rationale: >
      Owner decision. 12 divides by four, so every garage has a symmetric
      counterpart and no spawn is better than another. It stays comfortable in
      one maze, and a smaller cap makes a server feel busier with the five or
      six players realistically online. Raising it later is a quadrant edit,
      not a rebuild.
    outcome: CHOMP-SYS-046.

  - id: D-CHOMP-008
    date: 2026-08-25
    title: Power resets at match end; nothing that affects power persists
    decision: >
      Upgrades, chassis and Power carry across the rounds of a match and reset
      at match end. Cross-session persistence stores cosmetics and statistics
      only.
    rationale: >
      Permanent progression means a veteran drives an Apex against a
      first-timer's Standard and the first-timer never touches a pellet. This
      is the mechanical form of the owner's fairness requirement.
    outcome: CHOMP-SYS-028, CHOMP-SYS-042.

  - id: D-CHOMP-009
    date: 2026-08-25
    title: Ghost personalities are pluggable modules from v1
    decision: >
      Each ghost behaviour is a ModuleScript returning one direction-choosing
      function. v1 ships The Chaser and The Greedy One; v2 adds the rest.
    rationale: >
      Distinct, learnable behaviours are what make a maze feel alive, and the
      module boundary costs nothing to establish now. It is also the v3
      on-ramp: a ten-line function is the first real code an older child will
      write, in a game their sister is already playing.
    outcome: CHOMP-SYS-019, CHOMP-SYS-020.

  - id: D-CHOMP-010
    date: 2026-08-25
    title: Ghost count scales with player count, instead of a separate solo mode
    decision: >
      The server sets the number of active ghosts from the current player
      count, raising it as players leave and lowering it as they join. No solo
      mode, no menu, no second rule set.
    rationale: >
      Published to Friends only, most sessions will have one or two players,
      and a 12-player PvP design degrades badly at that population. The ghosts
      and gates already constitute a complete single-player Pac-Man, so the
      marginal cost is small, because ghosts, gates, pellets, banking and
      upgrades all work identically with one player — what is missing is only
      an opponent, and ghosts are opponents.

      Scaling was chosen over a solo mode because it costs about an hour, adds
      no menu and no second set of rules, and additionally fixes a subtler
      problem: a half-empty PvP server feels dead even with three or four
      players in it, and more ghosts make it feel busy.
    outcome: >
      CHOMP-SYS-053 (v1). RISK-CHOMP-007 closed. CHOMP-SYS-041 narrowed to team
      play and an opt-out of PvP, since the empty-server case no longer needs a
      mode to solve it.

  - id: D-CHOMP-011
    date: 2026-08-25
    title: The maze is multi-level — towers, ramps and bridges
    decision: >
      Maps are vertically stacked decks connected by ramps and bridges, with
      the rings ascending toward the centre and the Vault at the top of the
      central tower, rather than concentric rings on a single plane.
    rationale: >
      Owner decision. It makes the progression visible: from the ground floor a
      player can see the ring they are not yet allowed into, with a guarded ramp
      between them and it, where on a flat plane a locked ring is an
      abstraction. It also produces natural chokepoints — a bridge is a corridor
      with no sideways escape and therefore where head-on contests actually
      happen — allows scouting a fight before joining it, and yields the drop
      attack for free, since a mouth never points at the ceiling and an attack
      from above is therefore always a flank.
    outcome: >
      CHOMP-SYS-047 through CHOMP-SYS-052. Costs accepted: ghost pathing becomes
      a multi-deck graph (cheap, provided vertical links are explicit prefab
      data), build cost per map rises sharply (RISK-CHOMP-013, mitigated by v1
      shipping one two-deck map), and the camera becomes the hardest technical
      problem in the project (RISK-CHOMP-012, to be solved on a test map before
      any real map is built). Falls are explicitly non-lethal (CHOMP-SYS-049) —
      no voids, no death planes.

  - id: D-CHOMP-012
    date: 2026-08-25
    title: Authored Luau lives in the repo, not only in the place file
    decision: >
      Engine and tool source is committed under mbse/chomp-arena/src/ in a
      DataModel-shaped folder tree and synced into Studio (Rojo or equivalent),
      rather than existing only inside the .rbxl place file.
    rationale: >
      Raised by a real blocker: CHAIN-VEHICLE claimed its requirements and then
      correctly stopped, because the vehicle contract told it to mirror
      ChompConfig values that existed nowhere it could read, and to satisfy a
      conformance test that existed only as a written test case rather than as
      something runnable. A .rbxl is a binary that cannot be diffed, reviewed or
      shared between agents — so any tree that expects several agents to work
      against a common contract has to keep the authored source in git.
    outcome: >
      src/ReplicatedStorage/ChompConfig.lua (the authoritative numbers,
      CHOMP-SYS-037) and src/ServerStorage/ChompTools/VehicleConformance.lua
      (the executable form of CHOMP-TC-044) added, unblocking CHAIN-VEHICLE.
      The place file becomes a build output rather than the source of truth.

  - id: D-CHOMP-013
    date: 2026-08-25
    title: Other players' carried totals are shown as a band, not a number
    decision: >
      A client receives its own full state, but only a PublicView of everyone
      else — chassis, power, deck, ring, Full Jaw state, and a carry band of
      Light, Heavy or Fat rather than an exact carried total.
    rationale: >
      Knowing who is worth chasing is half the strategy and is what makes
      banking a real decision rather than a chore, so the information has to be
      there in some form. The exact figure is a different thing: it hands an
      exploiter a target list ranked by precise value and lets them compute
      exactly what a hit will yield before committing to it. A band preserves
      the decision and removes the calculator. It is also more readable to a
      seven-year-old — "that one is Fat" registers at a glance where "413" does
      not.
    outcome: >
      PublicView in src/ReplicatedStorage/Types.lua; thresholds in ChompConfig;
      Progression.carryBand is the only place the banding is computed.

  - id: D-CHOMP-014
    date: 2026-08-25
    title: Single-writer rule on the player state record
    decision: >
      Every field of PlayerState has exactly one service permitted to write it.
      Other services request changes through a named function on the owner, and
      every mutating call carries a reason string.
    rationale: >
      Two services writing the same at-risk pool is how points silently go
      missing: combat subtracts, banking adds, both read a stale value and one
      write lands on top of the other. It surfaces weeks later as "she banked
      400 and only got 250" and is close to untraceable. The notable
      consequence is that CombatService does not write bar or carried at all —
      it computes deltas with pure logic and hands them to EconomyService,
      which keeps the combat maths unit-testable and puts all income accounting
      in one place.
    outcome: >
      03_architecture/player_state.md ownership table;
      03_architecture/service_contracts.md; the reason strings are what make
      the CHOMP-TC-043 fairness assertions computable at all.

  - id: D-CHOMP-015
    date: 2026-08-25
    title: Hold to turn, always driving forward, no action buttons
    decision: >
      Touch and hold on the left or right of the screen to steer, proportional
      to distance from a 20% dead zone; the vehicle always drives forward;
      double-tapping the far side performs a 180 flip. Banking, eating, Full
      Jaw and gate passage are consequences of driving somewhere. There is no
      accelerator, no brake and no action button anywhere in the game.
    rationale: >
      Owner decision. A virtual thumbstick has an origin that drifts and gets
      dropped mid-corner; hold-to-turn has no origin, so a seven-year-old
      cannot lose it. Turning is the entire skill of this game — agility is
      what converts a flank hit into a head-on — so steering gets the entire
      screen rather than a small puck. Always-forward is Pac-Man, and stopping
      is not an interesting choice: it makes you a stationary target with no
      upside. Zero action buttons also removes any conflict between controls
      and HUD placement.
    outcome: >
      03_architecture/control_scheme.md, ChompConfig.Controls, CHOMP-SYS-032.
      A brake and swipe-to-turn were both considered and rejected, with reasons
      recorded — swipe in particular decouples input from timing, and this
      game's combat is about when you bring your mouth to bear.

  - id: D-CHOMP-016
    date: 2026-08-25
    title: World-locked camera yaw, 35 degrees, with occluder fading
    decision: >
      The camera never rotates with the vehicle. Fixed world yaw, 35 degrees of
      pitch, 42 studs back, 55 degree FOV, 6 studs of look-ahead, deck changes
      eased with a critically damped spring over 0.35 s, and any wall or decor
      between camera and player faded to 0.75 over 0.12 s.
    rationale: >
      In a maze you turn constantly, and a camera that follows every turn swings
      the whole world several times a second: nauseating on a tablet held close
      to the face, and it destroys maze legibility because a memorised junction
      faces a different way on every approach. Locked yaw keeps the maze a
      stable, learnable place. The cost is that facing must be read from the
      model rather than the camera — which is exactly why the vehicle contract
      demands a mouth at 30% of the silhouette that reads in greyscale. The
      camera decision and the vehicle readability rule are the same decision
      seen twice.
    outcome: >
      03_architecture/camera_spec.md, ChompConfig.Camera. Fade-in is 0.12 s
      specifically to leave margin under the 0.2 s occlusion ceiling in
      CHOMP-SYS-051. Build it first, on a two-deck test map, on the iPad.

  - id: D-CHOMP-017
    date: 2026-08-25
    title: Map geometry fixed to an 8-stud grid; wall height set by the camera
    decision: >
      8-stud cells, 7-stud walls, 16-stud deck height, 4-cell ramps, 1-cell
      bridges, 3x3 garages, and a six-piece prefab set. The v1 map is one
      two-deck map: a 32x32 ground ring with twelve garages, a raised 16x16
      Ring 2, four ramps each with a Threat 250 guardian at its base.
    rationale: >
      A single grid size is what makes ghost pathing cheap, symmetry automatic
      and prefab building possible for a child. Wall height at 7 is derived,
      not chosen: at 35 degrees of camera pitch with 8-stud cells and vehicles
      up to 6 studs tall, anything taller occludes the corridor ahead. This
      closes the open question that has been sitting in the dashboard — wall
      height was never an art choice.
    outcome: >
      03_architecture/map_geometry.md, ChompConfig.Map. The "prefab system" is
      a snap increment of 8 and six models, not a tool anyone has to write.
      Rings 3 and 4 are v2; the engine handles N decks from the start.

  - id: D-CHOMP-018
    date: 2026-08-25
    title: The client applies rotation to its own character; the server owns the numbers
    decision: >
      Steering is applied client-side by VehicleController on the character the
      client already owns. MovementService keeps authority over the values —
      it computes speed and turn rate from chassis and upgrades, writes them
      onto the character as attributes, re-asserts WalkSpeed on a timer, and
      flags horizontal travel that exceeds what those values allow.
    rationale: >
      Corrective. The first implementation rotated the character from the
      server every heartbeat. Roblox gives a client network ownership of its
      own character, so that was two authorities writing one transform every
      frame, and the result was jitter and rubber-banding severe enough that
      the first playtest reported the handling as terrible. Roblox's
      replication model does not let a server smoothly drive a player's own
      character, and pretending otherwise bought no security — it only made
      the game feel broken. The security property that matters is preserved:
      a client cannot choose its own speed or turn rate, and a client that
      moves faster than its stats allow is detectable server-side.
    outcome: >
      VehicleController.client.lua added; MovementService.server.lua rewritten
      to stop writing CFrame. Steering is also ramped over
      Movement.SteerRampSeconds, because raw input at any turn rate high enough
      to make a junction is twitchy.

  - id: D-CHOMP-019
    date: 2026-08-25
    title: Chassis models carry identity and shape, never tuning values
    decision: >
      BaseSpeed and BaseTurn are removed from the vehicle contract's required
      attributes and from the conformance scan. A model declares Tier,
      BarCapacity, Power, MouthArcDegrees and TriangleCount; ChompConfig owns
      speed and turn.
    rationale: >
      Surfaced immediately by the first retune: turn rates changed from 540 to
      240 degrees per second, which would have made all four delivered models
      fail conformance on a mismatch that says nothing about the models. Tuning
      values change every playtest. A model that carries a stale copy of one is
      a re-delivery for no reason.
    outcome: >
      VehicleConformance.lua REQUIRED_ATTRIBUTES reduced; vehicle_contract.md
      updated. Codex's four delivered models are unaffected and need no rework.

  - id: D-CHOMP-020
    date: 2026-08-25
    title: Handling and camera retuned against published benchmarks
    decision: >
      Turn rates cut from 540/480/450/420 to 240/220/200/185 degrees per
      second. Camera field of view raised from 55 to 75, distance reduced from
      42 to 34, pitch from 35 to 38 degrees. Look-ahead and horizontal follow
      are now eased rather than applied instantly. Wall thickness raised from 1
      stud to 2.
    rationale: >
      First playtest reported bad handling and a camera that did not move
      correctly. 540 degrees per second is one and a half full rotations a
      second, which is unusable; the geometry sets the right value — 8-stud
      cells at 24 studs per second is a third of a second per cell, so a 90
      degree junction turn needs roughly 270 deg/s to complete inside one cell,
      and 240 with agility upgrades on top lands there. Roblox's default field
      of view is 70 and arcade games go wider to convey speed, so 55 was a
      telephoto lens that flattened the scene. An unsmoothed look-ahead snapped
      around on every turn, which reads as the world sliding sideways rather
      than the vehicle turning. Wall thickness went up because high WalkSpeed
      can tunnel a character through a 1-stud wall, which is exactly what
      CHOMP-SYS-003 exists to prevent.
    outcome: >
      ChompConfig retuned; CameraController eases look-ahead and horizontal
      follow separately from the deck spring, and uses floor rather than round
      for deck detection so the spring is not chased mid-ramp and mid-fall.

  - id: D-CHOMP-021
    date: 2026-08-25
    title: Remotes are declared in the project file, and input never blocks on them
    decision: >
      The three RemoteEvents are declared as instances in default.project.json
      rather than created at require time. Remotes.lua only resolves them, with
      a timeout and an explicit error. InputController acquires the module in a
      spawned task and steers regardless of whether it arrives.
    rationale: >
      Found in the second playtest. The module created the remotes on whichever
      side required it first, which was a latent race; rewriting MovementService
      removed the last server-side require, so nothing created them, and a
      client requiring the module yielded forever on WaitForChild. Because
      InputController required it at the top of the file, that silently disabled
      steering entirely — the failure presented as an unrelated warning about an
      infinite yield rather than as "the controls do not work". Declaring the
      instances removes the race; acquiring them off-thread means a network
      surface that is missing or late can never again stop a player driving.
    outcome: >
      default.project.json declares ReplicatedStorage.Remotes and its three
      events; Remotes.lua creates nothing; InputController holds the module
      optionally and only fires when it is present.

  - id: D-CHOMP-022
    date: 2026-08-25
    title: Chassis models are authored as Luau specs, not binary .rbxm files
    decision: >
      A chassis is a declarative spec table in
      src/ServerStorage/ChompTools/VehicleSpecs/, built into a Model by
      VehicleFactory. The four delivered .rbxm files stay until replaced one at
      a time, Standard first.
    rationale: >
      A binary model cannot be diffed, cannot be reviewed, and cannot be
      regenerated after a tuning or convention change — and an agent with no
      Roblox runtime cannot inspect what it just produced, which is why this
      chain correctly logged BLOCKED twice rather than guess. A spec table is
      text: it reviews, it regenerates, and one command in Studio turns it into
      something you can look at.
    outcome: >
      VehicleFactory.lua builds and asserts the contract at build time rather
      than reporting violations later — notably that the mouth sits forward of
      the origin, since a backwards vehicle does not look wrong, it inverts
      combat. Attributes are read from ChompConfig rather than written into the
      spec, so a model cannot drift from the numbers the game uses. Work
      instruction in workstreams/CHAIN-VEHICLE/BUILD-AND-TEST.md.

  - id: D-CHOMP-023
    date: 2026-08-25
    title: The default control script is disabled; this client is the only mover
    decision: >
      VehicleController disables Roblox's default PlayerModule controls on
      startup, making it the single writer of locomotion for the character it
      owns. The disable runs off-thread and warns loudly if it fails.
    rationale: >
      Found in the first playtest run from a local session. MovementService
      already set AutoRotate = false, but nothing disabled the default control
      script, which calls humanoid:Move() every frame from its own input. With
      no key held that call is Vector3.zero, so it cancelled the unconditional
      forward drive in VehicleController; with a key held it supplied a
      camera-relative direction instead. The vehicle therefore only moved while
      a key was down and never steered, which reads as "the controls are
      broken" rather than as a second authority writing the same value. This is
      D-CHOMP-018 in a different property: that fix moved rotation off the
      server but left two writers of Move() on the client.
    outcome: >
      VehicleController requires PlayerModule and calls GetControls():Disable()
      in a spawned task, printing on success and warning on failure. Steering
      and the forward drive are now written by exactly one place.

  - id: D-CHOMP-024
    date: 2026-08-25
    title: The RemoteEvent folder is named RemoteEvents, never Remotes
    decision: >
      The folder of RemoteEvents declared in default.project.json is named
      RemoteEvents. The ModuleScript that resolves them keeps the name Remotes.
      No two children of ReplicatedStorage may share a name.
    rationale: >
      D-CHOMP-021 declared the events in a folder called Remotes, while
      src/ReplicatedStorage/Remotes.lua already syncs as a ModuleScript called
      Remotes. ReplicatedStorage therefore had two children with one name, and
      WaitForChild("Remotes") is free to return either. Inside Remotes.lua it
      returned the ModuleScript — itself — which has no children, so the wait
      for RequestPurchase ran the full 10 s timeout and errored, taking the
      network surface down on every client. InputController's require of the
      same ambiguous name could equally have resolved to the Folder and failed
      differently. The symptom was identical to the bug D-CHOMP-021 fixed, which
      is why it read as a regression rather than as a new fault in the fix.
    outcome: >
      default.project.json declares ReplicatedStorage.RemoteEvents; Remotes.lua
      resolves that name and says so in its error text. Verified against the
      built place: ReplicatedStorage has no duplicate child names.

  - id: D-CHOMP-025
    date: 2026-08-25
    title: The client owns the heading, the engine owns the transform
    decision: >
      VehicleController never writes HumanoidRootPart.CFrame. It integrates a
      heading angle from steering intent and hands that heading to
      humanoid:Move() as a direction vector. AutoRotate is true again, so the
      engine turns the character to face the direction it is given.
    rationale: >
      Instrumented in the first local playtest that got this far. Steering
      intent was reaching the mover correctly — smoothedSteer ramped to a full
      plus or minus 1.000 and turnRate read 240 — but the measured yaw of the
      root part never accumulated past about four degrees and MoveDirection
      stayed pinned to world north, so the vehicle drove into the boundary wall
      and could not turn away. The per-frame CFrame write in RenderStepped was
      being reverted by the physics solver on the following step, and the
      character being wedged in that wall made it worse, because the solver was
      resolving penetration every step as well. Grep confirmed VehicleController
      was the only writer of that CFrame, so this was not another two-authority
      bug: it was one authority writing a value the solver owns. Move() is a
      request the solver honours rather than a transform it has to reconcile,
      so expressing the same intent that way removes the fight entirely.
    outcome: >
      VehicleController holds `heading` in radians, seeded from the character on
      its first frame and reseeded on respawn, advanced by the same turn-rate
      and flip maths as before. It calls humanoid:Move with
      (-sin heading, 0, -cos heading), which is flat by construction so slopes
      still cannot steal speed. MovementService sets AutoRotate = true, and the
      comment there records why facing is still the vehicle's.

  - id: D-CHOMP-026
    date: 2026-08-25
    title: Hold to drive — the steering hold is the throttle
    decision: >
      The vehicle moves only while the player holds a steering input, and coasts
      to a stop over Braking when released. The same hold still steers. There is
      still no separate accelerator, no brake and no action button. Supersedes
      the always-forward half of D-CHOMP-015; the rest of that decision stands.
    rationale: >
      Owner decision after the first genuinely drivable build. Constant motion
      was specified on the Pac-Man argument and it reads well on paper, but
      playing it showed a vehicle that can never stop is tiring to hold, and
      that releasing is what a player instinctively does when they want a moment
      to look at the map. Gating movement on the steering hold keeps the two
      properties that made D-CHOMP-015 right — no second control to find, and
      nothing on screen to lose under a thumb — while making stopping possible.
      It also gives Acceleration and Braking in ChompConfig a job; they had been
      declared since the start and unused while speed was constant. Coasting
      rather than stopping dead means letting go mid-corner is a decision rather
      than a punishment.
    outcome: >
      InputController publishes state.driving, true whenever a steering key is
      held or a touch is active. VehicleController ramps currentSpeed toward the
      server's top speed by Acceleration, and toward zero by Braking, then scales
      the heading vector by that fraction — MoveDirection magnitude carries the
      throttle, so WalkSpeed remains the server's number and is never written by
      the client. control_scheme.md and BUILDING.md amended.

  - id: D-CHOMP-027
    date: 2026-08-25
    title: One floating stick — forward drives, left and right turn, back turns around
    decision: >
      Input is a single stick. Forward drives, left and right steer proportional
      to deflection, back reverses at ReverseSpeedFraction of top speed and the
      vehicle swings to face its travel direction. On touch the stick FLOATS: it
      anchors wherever the finger lands and reads displacement from that anchor.
      One finger drives; a second touch is ignored. Supersedes the always-forward
      rule of D-CHOMP-015 and the hold-to-drive scheme of D-CHOMP-026.
    rationale: >
      Owner decision after playing D-CHOMP-026, which gated movement on the
      steering hold. That scheme is unusable and the reason is structural rather
      than a matter of taste: if holding left or right is the only way to move,
      every path the vehicle can take is an arc, and driving straight down a
      corridor is impossible. In a maze that is fatal. It should not have shipped
      to a playtest — the flaw is visible from the design alone.
      A stick was rejected in D-CHOMP-015, but the objection recorded there was
      specific: a stick with a FIXED origin drifts, gets dropped mid-corner, and
      needs a visual to find. A floating stick has none of those properties,
      because it re-anchors on every touch. So the original reasoning is not
      being overturned so much as read precisely — what it ruled out was a puck
      at a fixed spot, not a throttle.
    outcome: >
      InputController rewritten around a floating stick with a dead zone
      rescaled so the rim is full deflection, publishing steer and throttle in
      -1..1. Keyboard is W/Up drive, S/Down reverse, A/D and arrows steer, with
      opposed keys cancelling on both axes. VehicleController ramps a signed
      currentSpeed by Acceleration away from zero and Braking toward it, then
      scales the heading vector by the resulting fraction. ChompConfig gains
      StickRadiusFraction, StickDeadZoneFraction and ReverseSpeedFraction.
      control_scheme.md and BUILDING.md rewritten to match.

  - id: D-CHOMP-028
    date: 2026-08-25
    title: Structural faults fail the build, not the playtest
    decision: >
      guard.py runs at build time against the built place and fails on two
      things: two children of one parent sharing a name, and a WaitForChild
      target that does not exist. Exit code 0 or 1, so it drops into a hook or
      a CI step. It is an L0 scan in verification_strategy.md.
    rationale: >
      The same fault shape has cost four playtests. D-CHOMP-021 left a module
      waiting forever on instances nothing created, which silently disabled all
      steering; D-CHOMP-024 gave a declared folder the same name as the module
      that reads it, so WaitForChild returned an object with no children. What
      makes this shape expensive is not that it is subtle but that it is
      disguised: a missing instance surfaces as an unrelated Infinite yield
      warning, or as a feature quietly not working, so a human playing the game
      is the worst available detector for it. Both faults are visible in the
      built place in under a second.
      Checking the BUILT PLACE rather than the source matters, because the place
      is what the game loads and it is where a project-file declaration and a
      synced file can collide. Reading only the source would have missed
      D-CHOMP-024 entirely, since neither half is wrong on its own.
    outcome: >
      guard.py added, verified in both directions: it passes the clean tree and
      fails a tree with the D-CHOMP-024 collision reintroduced, catching both
      the duplicate name and the three now-unreachable remotes — including the
      names reached through a for-in-ipairs loop over a string list, which is
      the exact D-CHOMP-021 pattern. Documented in BUILDING.md and listed as an
      L0 scan. No requirement or test case was added: the guard verifies that
      the build is internally consistent, which is a property of the artefact
      rather than a shall statement, and inventing a requirement to justify a
      tool would put a false trace in the tree.

  - id: D-CHOMP-029
    date: 2026-08-25
    title: The camera acceptance run reports on screen, because the device has no command bar
    decision: >
      A CameraReadout client script shows worst occlusion, the limit and the
      breach count at the top of the screen, red on failure, with a live HIDDEN
      indicator while the vehicle is occluded and a RESET button to re-run the
      circuit without rejoining. Gated on ChompConfig.Debug.CameraReadout.
      _G.ChompCameraReport() stays for Studio.
    rationale: >
      BUILDING.md told the tester to call _G.ChompCameraReport() from the command
      bar. That instruction was written by a session that could not test on a
      device and does not survive contact with one: an iPad has no command bar.
      The fallback, typing Lua into the /console overlay while holding a vehicle
      on a steering stick, is a juggling act rather than a procedure — and the
      camera warns on every breach, so the log is noisiest exactly when the
      numbers matter. CHOMP-TC-040 is the highest-risk item in the tree
      (RISK-CHOMP-012) and it has never once completed; a test that cannot report
      its own result on the platform it is about will keep not completing.
      The live HIDDEN indicator is deliberate. A total at the end says the camera
      failed; seeing the counter run while you are behind the tower core says
      what failed, which is the difference between a number to report and a thing
      to fix.
    outcome: >
      src/StarterPlayer/StarterPlayerScripts/CameraReadout.client.lua, reading
      _G.ChompCameraStats — a silent accessor added alongside the printing
      report, because polling the printing one five times a second would bury
      the breach warnings. Placed top centre, clear of the thumb zones the
      control scheme reserves. The RESET button is safe next to a touch stick
      because InputController drops touches whose gameProcessedEvent is true.
      BUILDING.md now carries the publish-and-play steps as well.

  - id: D-CHOMP-030
    date: 2026-08-25
    title: A generated arena to drive, distinct from the authored v1 map
    decision: >
      ArenaMap builds a full two-deck arena procedurally from ChompConfig.Map:
      a 32x32 braided maze, a raised 16x16 ring 2, four ramps, four bridges that
      end in air, and twelve garages. One 16x16 quadrant is generated and
      rotated four times, exactly as map_geometry.md's authoring rule requires.
      ChompConfig.Map.Layout selects it or the old TestMap.
    rationale: >
      BUILDING.md gates real map geometry on CHOMP-TC-040 passing, and it has
      not run. That gate exists so nobody spends a weekend hand-building against
      a camera that turns out not to work — so the reason is respected rather
      than the letter: this map is GENERATED from config, so a camera retune
      that moves WallHeight or DeckHeight regenerates it for free instead of
      invalidating anything. It is not the v1 map and must not be mistaken for
      it; the v1 map is hand-built by the child from the six prefabs, and that
      work stays gated.
      The maze is braided rather than perfect. A perfect maze has exactly one
      route between any two points, which is dull to drive and impossible to
      escape through, and this game is about outrunning things.
    outcome: >
      src/ServerScriptService/ChompEngine/ArenaMap.server.lua. Walls are
      rendered from an open-edge set, so a perimeter hole for a ramp or a bridge
      is just an added edge rather than a special case. Ramps and bridges are
      each defined once as a pair of quadrant cells and both ends rotated, so
      their direction falls out of the rotation instead of four hand-written
      cases. Reachability is flood-filled from spawn and warns rather than
      assumed, because a generated maze that seals a quadrant is a wasted
      playtest. TestMap is retained behind Layout = "Test".

  - id: D-CHOMP-031
    date: 2026-08-25
    title: The chassis is worn by the character, and is appearance only
    decision: >
      VehicleService builds the player's chassis from its Luau spec on spawn,
      welds it to HumanoidRootPart massless and non-colliding, and hides the
      avatar's own parts. Locomotion is untouched.
    rationale: >
      Four chassis existed and nothing consumed them, so every playtest so far
      was driven as a plain avatar. The temptation when bolting a vehicle onto a
      character is to give it physics — and this project has already lost two
      playtests to a second authority writing the same value (D-CHOMP-023,
      D-CHOMP-025). So the chassis is deliberately inert: massless, no
      collision, no queries, welded to a root part the client already steers.
    outcome: >
      src/ServerScriptService/ChompEngine/VehicleService.server.lua, reading
      ChompChassis off the character or falling back to StartingChassis.
      KNOWN LIMIT, recorded rather than hidden: collision is still the
      humanoid's, about two studs wide against a chassis nearer five. Corridors
      are eight, so it shows only when hugging a wall. Giving the vehicle a real
      collision body changes how the character is built and is not worth doing
      before CHOMP-TC-040 says the geometry survives at all.

  - id: D-CHOMP-032
    date: 2026-08-25
    title: First tuning pass after the first real drive — one deck, looser maze, softer steering
    decision: >
      The arena drops to a single deck and a smaller, more open grid:
      ArenaCells 20, ArenaDecks 1, ArenaBraidChance raised to 0.45. Ring 2,
      ramps and bridges are gated behind ArenaDecks = 2 rather than removed.
      Steering gains an asymmetric ramp: SteerRampSeconds raised from 0.12 to
      0.24 to engage, and a new SteerReleaseSeconds of 0.10 to straighten.
    rationale: >
      Owner decision after the first drive of the full arena, which is the first
      time anyone has driven this game with a map and a chassis. Two decks and a
      32x32 braided maze is too much to evaluate handling in: you cannot tell
      whether a corner feels wrong or you simply took the wrong one. Strip the
      variables until the driving is right, then put the decks back — which is
      why they are gated by a number rather than deleted.
      On steering: the reported feel was twitchy. On a keyboard the input is
      either zero or full lock, so the ramp is the only thing between a tap and
      a full-rate rotation. Making engagement slower alone would risk the
      opposite failure, because steering that has not engaged within one cell
      crossing cannot make a junction — about a third of a second at 8 studs
      and speed 24. So engagement softened only to 0.24 while release was made
      quicker at 0.10. The twitch people actually feel is usually the vehicle
      still turning after they let go, and that is a release problem, not an
      engagement one.
    outcome: >
      ChompConfig carries both numbers with the junction-timing constraint
      written next to them, so a future retune re-derives rather than guesses.
      VehicleController picks the rate by whether the deflection is growing.
      ArenaMap takes ArenaCells and ArenaDecks, and ring 2 sizing scales from
      the grid so switching back to two decks needs no other change.

  - id: D-CHOMP-033
    date: 2026-08-25
    title: Grid driving — a direction is the drive command
    decision: >
      The four directions are absolute and each one is both steering and
      throttle. Hold a direction and the vehicle goes that way: stopped it snaps
      to face it instantly, moving it turns at the chassis BaseTurn. Release and
      it coasts over Braking. There is no separate throttle, no reverse and no
      double-tap flip — a 180 is just the opposite direction. Supersedes the
      throttle-and-steering half of D-CHOMP-027; the floating touch anchor
      survives unchanged.
    rationale: >
      Owner decision after driving the arena. This is the fourth control scheme
      and the previous three each failed for a reason worth keeping on record:
      D-CHOMP-015 never stopped, so there was no way to pause and look;
      D-CHOMP-026 gated movement on steering, so every path was an arc and
      driving straight down a corridor was impossible; D-CHOMP-027 split
      direction from throttle, which drove well but made reorienting in a dead
      end a three-point turn and lining a corridor up before committing to it
      impossible.
      The through-line is that a maze on an 8-stud grid has four meaningful
      directions and analog steering pretends there are more. Once the request
      was "a press should snap the stopped vehicle to face that way", the
      throttle had nowhere sensible to live: on a keyboard W is simultaneously
      the forward direction and the only accelerator, so a naive snap left the
      vehicle able to travel north and south and nothing else. Making the
      direction the command removes the conflict rather than arbitrating it.
    outcome: >
      VehicleController holds a desired heading rather than a steering scalar;
      the most recent press wins, so rolling from one key to the next takes the
      corner instead of averaging into a diagonal no corridor accepts. Snapping
      applies below Movement.SnapBelowSpeed. InputController still publishes two
      axes and nothing more — what a direction MEANS is the controller's
      business — and the flip gesture is gone. The wire format is unchanged:
      the remote's Y is still the flip flag service_contracts.md specifies and
      is now always zero, so no contract amendment and no exploit-suite change.
      ReverseSpeedFraction and the ReverseFlip timings are now unused; they are
      left in ChompConfig rather than deleted because the combat design may
      still want a commitment-cost 180.

  - id: D-CHOMP-034
    date: 2026-08-25
    title: Corridor width is derived from turning radius, and the avatar is fully hidden
    decision: >
      The grid moves from 8 studs to 16. RampCells drops to 2 and GarageCells to
      2 so both keep their real sizes, and the arena drops to 16 cells across so
      the map stays about 256 studs. Separately, VehicleService now keeps the
      avatar hidden as parts arrive and disables the Animate script.
    rationale: >
      Owner report after driving: corners felt sharp and there was no room for
      the vehicle's sweeping turn. That is measurable rather than a matter of
      taste. Turning radius is BaseSpeed over BaseTurn in radians — 24 / 4.19,
      about 5.7 studs — and an 8-stud cell with 2-stud walls left 6 studs clear
      against a 4.8-stud vehicle. That is 0.6 studs either side, so there was
      physically no room to arc and every corner became a pivot in place. At 16
      the clear width is 14, leaving 4.6 studs either side, and the 5.7-stud
      sweep fits. Corridor width is therefore a derived number like wall height
      already is, not an art choice, and ChompConfig now says so next to it.
      On the avatar: hiding at spawn was not enough. Body parts, decals and
      accessories can arrive after CharacterAdded and after the appearance
      loads, and an invisible humanoid still runs its animation, so limbs were
      swinging inside a welded chassis.
    outcome: >
      ChompConfig carries the derivation beside CellSize so a change to
      BaseSpeed or BaseTurn re-derives it. map_geometry.md updated throughout —
      the numbers table, the six prefab sizes and the Studio snap increment,
      which all keyed off the 8-stud grid. VehicleService hides descendants as
      they appear, re-hides on CharacterAppearanceLoaded, excludes the vehicle
      model from that sweep, disables Animate and stops any playing tracks.

  - id: D-CHOMP-035
    date: 2026-08-25
    title: The driver's own avatar is hidden on the client, not just on the server
    decision: >
      A client script holds LocalTransparencyModifier at 1 on every avatar part
      of the local character, every frame, excluding the vehicle model. The
      server-side Transparency = 1 stays, because that is what other players
      see.
    rationale: >
      Setting Transparency on the server was not enough and the legs kept
      showing through the chassis for the driver. Roblox renders the local
      player's own character through LocalTransparencyModifier, and the default
      PlayerModule's transparency controller writes to it as the camera moves.
      D-CHOMP-023 disabled that module's CONTROLS, which is a different thing:
      the camera and transparency halves kept running.
      So this is the same shape of bug as D-CHOMP-023 and D-CHOMP-025 in a third
      register — two authorities writing one value, and whichever runs last
      wins. The fix is the same one that worked twice already: be the last
      writer every frame rather than trying to reason about somebody else's
      update schedule. Fifteen parts a frame costs nothing.
    outcome: >
      src/StarterPlayer/StarterPlayerScripts/VehicleAppearance.client.lua. It
      recollects on DescendantAdded because parts arrive late, and it clears the
      modifier on vehicle parts rather than merely skipping them — the vehicle
      is parented in after the character spawns, so an early sweep can catch it,
      and dropping a part from the list stops the writes without undoing the
      last one. That would have produced an invisible vehicle.

  - id: D-CHOMP-036
    date: 2026-08-25
    title: One exclusion predicate, used by every sweep that hides the avatar
    decision: >
      VehicleService has a single isVehicle(character, instance) predicate, and
      both the DescendantAdded handler and the CharacterAppearanceLoaded sweep
      go through it.
    rationale: >
      The vehicle disappeared along with the avatar. Two code paths hide avatar
      parts — one when a descendant arrives, one when the appearance finishes
      loading — and only the first excluded the vehicle. The appearance sweep
      called hideAll, which walked every descendant unconditionally, so if the
      appearance landed after the chassis was welded on it painted the chassis
      invisible too. The player then saw nothing at all, because the avatar was
      correctly hidden and the vehicle was incorrectly hidden.
      The lesson is not "add the check in the second place". It is that a rule
      copied into two call sites is a rule that will be enforced in one of them:
      the same shape as the duplicated-name bug in D-CHOMP-024 and the
      two-writer bugs in D-CHOMP-023, -025 and -035. Write the rule once.
    outcome: >
      isVehicle is defined once and both sweeps call it. Noted for whoever adds
      a third sweep: it goes through the same predicate.

  - id: D-CHOMP-037
    date: 2026-08-25
    title: A kart with a driver in it — scaled to the corridor, head visible through the glass
    decision: >
      The chassis spec is scaled by ChompConfig.Vehicle.Scale at build time, set
      to 1.5, and the driver's head is left visible so it shows through the glass
      canopy. Everything else about the avatar stays hidden.
    rationale: >
      Owner direction: bigger, proportional, Mario Kart. The scale is derived
      rather than eyeballed, from two constraints that happen to agree. The
      widest body part must leave the turning sweep room in a corridor — clear
      width has to exceed turning radius plus body width, 5.7 + 5.3k <= 14 —
      which caps k at about 1.55. And the canopy centre at 3.08k should land
      where an R15 head sits, 4.5 to 5.0 studs above the feet, which wants k
      near 1.5. So 1.5 gives a 7.95-stud kart with the glass centred at 4.62.
      On the head: Codex's spec was designed for this from the start and says so
      — the solid lower pod hides the legs and arms while the glass is only the
      upper half. VehicleService was hiding the whole avatar and defeating it,
      so the kart read as an empty shell. A visible driver is most of what makes
      a kart look like a kart.
    outcome: >
      The SPEC is scaled, not the built model: scaling afterwards would resize
      parts VehicleFactory has already welded, and a weld holds the offset it was
      made with, so the kart would come apart. Sizes and offsets scale, rotations
      do not. Both the server sweep and the client modifier pass exclude the
      head, because disagreeing there is exactly the split D-CHOMP-035 was about.
      Codex's spec file is untouched.

  - id: D-CHOMP-038
    date: 2026-08-25
    title: A cosmetic script may not make the player disappear
    decision: >
      VehicleAppearance hides the avatar only while a Vehicle is actually
      attached to the character. With no kart it clears the modifier and leaves
      the driver visible. VehicleBounds is re-derived for the 16-stud grid at
      8.3 x 7 x 10, and Vehicle.Scale corrected from 1.5 to 1.4.
    rationale: >
      Reported twice as "the avatar and vehicle are not showing". Two faults
      stacked, and only the second one mattered.
      The kart stopped building: VehicleBounds was 6 x 6 x 8, set when corridors
      were 8 studs wide, so a kart scaled for a 16-stud corridor breached the
      contract and assertContract threw. The contract was rejecting a vehicle
      that was the correct size for the map — the bound had gone stale the
      moment the grid widened in D-CHOMP-034, and nothing connected the two.
      The scale itself was also wrong. 1.5 came from the widest BODY part, 5.3,
      but the kart's true width is 5.84 because the hover wheels stand proud of
      the shell. Measuring a part instead of the bounding box put it over both
      the contract and the turning sweep. The sweep caps scale at 1.416, so 1.4.
      The fault that actually produced an empty world was neither of those.
      VehicleAppearance hid every avatar part on spawn without ever checking
      whether a vehicle existed, so ANY build failure gave no kart and an
      invisible driver standing in it. That is why the symptom looked identical
      before and after D-CHOMP-036, and why fixing the hiding logic there
      changed nothing: the failure was upstream and the client hid the evidence.
    outcome: >
      The client checks for the Vehicle before hiding anything, so a failed
      build now degrades to a plain visible avatar and a warning, which is a
      diagnosable state rather than an empty one. Bounds and scale are both
      derived from the corridor with the arithmetic written beside them.
      The general rule this is the third instance of: a number derived from
      another number must say so where it lives, or it goes stale silently when
      the other one moves.

  - id: D-CHOMP-039
    date: 2026-08-25
    title: The driver reads through clearer glass and a bigger head
    decision: >
      After the kart is built, the Canopy part's transparency is raised from the
      spec's 0.62 to ChompConfig.Vehicle.CanopyTransparency (0.85), and the
      character's R15 HeadScale is set to Vehicle.DriverHeadScale (1.4).
    rationale: >
      The head was visible but not reading. Two causes, and only one of them was
      the glass. At 0.62 the canopy is convincing as glass and poor as a window;
      0.85 keeps the highlight and the frame while letting a face through.
      The other is size. A kart driver reads as a driver mostly through head
      size — it is why every kart game gives its drivers oversized heads — and a
      default R15 head inside a 4.3-stud-wide cockpit is simply small.
      HeadScale was chosen over resizing the Head part because it scales the
      head alone and leaves HipHeight, and therefore the chassis drop, untouched.
      1.4 rather than 1.5: the canopy roof sits at 5.96 studs and a 1.5 head tops
      out at 5.90, which is not a margin when R15 head heights vary by avatar.
      1.4 clears by 0.12. Above about 1.5 the head pushes through the glass.
    outcome: >
      Both values are config, applied after build, so Codex's spec stays the
      source of truth for shape and only the glass is tuned here. R6 characters
      have no HeadScale value and skip that step rather than erroring.

  - id: D-CHOMP-040
    date: 2026-08-25
    title: Hair and hats stay on, and accessories are never destroyed
    decision: >
      Head accessories — identified by HairAttachment, HatAttachment,
      FaceFrontAttachment or FaceCenterAttachment on their Handle — stay visible
      with the head. No accessory is destroyed; non-head ones have their Handle
      hidden like any other part.
    rationale: >
      Studio logged "Something unexpectedly tried to set the parent of Pal Hair
      to NULL". That was this code destroying accessories while the character
      was still assembling itself. Two things wrong with it. Destroying is a
      race against whatever else is still parenting parts, and it is
      irreversible — an appearance is player data, and a cosmetic script has no
      business deleting it.
      It was also self-defeating. The complaint being worked on was that the
      driver did not read, and hair is most of what makes a head look like a
      person rather than a sphere.
      Attachment names identify head gear rather than accessory names, because
      the name is player-chosen — "Pal Hair" is not a pattern anything can match
      on — while the attachment is how Roblox itself decides where it goes.
    outcome: >
      Both the server sweep and the client modifier pass share the same
      isHeadGear test. Accessory handles that are not head gear get
      Transparency = 1 like any other part, so nothing is deleted and the effect
      is reversible.

  - id: D-CHOMP-041
    date: 2026-08-25
    title: Level 1 is a bowl arena with a committed guardian chamber
    decision: >
      Level 1 uses four outer spawn quadrants, an easy rim maze, a broad slope
      into an open high-reward central combat bowl, and a guardian chamber
      adjacent to the maze on the route to Level 2. The guardian and its Threat
      are visible before a marked commitment boundary. Crossing under-powered
      triggers an immediate guardian chomp, 50% carried-point scatter and the
      normal <=4 second garage respawn. Crossing at sufficient Power begins a
      directional fight; head-on attacks clang and side/rear attacks progress
      the defeat. The Level 2 unlock is personal to the successful challenger.
    rationale: >
      The bowl makes safety and reward readable as geography: learn and bank at
      the rim, take risks toward the centre. Moving the guardian into a side
      chamber turns progression into a conscious challenge rather than a door
      collision. Power grants permission to attempt the next level, while the
      fight proves the player learned the mouth/front/flank rule. A visible
      warning preserves fairness when the owner deliberately allows an
      under-powered player to enter and be killed.
    outcome: >
      Supersedes the v1 behaviour in which an under-powered gate merely ejected
      the player and sufficient Power consumed the guardian on contact for a
      60-second global opening. CHOMP-SYS-022 through -025 and CHOMP-TC-024/-025
      are amended on the HUD/gameplay requirements branch. Cooperative entry,
      interference by other players and Full Jaw interaction remain explicit
      open decisions before implementation.

  - id: D-CHOMP-042
    date: 2026-08-25
    title: Continuous steering, because a bowl has no cardinal directions
    decision: >
      Steering is proportional again: hold forward to drive, steer left and
      right by amount, pull back to reverse. Supersedes the grid driving of
      D-CHOMP-033. The asymmetric steer ramp from D-CHOMP-032 is kept.
    rationale: >
      Owner decision, and unlike the previous four control changes this one is
      forced by the design rather than by feel. Level 1 is a bowl with a rim
      (D-CHOMP-041) and a curve has no cardinal directions to snap to — grid
      driving cannot follow a bend, it can only chord across it in four-step
      approximations. Weapons settle the remainder: a cannon that fires along
      the heading needs a heading finer than four steps, or aiming is a
      quarter-turn lottery.
      Grid driving was the right answer to the question it was asked. The
      question changed.
    outcome: >
      VehicleController holds a heading and a smoothed steer scalar again, with
      the signed throttle and coast behaviour intact. It still never writes a
      transform. InputController was not touched — it always published two axes
      and left the meaning to the controller, which is why this reversal cost
      one file. _G.ChompHeading is exposed for weapons to aim along.

  - id: D-CHOMP-043
    date: 2026-08-25
    title: Every wall must carry a fade tag, or the camera calls it a breach
    decision: >
      ArenaMap tags every generated wall Chomp_Wall, the tag the camera fades.
    rationale: >
      The camera reported a 0.92s occlusion against a 0.20s ceiling and looked
      like the project's highest risk materialising. It was not. isFadeable only
      fades parts carrying Chomp_Wall, Chomp_Decor or Chomp_Link, and treats
      anything else between camera and vehicle as a hard occluder — correctly,
      since a ghost or a gate must never be faded away. TestMap tagged its walls
      inside its wall() helper. ArenaMap tagged ramps, bridges and garages and
      never tagged a wall, so every wall in the arena was a hard occluder.
      The camera was doing exactly what it was told. A generated map that omits
      a tag the camera depends on is a map bug wearing a camera's clothes, and
      it would have been tuned for hours before anyone read isFadeable.
    outcome: >
      Tagging happens in renderWalls, so it cannot be forgotten per wall. The
      reason is written above the function rather than left as a bare AddTag,
      because the failure it prevents appears nowhere near the cause.
      CHOMP-TC-040 still has not run; this removes a false signal rather than
      producing a real one.

  - id: D-CHOMP-044
    date: 2026-08-25
    title: Level 1 is built as a bowl, and the geometry is curved throughout
    decision: >
      BowlMap builds Level 1 from ChompConfig.Level1: a raised rim carrying a
      three-ring maze, four broad slopes into an open central bowl, a guardian
      chamber off the rim behind a visible commitment boundary, and four garages
      on the outer rim. ChompConfig.Map.Layout selects it; ArenaMap and TestMap
      remain behind their own values.
    rationale: >
      Implements D-CHOMP-041. Two things made the curve non-negotiable rather
      than stylistic. Continuous steering (D-CHOMP-042) leans into a bend, and
      the rectilinear arena punished that by putting a flat wall and a square
      corner at the end of every corridor — the reported symptom was catching on
      walls, and the cause was that there was nothing to hold a line around.
      And the design already wanted it: rim for safety, centre for reward, is
      only legible as geography if the geography is concentric.
      Arcs are drawn as chords, which is the whole trade in one number. At
      SegmentStuds = 8 the three rings alone are about 470 parts. Rounder costs
      parts, and parts are the iPad's budget.
    outcome: >
      Rim band is 80 studs, five corridors wide. Slopes fall 10 studs over 48,
      about 12 degrees, and are two corridors wide so they read as an invitation
      rather than a chute. Ring gaps are offset ring to ring so no radial line
      is a free run from the outer wall to the bowl, and short radial spokes stop
      a ring becoming a racetrack. The commitment boundary is deliberately not
      collidable: crossing under-powered must be possible and fatal, not blocked.

  - id: D-CHOMP-045
    date: 2026-08-25
    title: One slot, four items, and a fourth remote that carries nothing
    decision: >
      Items lie on pads around Level 1 and a driver carries exactly one: a
      JetPack hop, a three-shot Cannon, a single slower HomingBomb, or a Shield
      that absorbs one hit. Collecting replaces what you held. A fourth remote,
      UseItem, carries NO arguments; the server owns the item, the charges, the
      aim, the hit and the outcome. Firing is Space on a keyboard and a short
      tap on touch.
    rationale: >
      Owner direction. One slot because a pickup should be a single judgement -
      is this better than what I am holding - rather than inventory management;
      a seven-year-old at 24 studs per second cannot open a bag, and a
      confirmation prompt at that speed is a crash.
      The four differ in kind rather than degree: mobility, volume, accuracy,
      defence. The homing bomb is deliberately SLOWER than the cannon, because a
      fast steering projectile is not a weapon but a guaranteed hit, and nothing
      you cannot dodge is worth carrying a shield to survive.
      On the remote: service_contracts.md says a fourth means extending the
      exploit suite in the same commit, and that is what happened - CHOMP-TC-042
      gains five item attacks. UseItem takes no arguments at all, so there is
      nothing in the message to forge: not the item, not the charge count, not
      the aim, not the hit. The direction a shot travels is read from the
      character transform the SERVER wrote, never from the client.
      Tap-to-fire keeps the no-buttons promise (D-CHOMP-027). A touch that ends
      inside 0.22s having moved under 14 pixels was never a steering input, so
      it can mean "use what I am holding" without adding a control. Peak travel
      is used rather than final travel, so a flick out and back reads as
      steering rather than as a tap.
    outcome: >
      ItemService owns pads, carrying, charges, projectiles and hits. Charges
      publish to the character as attributes, which the HUD reads and no client
      can write. Pads hide and return rather than being destroyed and rebuilt,
      so the map restocks without anything having to remember where pads were.
      Better items sit closer to the centre, which is what makes the bowl worth
      the risk it already represents.
      Cannon and bomb currently have nothing to shoot: there are no ghosts and
      usually one player. They fire, travel, steer, expire and are hit-tested
      against other players correctly. That is honest rather than finished.

  - id: D-CHOMP-046
    date: 2026-08-25
    title: Level 1 is one sealed level, twice the size, and lit
    decision: >
      Level 1 is a single-level disc 800 studs across with an unbroken boundary
      wall. Seven concentric rings with offset gaps and short spokes, an open
      arena in the middle, garages on the outer band, and the guardian chamber
      carved INTO the outer band rather than hung off the edge. Walls alternate
      NEON and BRICK ring by ring. Colours come from ChompConfig.Palette.
      Supersedes the two-level bowl of D-CHOMP-044.
    rationale: >
      Owner direction and three separate reasons agreeing. A drop between decks
      is a way to fall out of the map, and the bowl had one; a sealed disc has
      nowhere to fall. The arena was too small to build speed in, so it doubled.
      And alternating materials is navigation rather than decoration: at speed a
      driver needs to know which ring they are on without counting, and "the
      pink neon one" is a landmark where "the third identical corridor" is not.
      Anything outside the boundary is an escape, which is why the guardian
      chamber moved inside it. That was a real bug in D-CHOMP-044, not a
      preference.
    outcome: >
      Level1Map replaces BowlMap, which is deleted. About 820 parts: 604 ring
      segments, 180 boundary, 30 spokes. Corridors are 38 studs clear, 2.4 cells,
      which is generous for a sweeping turn. The palette is one table, so
      recolouring the whole game is one edit.

  - id: D-CHOMP-047
    date: 2026-08-25
    title: An item looks like what it does
    decision: >
      Each item is a built model whose silhouette states its capability: the
      JetPack is thrusters and flame, the Cannon a barrel on a mount, the
      HomingBomb a finned body with a seeker eye, the Shield a ring around a
      core. Pads spin and bob.
    rationale: >
      Owner direction, and correct. Four glowing balls in four colours is a
      memory test, not a game: a child at 24 studs per second reads SHAPE long
      before hue, and colour alone also fails anyone colour-blind — which is the
      same objection CHOMP-SYS-056 already makes about the HUD.
      Spinning matters more than it sounds. A static prop reads as scenery; a
      moving one reads as a thing you are meant to drive into.
    outcome: >
      buildItemModel in ItemService. Pads are Models rather than parts, so
      collection tests the pivot and hiding walks the descendants.

  - id: D-CHOMP-048
    date: 2026-08-25
    title: Carried is risky, banked is safe, and banking has no button
    decision: >
      Pellets lie along every ring lane, worth more the closer to the middle,
      with power pellets in the open centre. Eating adds to ChompCarried.
      Driving onto a garage pad converts the whole carry to ChompDollars. Both
      are attributes the server writes and the HUD only reads.
    rationale: >
      This is the economy CHOMP-SYS-005 describes, and the split is the game: a
      ghost can take what you carry and can never touch what you banked, so
      driving home with a full load is the tensest thing available.
      Value rising toward the middle is not arbitrary. The centre is open, has
      nothing to hide behind and is where ghosts converge, so it has to pay for
      the exposure it costs.
      Banking has no button, no prompt and no confirmation: it is a consequence
      of driving somewhere, which is the one principle of D-CHOMP-015 that every
      control scheme since has kept.
    outcome: >
      PelletService. Carried points do not survive death; dollars persist on the
      player. Collection and banking share one 0.1s loop because both are "am I
      near a thing".

  - id: D-CHOMP-049
    date: 2026-08-25
    title: Ghosts are point thieves, and are frightening without being fast
    decision: >
      Ghosts hunt the nearest kart within 260 studs and take StealFraction of
      carried points on contact, never touching banked dollars. They are slower
      than a Standard chassis. Eyes track the nearest kart, the hem ripples, and
      the bobbing STOPS as one closes in.
    rationale: >
      Scary is a design requirement here, and speed is the wrong lever for it —
      a ghost that outruns you is a tax you cannot play against, while one that
      only catches the careless is a threat. Ghosts.Speed is 21 against a kart's
      24, deliberately.
      What does the work instead: they are always looking at you, they never
      stop coming, and they go still as they arrive. Stillness reads as intent,
      and intent is frightening in a way that speed is not.
      They are never tagged fadeable. The camera fades walls so you can see your
      kart; fading the thing hunting you would be actively hostile.
    outcome: >
      GhostService. Ghosts are anchored puppets posed each frame rather than
      physical bodies, because nothing about them needs to be simulated. With no
      kart in range they drift a ring, so the map looks inhabited rather than
      empty until something notices you.

  - id: D-CHOMP-050
    date: 2026-08-25
    title: The HUD answers one question per corner
    decision: >
      Carried at top-left in pink, banked at top-right in gold, one contextual
      objective at top-centre, held item and charges under the carry. The bottom
      edge and both lower corners stay empty. Every value is read from a
      server-written attribute.
    rationale: >
      Implements CHOMP-SYS-055 and -056 to Codex's zones. Carried and banked are
      never the same colour, size or corner, because "is that safe?" has to be
      answerable without reading a word.
      One objective, not a list, and it is chosen by urgency: carrying a lot
      outranks everything, since the thing most likely to be lost is the thing
      worth being told about.
      A theft flashes the screen. The number changing is not enough when your
      eyes are on a corridor, which is exactly what CHOMP-SYS-056 means by
      feedback that explains itself.
    outcome: >
      ChompHud reads attributes only and can decide nothing. CHOMP-TC-045 is the
      child-facing demonstration and has not been run; this is the thing to run
      it against.

  - id: D-CHOMP-051
    date: 2026-08-25
    title: Ghosts can hurt you and can be killed, and the kart shows what it is carrying
    decision: >
      Ghost contact now deals ContactDamage as well as stealing carried points,
      on a cooldown. Ghosts have Health, take a hit from a cannon shot, die
      outright to the homing bomb, vanish and return after RespawnSeconds. An
      active shield absorbs the contact and throws the ghost clear instead.
      Running out of health is an ordinary Roblox death and respawn.
      Visually: the held item is mounted on the kart roof, the shield is a
      shimmering ring of light around it, the driver's name floats above, and
      wheels are scaled 1.45 on top of the vehicle scale.
    rationale: >
      Owner direction, and it closes the loop the weapons were missing: before
      this, the cannon and the bomb had nothing to shoot, so carrying one was a
      promise the game never kept.
      Damage is small and cooled down rather than lethal per touch. The danger
      being modelled is being worn down while greedy — the same shape as the
      carried-points risk — not being deleted by one mistake, which would make
      the middle of the map simply not worth entering.
      Ghosts respawn because they are a pressure, not a population to
      exterminate. A player who could clear the map would have removed the
      reason to bank.
      The mounted item matters more than it sounds. A cannon visible on the roof
      tells everyone in the arena what you can do to them, which is most of what
      makes carrying one feel like something; the same information in a HUD
      corner is private and therefore inert.
    outcome: >
      GhostService owns health, death and respawn; ItemService's projectiles
      test against the Chomp_Ghost tag before testing against players.
      ShieldEffect draws the ring on the CLIENT from the server's
      ChompShieldUntil, because a shield that looks up while the server thinks
      otherwise would be a lie. Shimmer is three effects out of phase - rotation,
      a wave running round the ring, and a slow rise and fall - since any one
      alone reads as a spinning prop.
      WheelScale multiplies wheel SIZE only. Scaling the offset too would push
      the wheels out of the arches and off the chassis.
      The HUD gains a health bar whose colour carries the reading, and two
      distinct flashes: pink for a theft, red for damage.

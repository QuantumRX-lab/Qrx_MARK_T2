open_questions:
  - "Name. 'Chomp Arena' is a placeholder - the daughter names it."
  - "Triangle counts on vehicle models are declared by the designer, not
     measured - Luau cannot read them. Confirm in the mesh tooling."
  - "The control scheme is decided as of D-CHOMP-042 (proportional steering),
     which supersedes the grid driving of D-CHOMP-033. Touch now also takes a
     second finger to hold fire. None of it has been played on a device."
  - "Should reversing mirror the steering axis? It currently does not, so
     holding back and left swings the nose the same way it would going
     forward. That reads as turn-around rather than as reversing a car, and
     nobody has felt it on a device."
  - "Handling numbers - speed, turn rate, acceleration, braking, reverse
     fraction - are all first guesses. Tuning is deliberately deferred to the
     game-mechanics phase rather than done blind now."
  - "Thirty-three commits between 2026-08-26 and -27 carry no decision record.
     Reconstruct them, or record the gap as permanent? Reconstructing from
     diffs risks inventing rationale nobody held at the time, which is worse
     than an honest hole."


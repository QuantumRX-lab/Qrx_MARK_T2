# Chomp Arena — status dashboard
#
# Hand-maintained rollup, checked on every run of validate.py against the
# atomic records. If a number here disagrees with the requirements, test
# cases, risks or decisions, the validator fails — the number is never taken
# on trust. This is the failure mode that motivated the sibling tree's
# validator (D-INFRA-009): atomic records stay accurate, handwritten totals
# drift.

as_of: 2026-08-29
build_status: IN_PROGRESS
note: >
  Release v0.3.9-alpha is the current rebuilt baseline. It contains the sealed
  Level 1 arena, garage and deployment flow, persistent progression, vehicle and
  upgrade plinths, ghost waves, the five-slot weapon belt, cannon, bomb, shield
  and jet pack, guardian chamber and fight, guardian exit zone, charge jump,
  HUD, lighting and audio. Eight implementation chains are IN_PROGRESS;
  CHAIN-MATCH and CHAIN-KIT remain NOT_STARTED.

  The atomic requirements, decisions and chain logs now cover the major systems
  added during the rapid prototype. Integration ownership is assigned to Codex
  across all ten chains so baseline reconciliation has one accountable owner.
  Delivery is not verification: 18 requirements have delivered evidence while
  their verification_status remains NOT_STARTED. No status is promoted until
  the corresponding Studio, device or automated test evidence is recorded.

  The repository and generated place are clean at v0.3.9-alpha. validate.py and
  guard.py pass; validate.py intentionally warns about the 18 delivered but
  unverified requirements.


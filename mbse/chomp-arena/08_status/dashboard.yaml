# Chomp Arena — status dashboard
#
# Hand-maintained rollup, checked on every run of validate.py against the
# atomic records. If a number here disagrees with the requirements, test
# cases, risks or decisions, the validator fails — the number is never taken
# on trust. This is the failure mode that motivated the sibling tree's
# validator (D-INFRA-009): atomic records stay accurate, handwritten totals
# drift.

as_of: 2026-08-25
build_status: IN_PROGRESS
note: >
  Step 1 of the v1 order — camera and driving — is now DRIVABLE in Studio, and
  that is the first time anyone has been able to say so. Getting there took four
  fixes in one local session: the default control script was never disabled and
  was fighting the mover (D-CHOMP-023); a declared RemoteEvents folder collided
  by name with the Remotes module and made the network surface unreachable
  (D-CHOMP-024); per-frame CFrame writes were being reverted by the physics
  solver so the vehicle could not turn at all (D-CHOMP-025); and the control
  scheme went through two rejected shapes before settling on a floating stick
  (D-CHOMP-026 then -026).

  Requirement verification_status values stay NOT_STARTED regardless. Driving
  well enough for its author to say "best test so far" is not CHOMP-TC-040, it
  is not on the iPad, and it is not the seven-year-old. Code existing — even
  code that plays — is not the same as a requirement being verified, and this
  tree does not get to pretend otherwise. Handling tuning is deferred to the
  game-mechanics work by owner decision.


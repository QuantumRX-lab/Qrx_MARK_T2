  - "The static load-order guard is built and passing (guard.py, D-CHOMP-028).
     The Luau unit specs over ChompLogic are NOT — Impact and Progression were
     written as pure functions precisely so they could be tested, and nothing
     tests them yet."
  - "Then step 2 of the v1 order: drive and eat. Do not start combat until

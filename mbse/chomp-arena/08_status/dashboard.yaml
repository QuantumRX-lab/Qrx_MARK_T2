# Chomp Arena — status dashboard
#
# Hand-maintained rollup, checked on every run of validate.py against the
# atomic records. If a number here disagrees with the requirements, test
# cases, risks or decisions, the validator fails — the number is never taken
# on trust. This is the failure mode that motivated the sibling tree's
# validator (D-INFRA-009): atomic records stay accurate, handwritten totals
# drift.

as_of: 2026-08-27
build_status: IN_PROGRESS
note: >
  The game is publishable and the tree is behind it. Both halves of that
  sentence matter.

  Built and playable since this dashboard last spoke: the sealed single-level
  Level 1 disc, ghost waves with a speed cap and lobby scaling, the five-slot
  item belt, cannon and bomb and shield and jet pack, the plinth shop selling
  chassis, upgrades and weapons, garage sanctuaries, the charge jump, a seven
  track upgrade ladder with module ports, versioned DataStore persistence, a
  managed lighting rig, an audio director, and a launch bay with a deployment
  gate. Roughly seventy commits.

  Written down: almost none of it. Between 2026-08-26 and -27 thirty-three
  commits landed carrying one decision and two chain entries between them. The
  tree did not fail a check while that happened, because every check asks
  whether the records agree with each other and none asked whether they agree
  with the game. Two now do (D-CHOMP-067): this date is enforced against the
  newest record anywhere, and a requirement a chain calls DELIVERED while still
  reading NOT_STARTED raises a warning on every run.

  Requirement verification_status values stay NOT_STARTED, and that is still
  honest rather than lazy: nothing has been verified. CHOMP-TC-040 has never
  run, no Luau spec exists, and the seven-year-old has not held the iPad. Code
  that plays is not a requirement that passed, and this tree does not get to
  pretend otherwise. The fourteen requirements the new warning names are the
  backlog that statement creates, not a bug in it.


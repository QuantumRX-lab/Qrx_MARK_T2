open_questions:
  - "Name. 'Chomp Arena' is a placeholder — the daughter names it."
  - "Nine of the ten chains are unassigned; only CHAIN-VEHICLE has an owner (Codex)."
  - "Triangle counts on vehicle models are declared by the designer, not
     measured — Luau cannot read them. Confirm in the mesh tooling."
  - "Camera and map geometry are decided (D-CHOMP-016, -017); wall height is
     fixed at 7 studs, derived from the camera angle. The control scheme is
     decided as of D-CHOMP-027 but has only ever been played on a keyboard."
  - "Should reversing mirror the steering axis? It currently does not, so
     holding back and left swings the nose the same way it would going
     forward. That reads as turn-around rather than as reversing a car, and
     nobody has felt it on a device."
  - "Handling numbers — speed, turn rate, acceleration, braking, reverse
     fraction — are all first guesses. Tuning is deliberately deferred to the
     game-mechanics phase rather than done blind now."

next_actions:
  - "CHOMP-TC-040 on the iPad, which is now unblocked because the vehicle
     drives. Drive both decks, under the bridge and around the tower, then call
     _G.ChompCameraReport() from the Command Bar with the context set to Client.
     Any breach of the 0.2 s occlusion ceiling is a failure and blocks real map
     building. Two breaches of exactly 0.20 s were already observed in Studio on
     a trivial map, so expect this to fail and budget for redesigning the camera
     rather than tuning it."
  - "Exercise the touch stick on the same device trip. Studio only ever tested
     the keyboard path, so the floating anchor, the ignored second finger, the
     dead-zone rescale and whether reverse should mirror the steering axis are
     all unplayed. The on-screen camera readout (D-CHOMP-029) means one trip
     answers both this and CHOMP-TC-040."
  - "Run the vehicle conformance scan in Edit mode and record the result in

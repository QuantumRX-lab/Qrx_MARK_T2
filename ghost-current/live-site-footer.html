<!--
  Ghost site-wide footer code injection (NOT a page — loads on every
  page via Ghost's Code Injection > Site Footer setting).
  Pasted 2026-07-06 for reference during the widget-pages-to-Vercel move.

  Three pieces bundled in this one field:
  1. Form interceptor — diverts raw newsletter forms into Ghost's
     built-in Portal signup popup (#/portal/signup).
  2. Corporate footer cleanup — hides Ghost's default CTA/signup
     footer blocks, injects a custom icon + company-details footer.
  3. AI discovery layer — Organization JSON-LD schema + an
     ai-agent-index meta tag aimed at LLM crawlers/indexers.

  All three are tied to Ghost's own DOM structure (.gh-footer-signup,
  .gh-cta, .site-footer, .gh-foot, etc.) and Ghost's Portal signup
  system — none of this is portable to a standalone Vercel page as-is.
-->
<!-- INTERCEPTOR SCRIPT: Diverts raw forms into the Full Name + Email Portal Popup -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const targetForms = document.querySelectorAll('.gh-header-inner form, .gh-form, footer form, .gh-footer-signup form');
    targetForms.forEach(function(form) {
        const inputs = form.querySelectorAll('input');
        inputs.forEach(input => {
            input.setAttribute('readonly', 'true');
            input.setAttribute('placeholder', 'Click here to subscribe...');
        });
        const openPortal = function(e) {
            e.preventDefault();
            e.stopPropagation();
            window.location.hash = '#/portal/signup';
        };
        form.addEventListener('click', openPortal);
        form.addEventListener('submit', openPortal);
    });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const possibleFooters = document.querySelectorAll('.site-footer, .gh-foot, .gh-footer, footer');
    const mainFooter = possibleFooters[possibleFooters.length - 1];
    if (mainFooter) {
        const innerContainer = mainFooter.querySelector('.gh-foot-inner, .site-footer-inner, div') || mainFooter;
        Array.from(innerContainer.children).forEach(child => { child.style.display = 'none'; });
        innerContainer.style.display = 'flex';
        innerContainer.style.justifyContent = 'space-between';
        innerContainer.style.alignItems = 'center';
        innerContainer.style.width = '100%';
        const iconBlock = document.createElement('div');
        iconBlock.className = 'qrx-footer-icon';
        const iconUrl = document.querySelector('link[rel="icon"]')?.href || '/favicon.png';
        iconBlock.innerHTML = `<img src="${iconUrl}" alt="QuantumRX Icon">`;
        const detailsBlock = document.createElement('div');
        detailsBlock.className = 'qrx-company-details';
        detailsBlock.innerHTML = `
            <strong>QuantumRX Ltd.</strong><br>
            71-75 Shelton Street, Covent Garden<br>
            London, WC2H 9JQ, United Kingdom<br>
            <a href="mailto:info@quantumrx.eu">info@quantumrx.eu</a><br>
            <a href="https://www.quantumrx.eu/terms-conditions/">Terms &amp; Conditions</a>
        `;
        innerContainer.appendChild(iconBlock);
        innerContainer.appendChild(detailsBlock);
    }
});
</script>

.qrx-sa .qrx-slide-label { font-family: Georgia, 'Times New Roman', serif; font-size: 0.9rem; font-weight: 700; font-style: italic; letter-spacing: 0.01em; text-transform: uppercase; color: #1a1a1a; margin-bottom: 6px; display: block; border-bottom: 1px solid #1a1a1a; padding-bottom: 4px; }
.qrx-sa .qrx-slide-part:last-child .qrx-slide-label { border-bottom: none; padding-bottom: 0; color: #5a5040; }
.qrx-sa .qrx-slide-text { font-family: Georgia, 'Times New Roman', serif; font-size: 1.15rem; line-height: 1.72; color: #1a1a1a; }
.qrx-sa .qrx-slide-text.dim { color: #5a5040; }
.qrx-sa .qrx-slide-sources { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.qrx-sa .qrx-slide-sources .qrx-slide-link { margin-top: 0; }
.qrx-sa .qrx-slide-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-family: var(--sa-font); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1a1a1a; background: transparent; border: 1.5px solid #1a1a1a; padding: 6px 13px; border-radius: 3px; text-decoration: none; cursor: pointer; transition: all 0.15s; }
.qrx-sa .qrx-slide-link:hover { background: #1a1a1a; color: #f7f4ed; }
.qrx-sa .qrx-slide-link::after { content: "→"; }
.qrx-sa .qrx-slide-source { display: flex; align-items: center; gap: 4px; margin-bottom: 18px; font-family: var(--sa-font); font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; color: #8a7f6a; }
.qrx-sa .qrx-slide-source-name { font-weight: 700; color: #5a5040; }
.qrx-sa .qrx-slide-source-link { color: #8a7f6a; text-decoration: none; border-bottom: 1px solid rgba(90,80,64,0.3); transition: color 0.15s; }
.qrx-sa .qrx-slide-source-link:hover { color: #1a1a1a; border-color: #1a1a1a; }
.qrx-sa .qrx-slide-hottake { margin-top: 18px; padding-top: 16px; border-top: 2px dashed rgba(138,58,42,0.35); }
.qrx-sa .qrx-slide-hottake .qrx-slide-label { color: #8a3a2a; border-bottom-color: #8a3a2a; }
.qrx-sa .qrx-slide-hottake .qrx-slide-text { font-style: italic; color: #6b2e20; }
.qrx-sa .qrx-slide-thinking { font-family: Georgia, 'Times New Roman', serif; font-style: italic; color: #8a7f6a; font-size: 0.95rem; }
.qrx-sa .qrx-slide-verdict-wrap { margin-top: 14px; padding-top: 14px; border-top: 2px solid #1a1a1a; }
.qrx-sa .qrx-slide-verdict-wrap .qrx-slide-label { color: #1a1a1a; }
.qrx-sa .qrx-slide-verdict-wrap .qrx-slide-text { font-weight: 700; }
.qrx-sa .qrx-briefing-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: #8a7f6a; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 0.95rem; }
</style>

<div class="qrx-sa">

<div class="qrx-toggle-wrap" id="qrx-toggle">
  <div class="text-ring">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <defs><path id="qrxsa-cp" d="M 60,60 m -46,0 a 46,46 0 1,1 92,0 a 46,46 0 1,1 -92,0"/></defs>
      <text font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700" letter-spacing="3.2" fill="rgba(220,220,225,0.9)">
        <textPath href="#qrxsa-cp">QRx SIGNAL ANALYST &middot; QRx SIGNAL ANALYST &middot;</textPath>
      </text>
    </svg>
  </div>
  <div class="qrx-glow-ring"></div>
  <button id="qrx-btn" aria-label="Open Signal Analyst">
    <div class="atom"><div class="atom-core"></div><div class="atom-ring r1"></div><div class="atom-ring r2"></div></div>
  </button>
</div>

<div id="qrx-panel" role="dialog" aria-label="QRx Signal Analyst">

  <div class="panel-scroll-area">

    <div class="qrx-briefing-overlay" id="qrx-briefing-overlay">
      <div class="qrx-briefing-header">
        <span class="qrx-briefing-title" id="qrx-briefing-title">Signal Analyst</span>
        <button class="qrx-briefing-back" id="qrx-briefing-back">&#8592; Back</button>
        <button class="qrx-briefing-speak" id="qrx-briefing-speak">&#9654; Listen</button>
        <button class="qrx-briefing-close" id="qrx-briefing-close">Close &#x2715;</button>
      </div>
      <div class="qrx-briefing-body" id="qrx-briefing-body">
        <div class="qrx-briefing-loading">Ask a question or pick a signal below to get started.</div>
      </div>
    </div>

    <div class="panel-header">
      <div class="hdr-dots">
        <button class="hdr-dot hdr-dot-r" id="qrx-close" aria-label="Close"></button>
        <div class="hdr-dot hdr-dot-y"></div>
        <div class="hdr-dot hdr-dot-g"></div>
      </div>
      <div class="hdr-center"><div class="hdr-title">QRx <span>Signal Analyst</span></div></div>
      <div class="hdr-pill"><div class="hdr-pill-dot"></div>Live</div>
    </div>

    <div class="ctx-bar">
      <span class="ctx-label">// Context loaded</span>
      <span class="ctx-value" id="qrx-ctx-value">Loading...</span>
    </div>

    <div id="qrx-msgs">
      <div class="chips" id="qrx-chips">
        <span style="font-size:0.8rem;color:#6b8aad;font-family:var(--sa-font)">Loading today's questions...</span>
      </div>
    </div>

    <div class="preset-bar">
      <div class="preset-label">// Explore the feeds</div>
      <a class="feed-link" href="https://quantumrx.eu/signals/" data-feed="signals">Signals</a>
      <a class="feed-link" href="https://quantumrx.eu/the-draw/" data-feed="draw">The Draw</a>
      <a class="feed-link" href="https://quantumrx.eu/mainstream/" data-feed="mainstream">Mainstream</a>
      <a class="feed-link" href="https://quantumrx.eu/this-week-in-tech/" data-feed="thisweek">This Week</a>
    </div>

  </div>

  <div class="input-bar">
    <div class="input-field-wrap">
      <span class="prompt-sym">&gt;_</span>
      <input id="qrx-input" type="text" placeholder="Ask about any signal this week..." autocomplete="off" maxlength="400"/>
    </div>
    <button id="qrx-send">SEND</button>
  </div>

</div>
</div>

<script>
(function(){
  var API_URL = "https://forge.quantumrx.eu/api/chat";
  var SIGNALS_BASE = "https://quantumrx.eu/signals/";
  var isOpen = false;
  var history = [];
  var limitReached = false;
  var entryCount = 0;

  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

  function trackWidgetEvent(action, extra) {
    if (typeof gtag !== 'function') return;
    gtag('event', action, Object.assign({
      source_page_type: PAGE_TYPE,
      source_article_title: PAGE_ARTICLE_TITLE || undefined
    }, extra || {}));
  }

  function togglePanel() {
    isOpen = !isOpen;
    document.getElementById('qrx-panel').classList.toggle('open', isOpen);
    if (isOpen) {
      trackWidgetEvent('widget_open');
      setTimeout(function(){ document.getElementById('qrx-input').focus(); }, 300);
    }
  }

  function closePanel() {
    isOpen = false;
    document.getElementById('qrx-panel').classList.remove('open');
  }

  document.getElementById('qrx-btn').addEventListener('click', togglePanel);
  document.getElementById('qrx-close').addEventListener('click', function(e){
    e.stopPropagation();
    closePanel();
  });

  document.getElementById('qrx-briefing-body').addEventListener('click', function(e){
    var link = e.target.closest('.qrx-slide-link');
    if (link) trackWidgetEvent('widget_signals_clickthrough', {
      link_type: 'slide_link',
      destination_tab: (link.href.split('tab=')[1] || null)
    });
  });

  function disablePresets() {}

  function openOverlay() { document.getElementById('qrx-briefing-overlay').classList.add('open'); }
  function closeOverlay() { document.getElementById('qrx-briefing-overlay').classList.remove('open'); }

  document.getElementById('qrx-briefing-close').addEventListener('click', closeOverlay);
  document.getElementById('qrx-briefing-back').addEventListener('click', closeOverlay);

  function scrollOverlayToBottom() {
    var body = document.getElementById('qrx-briefing-body');
    body.scrollTop = body.scrollHeight;
  }

  function clearFirstRunPlaceholder() {
    var body = document.getElementById('qrx-briefing-body');
    if (entryCount === 0) body.innerHTML = '';
  }

  function pushThinkingEntry() {
    clearFirstRunPlaceholder();
    var body = document.getElementById('qrx-briefing-body');
    var el = document.createElement('div');
    el.className = 'qrx-slide';
    el.id = 'qrx-thinking-slide';
    el.innerHTML = '<div class="qrx-slide-thinking">Pulling the signal...</div>';
    body.appendChild(el);
    openOverlay();
    scrollOverlayToBottom();
  }

  function removeThinkingEntry() {
    var el = document.getElementById('qrx-thinking-slide');
    if (el) el.remove();
  }

  function renderSections(sections) {
    return sections.map(function(s) {
      var label = s.label ? '<span class="qrx-slide-label">' + esc(s.label) + '</span>' : '';
      if (s.style === 'hottake') {
        return '<div class="qrx-slide-hottake">' + (label || '<span class="qrx-slide-label">QRx Take</span>') + '<div class="qrx-slide-text">' + esc(s.text) + '</div></div>';
      }
      if (s.style === 'verdict') {
        return '<div class="qrx-slide-verdict-wrap">' + label + '<div class="qrx-slide-text">' + esc(s.text) + '</div></div>';
      }
      var textClass = s.style === 'dim' ? 'qrx-slide-text dim' : 'qrx-slide-text';
      return '<div class="qrx-slide-part">' + label + '<div class="' + textClass + '">' + esc(s.text) + '</div></div>';
    }).join('');
  }

  function pushSlide(entry) {
    removeThinkingEntry();
    clearFirstRunPlaceholder();
    entryCount++;

    var body = document.getElementById('qrx-briefing-body');
    var el = document.createElement('div');
    el.className = 'qrx-slide';

    var html = '';
    if (entry.askedQuestion) {
      html += '<div class="qrx-slide-asked">You asked<span>' + esc(entry.askedQuestion) + '</span></div>';
    }
    if (entry.title) {
      html += '<div class="qrx-slide-title">' + esc(entry.title) + '</div>';
    }
    if (entry.source || entry.url) {
      html += '<div class="qrx-slide-source">';
      if (entry.source) html += '<span class="qrx-slide-source-name">' + esc(entry.source) + '</span>';
      if (entry.url) html += (entry.source ? ' &middot; ' : '') + '<a class="qrx-slide-source-link" href="' + esc(entry.url) + '" target="_blank" rel="noopener">Read original &rarr;</a>';
      html += '</div>';
    }

    if (entry.sections && entry.sections.length) {
      html += renderSections(entry.sections);
    } else if (entry.whatIsIt || entry.whyItMatters) {
      if (entry.whatIsIt) html += '<div class="qrx-slide-part"><span class="qrx-slide-label">What is it</span><div class="qrx-slide-text">' + esc(entry.whatIsIt) + '</div></div>';
      if (entry.whyItMatters) html += '<div class="qrx-slide-part"><span class="qrx-slide-label">Why it matters</span><div class="qrx-slide-text">' + esc(entry.whyItMatters) + '</div></div>';
      if (entry.whatToWatch) html += '<div class="qrx-slide-part"><span class="qrx-slide-label">What to watch</span><div class="qrx-slide-text dim">' + esc(entry.whatToWatch) + '</div></div>';
      if (entry.hotTake) html += '<div class="qrx-slide-hottake"><span class="qrx-slide-label">QRx Take</span><div class="qrx-slide-text">' + esc(entry.hotTake) + '</div></div>';
    } else if (entry.plainText) {
      html += '<div class="qrx-slide-part"><div class="qrx-slide-text">' + esc(entry.plainText) + '</div></div>';
    }

    if (entry.sourceLinks && entry.sourceLinks.length) {
      html += '<div class="qrx-slide-sources">';
      entry.sourceLinks.forEach(function(s){
        if (!s.url) return;
        html += '<a class="qrx-slide-link" href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title || s.source || 'Read source') + '</a>';
      });
      html += '</div>';
    }

    if (entry.tab) {
      html += '<a class="qrx-slide-link" href="' + SIGNALS_BASE + '?tab=' + entry.tab + '" target="_blank" rel="noopener">More signals</a>';
    }

    el.innerHTML = html;
    body.appendChild(el);
    openOverlay();
    scrollOverlayToBottom();
  }

  var ttsAudio = null;
  var ttsSpeaking = false;

  function getLastEntryText() {
    var body = document.getElementById('qrx-briefing-body');
    var slides = body.querySelectorAll('.qrx-slide');
    if (!slides.length) return '';
    var last = slides[slides.length - 1];
    var parts = last.querySelectorAll('.qrx-slide-text, .qrx-slide-title');
    var lines = [];
    parts.forEach(function(p){ if (p.textContent.trim()) lines.push(p.textContent.trim()); });
    return lines.join('. ');
  }

  function stopTTS() {
    if (ttsAudio) { ttsAudio.pause(); ttsAudio.src = ''; ttsAudio = null; }
    ttsSpeaking = false;
    var btn = document.getElementById('qrx-briefing-speak');
    if (btn) { btn.textContent = '▶ Listen'; btn.classList.remove('speaking'); }
  }

  document.getElementById('qrx-briefing-speak').addEventListener('click', function(){
    if (ttsSpeaking) { stopTTS(); return; }
    var text = getLastEntryText();
    if (!text) return;
    var btn = document.getElementById('qrx-briefing-speak');
    btn.textContent = '⏳ Loading...';
    btn.classList.add('speaking');
    fetch('https://forge.quantumrx.eu/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    })
    .then(function(r){ if (!r.ok) throw new Error('TTS failed'); return r.blob(); })
    .then(function(blob){
      var url = URL.createObjectURL(blob);
      ttsAudio = new Audio(url);
      ttsSpeaking = true;
      btn.textContent = '⏹ Stop';
      ttsAudio.addEventListener('ended', function(){ stopTTS(); URL.revokeObjectURL(url); });
      ttsAudio.addEventListener('error', function(){ stopTTS(); URL.revokeObjectURL(url); });
      ttsAudio.play();
    })
    .catch(function(){ btn.textContent = '▶ Listen'; btn.classList.remove('speaking'); ttsSpeaking = false; });
  });

  function showBlockedEntry() {
    pushSlide({
      title: 'Access Monitored',
      plainText: 'Unusual activity has been detected from your connection. This endpoint is monitored and protected. If you believe this is an error, normal access will resume automatically.'
    });
    limitReached = true;
    disablePresets();
    document.getElementById('qrx-input').disabled = true;
    document.getElementById('qrx-send').disabled = true;
  }

  function sendMessage(text, chipId) {
    if (!text || limitReached) return;

    history.push({ role: 'user', content: text });
    pushThinkingEntry();

    var body = { messages: history, pageContext: pageContext };
    if (chipId) body.chipId = chipId;

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    .then(function(r){
      if (r.status === 403) return r.text().then(function(){ return { blocked: true }; });
      return r.json();
    })
    .then(function(data){
      if (data.blocked) { showBlockedEntry(); return; }
      var raw = (data.content && data.content[0] && data.content[0].text) || 'No response.';
      if (data.limitReached) {
        limitReached = true;
        disablePresets();
        document.getElementById('qrx-input').disabled = true;
        document.getElementById('qrx-send').disabled = true;
      }

      var hasStructured = data.title || (data.sections && data.sections.length);

      pushSlide({
        askedQuestion: text,
        title: data.title || null,
        sections: data.sections || null,
        plainText: hasStructured ? null : raw,
        tab: data.readLink || null,
        sourceLinks: data.sourceLinks || null
      });

      history.push({ role: 'assistant', content: raw });
      if (data.weekLabel && data.storyCount) {
        document.getElementById('qrx-ctx-value').textContent = data.weekLabel + ' · ' + data.storyCount + ' signals';
      }
    })
    .catch(function(){
      removeThinkingEntry();
      pushSlide({ askedQuestion: text, plainText: 'Connection issue. Try again in a moment.' });
    });
  }

  document.getElementById('qrx-send').addEventListener('click', function(){
    var input = document.getElementById('qrx-input');
    var val = input.value.trim();
    if (!val) return;
    input.value = '';
    sendMessage(val);
  });

  document.getElementById('qrx-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('qrx-send').click();
  });

  function getPageSpecificChips() {
    if (PAGE_TYPE === 'article') {
      return [
        { label: 'What\'s your take on this?', question: 'What is your take on "' + PAGE_ARTICLE_TITLE + '"? Give me your opinion, do not summarise it.' },
        { label: 'Where is this heading?', question: 'Where is the technology behind "' + PAGE_ARTICLE_TITLE + '" heading over the next couple of years?' }
      ];
    }
    if (PAGE_TYPE === 'signals') {
      var tabLabel = (PAGE_SIGNALS_TAB || 'hot').toUpperCase();
      return [{ label: 'What\'s on this page?', question: 'What\'s the strongest story in the ' + tabLabel + ' vertical right now?' }];
    }
    if (PAGE_TYPE === 'thisweek') {
      return [{ label: 'What do you make of this week?', question: 'What do you make of this week\'s briefing? Give me your read on what it adds up to, not a recap.' }];
    }
    if (PAGE_TYPE === 'draw') {
      return [{ label: 'What\'s on this page?', question: 'What\'s on The Draw right now?' }];
    }
    if (PAGE_TYPE === 'mainstream') {
      return [{ label: 'What\'s on this page?', question: 'What\'s trending on Mainstream right now?' }];
    }
    return [];
  }

  function buildChipButton(chipData) {
    var btn = document.createElement('button');
    btn.className = 'chip';
    btn.innerHTML = '<span class="chip-label"></span>';
    btn.querySelector('.chip-label').textContent = chipData.label || chipData.question;
    btn.addEventListener('click', function(){
      trackWidgetEvent('widget_chip_click', { chip_question: chipData.question, chip_id: chipData.id, page_type: PAGE_TYPE });
      sendMessage(chipData.question, chipData.id);
    });
    return btn;
  }

  function sortChipsByPageRelevance(chips) {
    if (PAGE_TYPE !== 'signals' || !PAGE_SIGNALS_TAB) return chips;
    var relevant = [];
    var rest = [];
    chips.forEach(function(c){
      (c.vertical === PAGE_SIGNALS_TAB ? relevant : rest).push(c);
    });
    return relevant.concat(rest);
  }

  function loadDailyChips() {
    var container = document.getElementById('qrx-chips');
    var pageChips = getPageSpecificChips();

    container.innerHTML = '';
    pageChips.forEach(function(chipData){ container.appendChild(buildChipButton(chipData)); });

    fetch('https://forge.quantumrx.eu/api/chat-chips')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var chips = sortChipsByPageRelevance(data.chips || []);
        if (!chips.length) {
          if (!pageChips.length) {
            container.innerHTML = '<span style="font-size:0.8rem;color:#6b8aad;font-family:var(--sa-font)">No questions available right now.</span>';
          }
          return;
        }
        chips.forEach(function(chipData){ container.appendChild(buildChipButton(chipData)); });
      })
      .catch(function(){
        if (!pageChips.length) {
          container.innerHTML = '<span style="font-size:0.8rem;color:#6b8aad;font-family:var(--sa-font)">Could not load today\'s questions. Try again in a moment.</span>';
        }
      });
  }

  document.querySelectorAll('.feed-link').forEach(function(link){
    link.addEventListener('click', function(){
      trackWidgetEvent('widget_signals_clickthrough', { link_type: 'feed_link', destination: link.dataset.feed });
    });
  });

  var PAGE_TYPE = 'other';
  var PAGE_ARTICLE_TITLE = null;
  var PAGE_ARTICLE_DESC = null;
  var PAGE_SIGNALS_TAB = null;
  var pageContext = null;

  function detectPageType() {
    var path = window.location.pathname;
    var search = window.location.search;
    if (/\/signals\/?/.test(path)) {
      PAGE_TYPE = 'signals';
      PAGE_SIGNALS_TAB = new URLSearchParams(search).get('tab') || 'hot';
      return;
    }
    if (/\/this-week/.test(path)) { PAGE_TYPE = 'thisweek'; return; }
    if (/\/the-draw\/?/.test(path)) { PAGE_TYPE = 'draw'; return; }
    if (/\/mainstream\/?/.test(path)) { PAGE_TYPE = 'mainstream'; return; }
    if (path === '/' || /\/(products|the-forge|tag|author)\/?/.test(path)) { PAGE_TYPE = 'other'; return; }
    var ogTitle = document.querySelector('meta[property="og:title"]');
    var ogDesc = document.querySelector('meta[property="og:description"]');
    if (ogTitle && ogTitle.content && ogTitle.content !== 'QuantumRx') {
      PAGE_TYPE = 'article';
      PAGE_ARTICLE_TITLE = ogTitle.content;
      PAGE_ARTICLE_DESC = ogDesc ? ogDesc.content : '';
    }
  }

  function buildPageContext() {
    if (PAGE_TYPE === 'article') {
      return 'PAGE CONTEXT: The visitor is currently reading a QuantumRx article.\nTitle: ' + PAGE_ARTICLE_TITLE + '\nSummary: ' + PAGE_ARTICLE_DESC + '\nDo NOT summarise this article back to them, they are already reading it. Give your own take on it and where the specific technology involved is heading.';
    }
    if (PAGE_TYPE === 'signals') {
      var tabLabel = (PAGE_SIGNALS_TAB || 'hot').toUpperCase();
      return 'PAGE CONTEXT: The visitor is on the Signals feed, currently viewing the ' + tabLabel + ' vertical. When asked about stories, use the live Signals data for this vertical. Offer story titles as options for the visitor to pick from, then give your take on the one they choose and where that technology is heading, rather than summarising.';
    }
    if (PAGE_TYPE === 'thisweek') {
      return 'PAGE CONTEXT: The visitor is on the This Week in Tech briefing page. Offer the weekly briefing story titles as options for the visitor to pick from. When they select one, give your take on it and where the technology is heading.';
    }
    if (PAGE_TYPE === 'draw') {
      return 'PAGE CONTEXT: The visitor is on The Draw, world headlines and financial news drawn from major outlets like BBC, Reuters, Deutsche Welle, and Times of India. If asked what\'s happening in world news, prioritise this context. The page has two tabs, Main Headlines and Financial News, but which one the visitor is currently viewing is not available here.';
    }
    if (PAGE_TYPE === 'mainstream') {
      return 'PAGE CONTEXT: The visitor is on Mainstream, a curated view of top technology stories from outlets like BBC, Reuters, Wired, The Verge, Ars Technica, and MIT Technology Review. If asked what\'s trending in mainstream tech coverage, prioritise this context.';
    }
    return null;
  }

  detectPageType();
  pageContext = buildPageContext();
  loadDailyChips();

  if (PAGE_TYPE === 'article') {
    document.getElementById('qrx-ctx-value').textContent = 'Article context loaded';
  } else if (PAGE_TYPE === 'signals') {
    var tabLabel = (PAGE_SIGNALS_TAB || 'hot').toUpperCase();
    document.getElementById('qrx-ctx-value').textContent = tabLabel + ' feed · live';
  } else if (PAGE_TYPE === 'thisweek') {
    document.getElementById('qrx-ctx-value').textContent = 'Weekly briefing loaded';
    fetch('https://forge.quantumrx.eu/api/weekly-feed')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var stories = d.current && d.current.stories;
        if (stories && stories.length) {
          var label = d.current.weekLabel || 'this week';
          document.getElementById('qrx-ctx-value').textContent = label + ' · ' + stories.length + ' signals';
        }
      })
      .catch(function(){});
  } else if (PAGE_TYPE === 'draw') {
    document.getElementById('qrx-ctx-value').textContent = 'The Draw · world & financial news';
  } else if (PAGE_TYPE === 'mainstream') {
    document.getElementById('qrx-ctx-value').textContent = 'Mainstream · top tech coverage';
  } else {
    document.getElementById('qrx-ctx-value').textContent = 'Live coverage active';
    fetch('https://forge.quantumrx.eu/api/weekly-feed')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.current && d.current.stories && d.current.stories.length) {
          var label = d.current.weekLabel || 'this week';
          document.getElementById('qrx-ctx-value').textContent = label + ' · ' + d.current.stories.length + ' signals';
        }
      })
      .catch(function(){});
  }

  // Auto-open the analyst when arriving with a "#chat" flag — e.g. after
  // clicking a signal headline chip in the Signal Analyst on another
  // QuantumRx page, which opens Signals with "#chat" so the analyst is
  // already open on arrival here. Hash is cleared so a refresh won't re-open.
  try {
    if (!isOpen && location.hash && location.hash.toLowerCase().indexOf('chat') !== -1) {
      togglePanel();
      // NB: local `var history` (the conversation array) shadows window.history
      // here, so we must reference window.history explicitly to clear the hash.
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', location.pathname + location.search);
      }
    }
  } catch (e) {}

})();
</script>

<!-- ============================================================
     QRx article comments — renders the same member comment thread used
     in the Signals drawer at the bottom of every Ghost ARTICLE page
     (body.post-template only). Thread key = the article's canonical URL.
     Reads/writes via forge.quantumrx.eu/api/comments; posting requires a
     signed-in Ghost member (identity token verified server-side).
     ============================================================ -->
<style>
  .qrx-pc{max-width:760px;margin:48px auto 24px;padding:26px 28px 30px;background:#f7f4ed;border:1px solid #1a1a1a;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1a1a1a}
  .qrx-pc *{box-sizing:border-box}
  .qrx-pc h3{font-family:Georgia,"Times New Roman",serif;font-size:1.45rem;font-weight:700;margin:0 0 18px;padding-bottom:12px;border-bottom:3px solid #1a1a1a}
  .qrx-pc h3 span{font-weight:400;color:#8a7f6a;font-size:1.05rem;margin-left:8px}
  .qrx-pc-list{display:flex;flex-direction:column;gap:18px;margin:0 0 24px}
  .qrx-pc-c{padding:0 0 16px;border-bottom:1px solid rgba(26,26,26,.14)}
  .qrx-pc-c:last-child{border-bottom:none}
  .qrx-pc-c.reply{margin-left:24px;padding-left:16px;border-left:3px solid rgba(26,26,26,.12)}
  .qrx-pc-meta{font-size:.95rem;color:#5a5040;margin:0 0 6px}
  .qrx-pc-meta b{color:#1a1a1a;font-size:1rem}
  .qrx-pc-meta .r{color:#8a7f6a;font-size:.9rem;margin-left:4px}
  .qrx-pc-text{font-size:1.1rem;line-height:1.65;color:#222;white-space:pre-wrap;word-break:break-word;margin:0}
  .qrx-pc-empty{font-size:1.05rem;color:#8a7f6a;font-style:italic;margin:0 0 20px}
  .qrx-pc-form{display:flex;flex-direction:column;gap:10px;background:#fff;border:1.5px solid #1a1a1a;border-radius:8px;padding:16px}
  .qrx-pc-form label{font-size:.85rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5a5040}
  .qrx-pc-form textarea{width:100%;min-height:120px;padding:12px 14px;font:inherit;font-size:1.08rem;line-height:1.55;border:1px solid #c9c2b4;border-radius:6px;background:#fff;color:#1a1a1a;resize:vertical;outline:none}
  .qrx-pc-form textarea:focus{border-color:#0050e0;box-shadow:0 0 0 3px rgba(0,80,224,.15)}
  .qrx-pc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .qrx-pc-as{font-size:.95rem;color:#5a5040}
  .qrx-pc-post{font:inherit;font-size:.95rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#f7f4ed;background:#1a1a1a;border:none;border-radius:6px;padding:13px 24px;cursor:pointer}
  .qrx-pc-post:hover{background:#0050e0}
  .qrx-pc-post:disabled{opacity:.5;cursor:default}
  .qrx-pc-signin{font-size:1.08rem;color:#3a3a3a;padding:20px;background:rgba(0,80,224,.07);border-radius:8px;text-align:center;line-height:1.5}
  .qrx-pc-signin button{display:inline-block;margin-top:12px;font:inherit;font-size:.95rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:#0050e0;border:none;border-radius:6px;padding:13px 24px;cursor:pointer}
  .qrx-pc-note{font-size:.98rem;color:#0a7d4f;margin:8px 0 0}
  .qrx-pc-err{font-size:.98rem;color:#8a3a2a;margin:8px 0 0}
  @media(max-width:640px){.qrx-pc{margin:36px 12px 20px;padding:20px 18px 24px}.qrx-pc-c.reply{margin-left:12px;padding-left:12px}}
</style>
<script>
(function () {
  var API = 'https://forge.quantumrx.eu';
  var mounted = false, session = { token: null, name: null, at: 0 };

  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function ago(ts){ if (!ts) return ''; var m = Math.floor((Date.now() - ts) / 60000); if (m < 2) return 'just now'; if (m < 60) return m + 'm ago'; var h = Math.floor(m / 60); if (h < 24) return h + 'h ago'; return Math.floor(h / 24) + 'd ago'; }
  function storyId(){ var c = document.querySelector('link[rel="canonical"]'); var u = c && c.href ? c.href : location.origin + location.pathname; return u.split('#')[0].split('?')[0]; }

  function getSession(force){
    if (!force && session.at && Date.now() - session.at < 240000) return Promise.resolve(session);
    return fetch('/members/api/session', { credentials: 'same-origin' })
      .then(function (r) { return r.status === 200 ? r.text() : ''; })
      .then(function (tok) {
        session.token = (tok || '').trim() || null; session.at = Date.now();
        if (!session.token) { session.name = null; return session; }
        return fetch('/members/api/member/', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; })
          .then(function (m) { session.name = m && m.name ? m.name : null; return session; }).catch(function () { return session; });
      }).catch(function () { session.token = null; session.at = Date.now(); return session; });
  }

  function renderList(root, list){
    var el = root.querySelector('.qrx-pc-list');
    root.querySelector('.qrx-pc-n').textContent = list.length ? '(' + list.length + ')' : '';
    if (!list.length) { el.innerHTML = '<p class="qrx-pc-empty">No comments yet — start the conversation.</p>'; return; }
    el.innerHTML = list.map(function (c) {
      return '<div class="qrx-pc-c' + (c.replyTo ? ' reply' : '') + '"><p class="qrx-pc-meta"><b>' + esc(c.name) + '</b>'
        + (c.replyTo ? '<span class="r">&#8618; replying to @' + esc(c.replyTo.name) + '</span>' : '')
        + ' · ' + esc(ago(c.createdAt)) + '</p><p class="qrx-pc-text">' + esc(c.text) + '</p></div>';
    }).join('');
  }
  function load(root){
    fetch(API + '/api/comments?storyId=' + encodeURIComponent(storyId())).then(function (r) { return r.json(); })
      .then(function (d) { renderList(root, (d && d.comments) || []); }).catch(function () { renderList(root, []); });
  }
  function renderAction(root){
    var el = root.querySelector('.qrx-pc-action');
    getSession(false).then(function (s) {
      if (!s.token) {
        el.innerHTML = '<div class="qrx-pc-signin">Comments are for QuantumRx members. Signing in is free and takes one click.<br><button type="button">Sign in to comment</button></div>';
        el.querySelector('button').addEventListener('click', function () { window.location.hash = '#/portal/signin'; });
        return;
      }
      el.innerHTML = '<form class="qrx-pc-form"><label for="qrxPcIn">Your comment</label>'
        + '<textarea id="qrxPcIn" maxlength="1200" placeholder="What do you make of this?" required></textarea>'
        + '<div class="qrx-pc-row"><span class="qrx-pc-as">Posting as <b>' + esc(s.name || 'you') + '</b></span><button class="qrx-pc-post" type="submit">Post comment</button></div><div class="qrx-pc-msg"></div></form>';
      el.querySelector('form').addEventListener('submit', function (e) { e.preventDefault(); post(root); });
    });
  }
  function post(root){
    var input = root.querySelector('textarea'), btn = root.querySelector('.qrx-pc-post'), msg = root.querySelector('.qrx-pc-msg');
    var text = (input.value || '').trim(); if (!text) return;
    btn.disabled = true; msg.innerHTML = '';
    getSession(true).then(function (s) {
      if (!s.token) { btn.disabled = false; renderAction(root); return; }
      return fetch(API + '/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.token },
        body: JSON.stringify({ storyId: storyId(), text: text, name: s.name || '' }) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
        .then(function (res) {
          btn.disabled = false;
          if (!res.ok) { msg.innerHTML = '<p class="qrx-pc-err">' + esc((res.d && res.d.error) || 'Could not post your comment') + '</p>'; if (res.status === 401) { session.token = null; renderAction(root); } return; }
          input.value = '';
          msg.innerHTML = '<p class="qrx-pc-note">' + esc(res.d && res.d.status === 'held' ? (res.d.message || 'Your comment is being reviewed.') : 'Posted.') + '</p>';
          load(root);
        });
    }).catch(function () { btn.disabled = false; msg.innerHTML = '<p class="qrx-pc-err">Network error — please try again.</p>'; });
  }

  function mount(){
    if (mounted || !document.body || !document.body.classList.contains('post-template')) return;
    if (document.querySelector('.qrx-pc')) { mounted = true; return; } // already mounted by another injection (site footer vs per-post)
    var content = document.querySelector('.gh-content') || document.querySelector('.post-content') || document.querySelector('article');
    if (!content) return;
    mounted = true;
    var root = document.createElement('section');
    root.className = 'qrx-pc';
    root.innerHTML = '<h3>Member comments<span class="qrx-pc-n"></span></h3><div class="qrx-pc-list"><p class="qrx-pc-empty">Loading comments…</p></div><div class="qrx-pc-action"></div>';
    content.parentNode.insertBefore(root, content.nextSibling);
    load(root); renderAction(root);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
  window.addEventListener('load', mount);
})();
</script>

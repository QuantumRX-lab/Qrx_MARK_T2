<!--
  Ghost site-wide footer code injection (NOT a page — loads on every
  page via Ghost's Code Injection > Site Footer setting).
  Pasted 2026-07-06 for reference during the widget-pages-to-Vercel move.

  Three pieces bundled in this one field:
  1. Form interceptor — diverts raw newsletter forms into Ghost's
     built-in Portal signup popup (#/portal/signup).
  2. Corporate footer cleanup — hides Ghost's default CTA/signup
     footer blocks, injects a custom icon + company-details footer.
  3. AI discovery layer — Organization JSON-LD schema + an
     ai-agent-index meta tag aimed at LLM crawlers/indexers.

  All three are tied to Ghost's own DOM structure (.gh-footer-signup,
  .gh-cta, .site-footer, .gh-foot, etc.) and Ghost's Portal signup
  system — none of this is portable to a standalone Vercel page as-is.
-->
<!-- INTERCEPTOR SCRIPT: Diverts raw forms into the Full Name + Email Portal Popup -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const targetForms = document.querySelectorAll('.gh-header-inner form, .gh-form, footer form, .gh-footer-signup form');
    targetForms.forEach(function(form) {
        const inputs = form.querySelectorAll('input');
        inputs.forEach(input => {
            input.setAttribute('readonly', 'true');
            input.setAttribute('placeholder', 'Click here to subscribe...');
        });
        const openPortal = function(e) {
            e.preventDefault();
            e.stopPropagation();
            window.location.hash = '#/portal/signup';
        };
        form.addEventListener('click', openPortal);
        form.addEventListener('submit', openPortal);
    });
});
</script>

<!-- CORPORATE FOOTER CLEANUP & INJECTION -->
<style>
    .gh-footer-signup, .gh-cta, section.gh-cta { display: none !important; }
    .qrx-footer-icon { display: flex; align-items: center; padding-left: 2%; }
    .qrx-footer-icon img { width: 45px; height: 45px; object-fit: contain; }
    .qrx-company-details {

        font-size: 0.85rem;
        color: #6e7681;
        line-height: 1.6;
        margin-left: auto;
        padding-right: 2%;
    }
    .qrx-company-details strong { color: #1c1c1c; font-weight: 600; }
    .qrx-company-details a { color: #2b579a; text-decoration: none; }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const possibleFooters = document.querySelectorAll('.site-footer, .gh-foot, .gh-footer, footer');
    const mainFooter = possibleFooters[possibleFooters.length - 1];
    if (mainFooter) {
        const innerContainer = mainFooter.querySelector('.gh-foot-inner, .site-footer-inner, div') || mainFooter;
        Array.from(innerContainer.children).forEach(child => { child.style.display = 'none'; });
        innerContainer.style.display = 'flex';
        innerContainer.style.justifyContent = 'space-between';
        innerContainer.style.alignItems = 'center';
        innerContainer.style.width = '100%';
        const iconBlock = document.createElement('div');
        iconBlock.className = 'qrx-footer-icon';
        const iconUrl = document.querySelector('link[rel="icon"]')?.href || '/favicon.png';
        iconBlock.innerHTML = `<img src="${iconUrl}" alt="QuantumRX Icon">`;
        const detailsBlock = document.createElement('div');
        detailsBlock.className = 'qrx-company-details';
        detailsBlock.innerHTML = `
            <strong>QuantumRX Ltd.</strong><br>
            71-75 Shelton Street, Covent Garden<br>
            London, WC2H 9JQ, United Kingdom<br>
            <a href="mailto:info@quantumrx.eu">info@quantumrx.eu</a><br>
            <a href="https://www.quantumrx.eu/terms-conditions/">Terms &amp; Conditions</a>
        `;
        innerContainer.appendChild(iconBlock);
        innerContainer.appendChild(detailsBlock);
    }
});
</script>

<!-- ============================================================
     QRx article comments — renders the same member comment thread used
     in the Signals drawer at the bottom of every Ghost ARTICLE page
     (body.post-template only). Thread key = the article's canonical URL.
     Reads/writes via forge.quantumrx.eu/api/comments; posting requires a
     signed-in Ghost member (identity token verified server-side).
     ============================================================ -->
<style>
  .qrx-pc{max-width:760px;margin:48px auto 24px;padding:26px 28px 30px;background:#f7f4ed;border:1px solid #1a1a1a;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1a1a1a}
  .qrx-pc *{box-sizing:border-box}
  .qrx-pc h3{font-family:Georgia,"Times New Roman",serif;font-size:1.45rem;font-weight:700;margin:0 0 18px;padding-bottom:12px;border-bottom:3px solid #1a1a1a}
  .qrx-pc h3 span{font-weight:400;color:#8a7f6a;font-size:1.05rem;margin-left:8px}
  .qrx-pc-list{display:flex;flex-direction:column;gap:18px;margin:0 0 24px}
  .qrx-pc-c{padding:0 0 16px;border-bottom:1px solid rgba(26,26,26,.14)}
  .qrx-pc-c:last-child{border-bottom:none}
  .qrx-pc-c.reply{margin-left:24px;padding-left:16px;border-left:3px solid rgba(26,26,26,.12)}
  .qrx-pc-meta{font-size:.95rem;color:#5a5040;margin:0 0 6px}
  .qrx-pc-meta b{color:#1a1a1a;font-size:1rem}
  .qrx-pc-meta .r{color:#8a7f6a;font-size:.9rem;margin-left:4px}
  .qrx-pc-text{font-size:1.1rem;line-height:1.65;color:#222;white-space:pre-wrap;word-break:break-word;margin:0}
  .qrx-pc-empty{font-size:1.05rem;color:#8a7f6a;font-style:italic;margin:0 0 20px}
  .qrx-pc-form{display:flex;flex-direction:column;gap:10px;background:#fff;border:1.5px solid #1a1a1a;border-radius:8px;padding:16px}
  .qrx-pc-form label{font-size:.85rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5a5040}
  .qrx-pc-form textarea{width:100%;min-height:120px;padding:12px 14px;font:inherit;font-size:1.08rem;line-height:1.55;border:1px solid #c9c2b4;border-radius:6px;background:#fff;color:#1a1a1a;resize:vertical;outline:none}
  .qrx-pc-form textarea:focus{border-color:#0050e0;box-shadow:0 0 0 3px rgba(0,80,224,.15)}
  .qrx-pc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .qrx-pc-as{font-size:.95rem;color:#5a5040}
  .qrx-pc-post{font:inherit;font-size:.95rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#f7f4ed;background:#1a1a1a;border:none;border-radius:6px;padding:13px 24px;cursor:pointer}
  .qrx-pc-post:hover{background:#0050e0}
  .qrx-pc-post:disabled{opacity:.5;cursor:default}
  .qrx-pc-signin{font-size:1.08rem;color:#3a3a3a;padding:20px;background:rgba(0,80,224,.07);border-radius:8px;text-align:center;line-height:1.5}
  .qrx-pc-signin button{display:inline-block;margin-top:12px;font:inherit;font-size:.95rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:#0050e0;border:none;border-radius:6px;padding:13px 24px;cursor:pointer}
  .qrx-pc-note{font-size:.98rem;color:#0a7d4f;margin:8px 0 0}
  .qrx-pc-err{font-size:.98rem;color:#8a3a2a;margin:8px 0 0}
  @media(max-width:640px){.qrx-pc{margin:36px 12px 20px;padding:20px 18px 24px}.qrx-pc-c.reply{margin-left:12px;padding-left:12px}}
</style>
<script>
(function () {
  var API = 'https://forge.quantumrx.eu';
  var mounted = false, session = { token: null, name: null, at: 0 };

  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function ago(ts){ if (!ts) return ''; var m = Math.floor((Date.now() - ts) / 60000); if (m < 2) return 'just now'; if (m < 60) return m + 'm ago'; var h = Math.floor(m / 60); if (h < 24) return h + 'h ago'; return Math.floor(h / 24) + 'd ago'; }
  function storyId(){ var c = document.querySelector('link[rel="canonical"]'); var u = c && c.href ? c.href : location.origin + location.pathname; return u.split('#')[0].split('?')[0]; }

  function getSession(force){
    if (!force && session.at && Date.now() - session.at < 240000) return Promise.resolve(session);
    return fetch('/members/api/session', { credentials: 'same-origin' })
      .then(function (r) { return r.status === 200 ? r.text() : ''; })
      .then(function (tok) {
        session.token = (tok || '').trim() || null; session.at = Date.now();
        if (!session.token) { session.name = null; return session; }
        return fetch('/members/api/member/', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; })
          .then(function (m) { session.name = m && m.name ? m.name : null; return session; }).catch(function () { return session; });
      }).catch(function () { session.token = null; session.at = Date.now(); return session; });
  }

  function renderList(root, list){
    var el = root.querySelector('.qrx-pc-list');
    root.querySelector('.qrx-pc-n').textContent = list.length ? '(' + list.length + ')' : '';
    if (!list.length) { el.innerHTML = '<p class="qrx-pc-empty">No comments yet — start the conversation.</p>'; return; }
    el.innerHTML = list.map(function (c) {
      return '<div class="qrx-pc-c' + (c.replyTo ? ' reply' : '') + '"><p class="qrx-pc-meta"><b>' + esc(c.name) + '</b>'
        + (c.replyTo ? '<span class="r">&#8618; replying to @' + esc(c.replyTo.name) + '</span>' : '')
        + ' · ' + esc(ago(c.createdAt)) + '</p><p class="qrx-pc-text">' + esc(c.text) + '</p></div>';
    }).join('');
  }
  function load(root){
    fetch(API + '/api/comments?storyId=' + encodeURIComponent(storyId())).then(function (r) { return r.json(); })
      .then(function (d) { renderList(root, (d && d.comments) || []); }).catch(function () { renderList(root, []); });
  }
  function renderAction(root){
    var el = root.querySelector('.qrx-pc-action');
    getSession(false).then(function (s) {
      if (!s.token) {
        el.innerHTML = '<div class="qrx-pc-signin">Comments are for QuantumRx members. Signing in is free and takes one click.<br><button type="button">Sign in to comment</button></div>';
        el.querySelector('button').addEventListener('click', function () { window.location.hash = '#/portal/signin'; });
        return;
      }
      el.innerHTML = '<form class="qrx-pc-form"><label for="qrxPcIn">Your comment</label>'
        + '<textarea id="qrxPcIn" maxlength="1200" placeholder="What do you make of this?" required></textarea>'
        + '<div class="qrx-pc-row"><span class="qrx-pc-as">Posting as <b>' + esc(s.name || 'you') + '</b></span><button class="qrx-pc-post" type="submit">Post comment</button></div><div class="qrx-pc-msg"></div></form>';
      el.querySelector('form').addEventListener('submit', function (e) { e.preventDefault(); post(root); });
    });
  }
  function post(root){
    var input = root.querySelector('textarea'), btn = root.querySelector('.qrx-pc-post'), msg = root.querySelector('.qrx-pc-msg');
    var text = (input.value || '').trim(); if (!text) return;
    btn.disabled = true; msg.innerHTML = '';
    getSession(true).then(function (s) {
      if (!s.token) { btn.disabled = false; renderAction(root); return; }
      return fetch(API + '/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.token },
        body: JSON.stringify({ storyId: storyId(), text: text, name: s.name || '' }) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
        .then(function (res) {
          btn.disabled = false;
          if (!res.ok) { msg.innerHTML = '<p class="qrx-pc-err">' + esc((res.d && res.d.error) || 'Could not post your comment') + '</p>'; if (res.status === 401) { session.token = null; renderAction(root); } return; }
          input.value = '';
          msg.innerHTML = '<p class="qrx-pc-note">' + esc(res.d && res.d.status === 'held' ? (res.d.message || 'Your comment is being reviewed.') : 'Posted.') + '</p>';
          load(root);
        });
    }).catch(function () { btn.disabled = false; msg.innerHTML = '<p class="qrx-pc-err">Network error — please try again.</p>'; });
  }

  function mount(){
    if (mounted || !document.body || !document.body.classList.contains('post-template')) return;
    if (document.querySelector('.qrx-pc')) { mounted = true; return; } // already mounted by another injection (site footer vs per-post)
    var content = document.querySelector('.gh-content') || document.querySelector('.post-content') || document.querySelector('article');
    if (!content) return;
    mounted = true;
    var root = document.createElement('section');
    root.className = 'qrx-pc';
    root.innerHTML = '<h3>Member comments<span class="qrx-pc-n"></span></h3><div class="qrx-pc-list"><p class="qrx-pc-empty">Loading comments…</p></div><div class="qrx-pc-action"></div>';
    content.parentNode.insertBefore(root, content.nextSibling);
    load(root); renderAction(root);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
  window.addEventListener('load', mount);
})();
</script>

<script>
(function () {
  var IMG = 'https://storage.ghost.io/c/08/be/08be680d-f37c-44dd-98a9-d496fb40d8de/content/images/2026/06/quantumrx-hero-1600w-under-300kb.webp';
  var injected = false;

  function buildHero() {
    if (injected) return;
    if (!document.body.classList.contains('home-template')) return;

    var viewport = document.querySelector('.gh-viewport');
    if (!viewport) return;
    injected = true;

    var preload = new Image();
    preload.src = IMG;

    var hero = document.createElement('div');
    hero.className = 'qrx-hero';

    hero.innerHTML =
      '<div class="qrx-hero-inner">' +
        '<h1 class="qrx-hero-title">The signals, not the noise.</h1>' +
        '<p class="qrx-hero-sub">QuantumRx tracks AI infrastructure, agentic systems, edge compute, satcom, robotics and deployment tools. Built from the field, not from the sidelines.</p>' +
        '<div class="qrx-subscribe-form">' +
          '<input type="email" class="qrx-email-input" placeholder="Enter your email address" autocomplete="email" />' +
          '<button class="qrx-subscribe-btn">Subscribe Free</button>' +
        '</div>' +
      '</div>' +
      '<div class="qrx-credits">' +
        '<div>Copyright &copy; 2026 QuantumRX &mdash; All rights reserved</div>' +
        '<div>71-75 Shelton Street, Covent Garden, London, WC2H 9JQ, United Kingdom</div>' +
        '<div>Contact: <a href="mailto:info@quantumrx.eu">info@quantumrx.eu</a> &middot; <a href="https://www.quantumrx.eu/terms-conditions/">Terms &amp; Conditions</a></div>' +
      '</div>';

    var nav = viewport.querySelector('.gh-navigation');
    if (nav) {
      viewport.insertBefore(hero, nav.nextSibling);
    } else {
      viewport.insertBefore(hero, viewport.firstChild);
    }

    var btn   = hero.querySelector('.qrx-subscribe-btn');
    var input = hero.querySelector('.qrx-email-input');

    btn.addEventListener('click', function () {
      var email = input.value.trim();
      if (email && email.indexOf('@') > -1) {
        window.location.href = '#/portal/signup?email=' + encodeURIComponent(email);
      } else {
        input.focus();
      }
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') btn.click();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildHero);
  } else {
    buildHero();
  }

  window.addEventListener('load', buildHero);

  var obs = new MutationObserver(function () {
    if (document.querySelector('.gh-viewport') && document.body.classList.contains('home-template')) {
      buildHero();
      if (injected) obs.disconnect();
    }
  });
  obs.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

<script>
(function () {
  var API = 'https://forge.quantumrx.eu';
  var CARDS = 8;
  var TAB_ORDER = ['AI','Chips & Quantum','Robotics','Space','Connectivity','Energy & Climate','Policy','Markets','Social','World','Conflict','Science'];
  var built = false, labeled = false;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function ago(ms){ if (!ms) return ''; var m = Math.floor((Date.now() - Number(ms)) / 60000); if (!isFinite(m) || m < 0) return ''; if (m < 60) return Math.max(1, m) + 'm ago'; var h = Math.floor(m / 60); if (h < 24) return h + 'h ago'; return Math.floor(h / 24) + 'd ago'; }
  function safeImg(u){ return (typeof u === 'string' && /^https?:\/\//.test(u)) ? u : ''; }
  function blurb(it){ return it.what_is_it || it.summary || it.description || ''; }
  function storyHref(it){ return '/signals/?story=' + encodeURIComponent(it.link); }
  function tag(it){
    if (it.hot) return '<span class="qrx-fp-cat hot">Top story' + (it.subcategory && it.subcategory !== 'Top story' ? ' · ' + esc(it.subcategory) : '') + '</span>';
    return '<span class="qrx-fp-cat">' + esc(it.subcategory || it.category || '') + '</span>';
  }
  function meta(it){ return esc([it.source, ago(it.published)].filter(Boolean).join(' · ')); }
  function getJSON(url){ return fetch(url, { credentials:'omit' }).then(function (r) { if (!r.ok) throw new Error('bad status'); return r.json(); }); }
  function wireImgs(root){ root.querySelectorAll('img').forEach(function (im) { if (im.__w) return; im.__w = 1; im.addEventListener('error', function () { im.style.display = 'none'; }); }); }

  function renderStories(front, d){
    var items = (d && d.items) || [];
    if (!items.length) return false;
    var lead = items[0], rest = items.slice(1, 1 + CARDS), li = safeImg(lead.image);
    var h = '<a class="qrx-fp-lead' + (li ? '' : ' noimg') + '" href="' + esc(storyHref(lead)) + '">'
      + (li ? '<div class="qrx-fp-lead-img"><img src="' + esc(li) + '" alt="" loading="eager"></div>' : '')
      + '<div class="qrx-fp-lead-body">' + tag(lead) + '<h3>' + esc(lead.title) + '</h3><p>' + esc(blurb(lead)) + '</p>'
      + '<div class="qrx-fp-m">' + meta(lead) + '</div><span class="qrx-fp-open">Summary &amp; comments</span></div></a>'
      + '<div class="qrx-fp-grid">';
    rest.forEach(function (it) {
      var im = safeImg(it.image);
      h += '<a class="qrx-fp-card" href="' + esc(storyHref(it)) + '">' + tag(it) + '<h3>' + esc(it.title) + '</h3>'
        + (im ? '<img src="' + esc(im) + '" alt="" loading="lazy">' : '')
        + '<p>' + esc(blurb(it)) + '</p><div class="qrx-fp-m">' + meta(it) + '</div><span class="qrx-fp-open">Summary &amp; comments</span></a>';
    });
    h += '</div>';
    front.querySelector('.qrx-fp-stories').innerHTML = h;

    var chips = TAB_ORDER.filter(function (t) { return d.counts && d.counts[t]; }).map(function (t) {
      return '<a class="qrx-fp-chip" href="/signals/?tab=' + encodeURIComponent(t) + '">' + esc(t) + '<span>' + d.counts[t] + '</span></a>';
    }).join('');
    front.querySelector('.qrx-fp-more').innerHTML =
      '<a class="qrx-fp-more-btn" href="/signals/">See all ' + (d.total || items.length) + ' stories →</a>' +
      (chips ? '<div class="qrx-fp-chips">' + chips + '</div>' : '');
    var all = front.querySelector('.qrx-fp-all'); if (all && d.total) all.textContent = 'All ' + d.total + ' stories →';
    wireImgs(front);
    return true;
  }

  function renderWeekly(front, stories){
    var zone = front.querySelector('.qrx-fp-weekly'), top = (stories || []).slice(0, 5);
    if (!zone) return; if (!top.length) { zone.remove(); return; }
    zone.querySelector('.rows').innerHTML = top.map(function (s, i) {
      return '<a class="qrx-fp-row" href="/this-week-in-tech/"><span class="qrx-fp-num">' + (i + 1) + '</span><span><span class="k">' + esc(s.category || 'Briefing') + '</span><strong>' + esc(s.title || '') + '</strong></span></a>';
    }).join('');
  }
  function renderExploit(front, items){
    var zone = front.querySelector('.qrx-fp-exploit'), top = (items || []).slice(0, 5);
    if (!zone) return; if (!top.length) { zone.remove(); return; }
    zone.querySelector('.rows').innerHTML = top.map(function (it) {
      return '<a class="qrx-fp-row" href="' + esc(it.url || it.link || '#') + '" target="_blank" rel="noopener"><span><span class="k">' + esc([it.item_type || 'Finding', it.source].filter(Boolean).join(' · ')) + '</span><strong>' + esc(it.title || '') + '</strong>' + (it.target ? '<span class="t">' + esc(it.target) + '</span>' : '') + '</span></a>';
    }).join('');
  }
  function tidyLower(front){ var l = front.querySelector('.qrx-fp-lower'); if (l && !l.children.length) l.remove(); }

  function buildFront(){
    if (built) return;
    if (!document.body || !document.body.classList.contains('home-template')) return;
    var viewport = document.querySelector('.gh-viewport'); if (!viewport) return;
    if (document.querySelector('.qrx-fp')) { built = true; return; }
    built = true;

    var front = document.createElement('div');
    front.className = 'qrx-fp'; front.style.display = 'none';
    front.innerHTML =
      '<div class="qrx-fp-in">' +
        '<header class="qrx-fp-head"><div><span class="qrx-fp-eyebrow">Live intelligence</span><h2>Today&rsquo;s Signals</h2></div>' +
          '<div class="qrx-fp-meta"><span class="qrx-fp-live"><span class="qrx-fp-dot"></span>Live</span><span class="qrx-fp-date"></span><a class="qrx-fp-all" href="/signals/">All stories →</a></div></header>' +
        '<div class="qrx-fp-stories"></div><div class="qrx-fp-more"></div>' +
        '<div class="qrx-fp-lower">' +
          '<section class="qrx-fp-zone qrx-fp-weekly"><h3>This Week in Tech</h3><span class="sub">The five stories that defined the week</span><div class="rows"></div><a class="qrx-fp-zone-all" href="/this-week-in-tech/">Read the full briefing →</a></section>' +
          '<section class="qrx-fp-zone qrx-fp-exploit"><h3>Exploit Watch</h3><span class="sub">New CVEs · PoC repos · advisories</span><div class="rows"></div><a class="qrx-fp-zone-all" href="https://forge.quantumrx.eu/exploit-watch.html">Open the security feed →</a></section>' +
        '</div>' +
      '</div>';

    var hero = document.querySelector('.qrx-hero');
    if (hero && hero.parentNode) hero.parentNode.insertBefore(front, hero.nextSibling);
    else { var nav = viewport.querySelector('.gh-navigation'); if (nav) viewport.insertBefore(front, nav.nextSibling); else viewport.insertBefore(front, viewport.firstChild); }

    try { front.querySelector('.qrx-fp-date').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long', year:'numeric' }); } catch (e) {}

    getJSON(API + '/api/signals-hub-feed').then(function (d) {
      if (!renderStories(front, d)) { front.remove(); return; }
      front.style.display = '';
    }).catch(function () { front.remove(); });

    getJSON(API + '/api/weekly-feed').then(function (d) { renderWeekly(front, d && d.current && d.current.stories); })
      .catch(function () { var z = front.querySelector('.qrx-fp-weekly'); if (z) z.remove(); }).then(function () { tidyLower(front); });
    getJSON(API + '/api/exploit-watch-feed').then(function (d) { renderExploit(front, (d && d.items) || []); })
      .catch(function () { var z = front.querySelector('.qrx-fp-exploit'); if (z) z.remove(); }).then(function () { tidyLower(front); });
  }

  // Label Ghost's native homepage post feed (.gh-feed) as "Featured Articles".
  function labelFeed(){
    if (labeled) return;
    if (!document.body || !document.body.classList.contains('home-template')) return;
    if (document.querySelector('.qrx-featured-head')) { labeled = true; return; }
    var feed = document.querySelector('.gh-feed'), parent, before;
    if (feed && feed.parentNode) { parent = feed.parentNode; before = feed; }
    else { var main = document.querySelector('.gh-main'); if (!main) return; parent = main; before = main.firstChild; }
    var head = document.createElement('div');
    head.className = 'qrx-featured-head';
    head.innerHTML = '<span>Featured Articles</span>';
    parent.insertBefore(head, before);
    labeled = true;
  }

  function run(){ buildFront(); labelFeed(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
  window.addEventListener('load', run);
  var fobs = new MutationObserver(function () {
    if (document.body && document.body.classList.contains('home-template')) { run(); if (built && labeled) fobs.disconnect(); }
  });
  fobs.observe(document.documentElement, { childList:true, subtree:true });
})();
</script>
